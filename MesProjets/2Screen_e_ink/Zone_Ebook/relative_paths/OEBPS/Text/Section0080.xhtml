  <h2 title="4 Quién dejará de hundir su mano…">4</h2>

  <p class="derecha">A<small>HORA BIEN</small>:</p>

  <p class="asangre">Quién dejará de hundir su mano en busca del tributo para la pequeña olvidada. El frío pagará. Pagará el viento. La lluvia pagará. Pagará el trueno.</p>

  <p class="salto25 asangre"><i>A Aurora y Julio Cortázar</i></p>
