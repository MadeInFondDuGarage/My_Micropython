  <h3 title="Se prohíbe mirar el césped">SE PROHÍBE MIRAR EL CÉSPED<a href="../Text/notas.xhtml#nt3" id="rf3"><sup>[3]</sup></a>&nbsp;</h3>

  <p>Maniquí desnudo entre escombros. Incendiaron la vidriera, te abandonaron en posición de ángel petrificado. No invento: esto que digo es una imitación de la naturaleza, una naturaleza muerta. Hablo de mí, naturalmente.</p>
