<body>
  <h3 class="oculto" title="Que alejen el agua y el vino…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Que alejen el agua y el vino</p>

    <p>que mi llegada sea la señal exacta</p>

    <p>de su alejamiento</p>

    <p>que mi boca sedienta</p>

    <p>sea la bandera, el signo,</p>

    <p>la rama venenosa,</p>

    <p>la orden ardiente,</p>

    <p>la hora, en fin,</p>

    <p>de detener el diluvio,</p>

    <p>de esconder las fuentes,</p>

    <p>de hacer carbón del agua,</p>

    <p>cenizas del vino.</p>

    <p class="salto10">Que alejen los frutos mágicos</p>

    <p>que los labios ebrios</p>

    <p>sólo encuentran lo candente,</p>

    <p>que seas de azufre,</p>

    <p>y tu cuerpo sea de llamas</p>

    <p>sobre un cuerpo de agua.</p>
  </div>
</body>
</html>
