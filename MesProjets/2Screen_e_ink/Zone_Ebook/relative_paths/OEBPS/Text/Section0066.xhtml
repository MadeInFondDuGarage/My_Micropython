<body>
  <h2 title="El miedo">EL MIEDO</h2>

  <div class="poema">
    <p>En el eco de mis muertes</p>

    <p>aún hay miedo.</p>

    <p>¿Sabes tú del miedo?</p>

    <p>Sé del miedo cuando digo mi nombre.</p>

    <p>Es el miedo,</p>

    <p>el miedo con sombrero negro</p>

    <p>escondiendo ratas en mi sangre,</p>

    <p>o el miedo con labios muertos</p>

    <p>bebiendo mis deseos.</p>

    <p>Sí. En el eco de mis muertes</p>

    <p>aún hay miedo.</p>
  </div>
</body>
