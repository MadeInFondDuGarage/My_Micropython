<body>
  <h2 title="Sueño">SUEÑO</h2>

  <div class="poema">
    <p>Estallará la isla del recuerdo</p>

    <p>La vida será un acto de candor</p>

    <p>Prisión</p>

    <p>para los días sin retorno</p>

    <p>Mañana</p>

    <p>los monstruos del bosque destruirán la playa</p>

    <p>sobre el vidrio del misterio</p>

    <p>Mañana</p>

    <p>la carta desconocida encontrará las manos del alma</p>
  </div>
