<body>
  <h2 title="Origen">ORIGEN</h2>

  <div class="poema">
    <p>Hay que salvar al viento</p>

    <p>los pájaros queman el viento</p>

    <p>en los cabellos de la mujer solitaria</p>

    <p>que regresa de la naturaleza</p>

    <p>y teje tormentos</p>

    <p>Hay que salvar al viento</p>
  </div>
