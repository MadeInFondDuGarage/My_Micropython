<body>
  <h2 title="9 Estos huesos brillando en la noche…">9</h2>

  <div class="poema">
    <p>Estos huesos brillando en la noche,</p>

    <p>estas palabras como piedras preciosas</p>

    <p>en la garganta viva de un pájaro petrificado,</p>

    <p>este verde muy amado,</p>

    <p>este lila caliente,</p>

    <p>este corazón sólo misterioso.</p>
  </div>
