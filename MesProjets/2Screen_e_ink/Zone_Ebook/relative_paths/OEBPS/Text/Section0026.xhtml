<body>
  <h3 title="Irme en un barco negro">IRME EN UN BARCO NEGRO</h3>

  <div class="poema">
    <p>las sombras escudan al humo veloz que</p>

    <p class="evitasgc-4">danza en la trama de</p>

    <p class="evitasgc-4">este festival silencioso</p>

    <p>las sombras esconden varios puntos oscuros que</p>

    <p>giran y giran entre tus ojos</p>

    <p>mi pluma retarda el TÚ anhelante</p>

    <p>mi sien late mil veces TU nombre</p>

    <p>si tus ojos pudieran venir!</p>

    <p>acá si amor acá</p>

    <p>entre las sombras el humo y la danza</p>

    <p>entre las sombras lo negro y yo</p>
  </div>
