  <h3 title="Sobre un poema de Rubén Darío">SOBRE UN POEMA DE RUBÉN DARÍO<a href="../Text/notas.xhtml#nt20" id="rf20"><sup>[20]</sup></a>&nbsp;</h3>

  <div class="derecha">
    <p><i>In memorian L.C</i>.</p>

    <p class="salto10"><i>A Marguerite Duras y a</i></p>

    <p><i>Francesco Tentori Montalto</i></p>
  </div>

  <div class="salto25 poema">
    <p>Sentada en el fondo de un lago.</p>

    <p>Ha perdido la sombra,</p>

    <p>no los deseos de ser, perder.</p>

    <p>Está sola con sus imágenes.</p>

    <p>Vestida de roja, no mira.</p>

    <p class="salto10">¿Quién ha llegado a este lugar</p>

    <p>al que siempre nadie llega?</p>

    <p>El señor de las muertes de rojo.</p>

    <p>El enmascarado por su cara sin rostro.</p>

    <p>El que llegó en su busca la lleva sin él.</p>

    <p class="salto10">Vestida de negro, ella mira.</p>

    <p>La que no supo morirse de amor y por eso nada aprendió</p>

    <p>Ella está triste porque no está.</p>
  </div>
