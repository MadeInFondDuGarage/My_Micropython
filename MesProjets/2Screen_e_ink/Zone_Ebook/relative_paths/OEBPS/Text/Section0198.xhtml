  <h3 title="Continuidad">CONTINUIDAD</h3>

  <p>No nombrar las cosas por sus nombres. Las cosas tiene bordes dentados, vegetación lujuriosa. Pero quién habla en la habitación llena de ojos. Quién dentellea con una boca de papel. Nombres que vienen, sombras con máscaras. Cúrame del vacío —dije. (La luz se amaba en mi oscuridad. Supe que no había cuando me encontré diciendo: soy yo.) Cúrame —dije.</p>
