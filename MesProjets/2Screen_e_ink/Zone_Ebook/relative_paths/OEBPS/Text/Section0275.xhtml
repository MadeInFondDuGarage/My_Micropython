  <h3 title="Memorial fantasma">MEMORIAL FANTASMA</h3>

  <p>Noche ciegamente mía. Sueño del cuerpo transparente como un árbol de vidrio.</p>

  <p>Horror de buscar tus ojos en el espacio lleno de gritos del poema.<a href="../Text/notas.xhtml#nt10" id="rf10"><sup>[10]</sup></a></p>
