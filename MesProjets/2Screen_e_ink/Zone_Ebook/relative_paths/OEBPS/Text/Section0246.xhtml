<body>
  <h3 title="Aproximaciones">APROXIMACIONES</h3>

  <p class="derecha"><i>Buenos Aires 1956-1958</i></p>

  <div class="salto25 poema">
    <p>abrazando a tu sombra en un sueño</p>

    <p>mis huesos se arqueaban como flores</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>los bordes de silencio de las cosas</p>

    <p>lo callado que recorre la presencia de las cosas</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>estos ojos</p>

    <p>sólo se abren</p>

    <p>para evaluar la ausencia</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>quién me perdió</p>

    <p>en el silencio fantasma de las palabras</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>pasos en la niebla</p>

    <p>del jardín de lilas</p>

    <p>el corazón regresa</p>

    <p>a su luz negra</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>quisieras vivir siempre</p>

    <p>como algo olvidado en la mano de un muerto</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>¿Por qué escribo?</p>

    <p>Por qué sollozo en madrugada</p>

    <p>Por qué de pronto este sabor a canto de cisne</p>

    <p>Esta espuma verde acumulada en la garganta</p>

    <p class="salto10">Mi corazón es absurdo como una máscara en la lluvia</p>

    <p>El espanto lo asemeja al mar</p>

    <p>Mi cuerpo es una invasión de tambores en el silencio de la noche</p>

    <p class="salto10">Por qué estas noches como un oasis para brujas</p>

    <p>Por qué esta conjuración de ausencias</p>

    <p>Este secuestro de la hija del viento</p>

    <p class="salto10">Me rodea en la noche una logia exterminadora</p>

    <p>te llamo y no vienes</p>

    <p>Te amo y no vienes</p>

    <p class="salto10">Por qué viniste como el relámpago</p>

    <p>y me dejaste sola en lo devastado</p>

    <p class="salto10">Si escucharas mi rumor a celda minúscula</p>

    <p>poblada de agonizantes</p>

    <p>mi jadeo de asfixiada</p>

    <p class="salto10">Si de pronto me vieras en la orilla del despertar,</p>

    <p>cantante enmudecida en la cima de su asombro</p>

    <p>Si me vieras atada a tu rostro</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Canciones ambiguas</p>

    <p>de algún país arrasado por las lluvias</p>

    <p>Canciones de campaneros</p>

    <p>memorias de la noche que algún hombre amó</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>un pueblo de la luz arderá en la sombra</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Si un mar por una lira</p>

    <p>ángeles furiosos ahogó en el viento</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>noche amada nunca como ahora</p>

    <p>en que la pierdo</p>

    <p>en lo incierto del día</p>

    <p>que rompe lo que me une a mi vida</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>todos comprenden lo que nadie</p>

    <p>nadie comprende lo que todos</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>no lejos del alba nace el día</p>

    <p>visión de las últimas flores</p>

    <p>la luz gira en mi rostro que esperaba</p>

    <p>las nupcias de los cuatro elementos</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>siempre habrá el miedo de otras voces</p>

    <p>el miedo de otras voces</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>es tarde para reconocer el sol</p>

    <p>el sol está y mis ojos cantan</p>

    <p>el sol está su primavera es negra</p>

    <p>el sol está y es tarde</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>éste es mi invierno elegido</p>

    <p>éste es mi deber ante la niebla y lo confuso</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>querer quedarse queriendo irse</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>El amor dibuja en mis ojos el cuerpo anhelado</p>

    <p>como un lanzador de cuchillos</p>

    <p>tatuando en la pared con temor y destreza</p>

    <p>la desnudez inmóvil de la que ama.</p>

    <p class="salto10">Así, en lo oscuro, fragmentos de los que amé,</p>

    <p>lúbricos rostros adolescentes,</p>

    <p>entre ellos soy otro fantasma.</p>

    <p class="salto10">A veces, en la noche,</p>

    <p>me dijeron que mi corazón no existe.</p>

    <p>pero escucho canciones ambiguas</p>

    <p>de un país arrasado por las lluvias.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Lo que no te dieron.</p>

    <p>Lo que no te dan.</p>

    <p>Noviciado atroz.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>así iba yo devorando tinieblas</p>

    <p>una flor en mi mano de sonámbula</p>

    <p>una sonrisa ajena pegada a mis labios</p>

    <p>mi cuerpo desnudo como una palabra</p>

    <p>mis deseos abrazados a su imagen</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>si solamente hicieran una hoguera en mis labios</p>

    <p>para quemar las sílabas que no se unen</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>el gran pájaro de cuerpo de paja teclea el invisible piano del viento</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>La luz amontonándose inservible a espaldas del sol. Niebla en el pozo. Hacer dibujos en un viejo muro rosado.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>pájaros polvorientos</p>

    <p>con sangre vieja en las alas</p>

    <p>flores de metal olvidadas</p>

    <p>telarañas enamoradas del espacio</p>

    <p>en donde vive el tiempo que pasa</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>se han ocultado</p>

    <p>entre los sonidos de la noche</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>El jardín triangular</p>

    <p>que oprimo en mi mano</p>

    <p>chorrea flores de agua</p>

    <p>Abejas de perfume azul</p>

    <p>fosforecen como ojos enemigos</p>

    <p>incrustados en mis huesos</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>soledad cerrada y dichosa</p>

    <p>promesas de súbito cumplidas</p>

    <p>como campanas en un amanecer helado</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>detrás de las formas sin consuelo</p>

    <p>el día se abre como un canto doloroso</p>

    <p>un alarido mágico formulador en el viento</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Apenas remitida del cielo y cerrada</p>

    <p>en donde yo era sin color y sin forma</p>

    <p>sólo una contemplada.</p>

    <p>Apenas devuelta de crepúsculos</p>

    <p>de playa sola, de corazón silenciosa.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Yo creo en los espejos</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>La noche canta amordazada</p>

    <p>Corazones incendiados</p>

    <p>en la memoria de mi boca</p>

    <p>me penetran vasos vacíos.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>En la cavidad iluminada</p>

    <p>en que este instante es perla pródiga</p>

    <p>escucho el ronco abrirse de mi memoria</p>

    <p>como una puerta al viento.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Si morir es memoria cerrada.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Yo trabajo el silencio</p>

    <p>lo hago llama</p>
  </div>

  <p class="salto10 centrado">*</p>

  <p class="salto10 centrado">I</p>

  <div class="poema">
    <p>Yo no canto, no celebro,</p>

    <p>no bailo desnuda y ebria</p>

    <p>sobre mi ataúd.</p>

    <p>Pero yo le ruego al poema,</p>

    <p>yo le pido la luna al poema.</p>
  </div>

  <p class="salto10 centrado">II</p>

  <div class="salto10 poema">
    <p>He desatado el corazón de la lluvia</p>

    <p>Antiguas baladas</p>

    <p>alimentaron mi silencio.</p>
  </div>

  <p class="salto10 centrado">III</p>

  <div class="salto10 poema">
    <p>El amor es este viaje inútil, pero muy suave,</p>

    <p>al otro lado del espejo.</p>

    <p class="salto10">Tantas criaturas en mi sed y en mi vaso vacío.</p>
  </div>

  <p class="salto10 centrado">IV</p>

  <div class="salto10 poema">
    <p>La niña que fui</p>

    <p>ahora en mi memoria</p>

    <p>entre mis muertos.</p>

    <p class="salto10">De lágrimas se nutrirá mil años.</p>

    <p>De destierro el sonido de su voz</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>yo vi ese rostro partir la mañana</p>

    <p>en dos noches iguales.</p>

    <p>Mi cuerpo se pobló de muertos</p>

    <p>y mi lengua de palabras crispadas,</p>

    <p>ruinas de un canto olvidado.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>COMO YO LA QUERÍA</p>

    <p>Morir como muere un animal pequeño</p>

    <p>en los cuentos para niños.</p>

    <p class="salto10">Eso tan terrible.</p>

    <p>Lleno de hermosura.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Las cosas amarilleaban frente a mis ojos</p>

    <p>recién venidos de un sueño de otoño.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Si la noche no es azul,</p>

    <p>si el verano es una lenta plaga.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>habla al gran espacio vacío</p>

    <p>en donde corre una niña</p>

    <p>que ya no reconoces</p>

    <p class="salto10">sólo deseo no tener nada con nada</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Has dicho tantas palabras</p>

    <p>que ya no te atreves a oírte llamar.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>En mis huesos la noche tatuada.</p>

    <p>La noche y la nada.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Escribes poemas</p>

    <p>porque necesitas</p>

    <p>un lugar</p>

    <p>en donde sea lo que no es</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>El aire se eternizaba</p>

    <p>en caras plateadas o coléricas</p>

    <p class="salto10">Se puede morir de presencias</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Hay un rostro salvajemente asomado al día</p>

    <p>que se abre en dos noches iguales.</p>

    <p class="salto10">¿Quién cantará al amor?</p>

    <p>No yo.</p>

    <p>Yo amo.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>y finalmente</p>

    <p class="salto10">un himno sin desdicha</p>

    <p>un sueño como una estrella</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>ebria del silencio</p>

    <p>de los jardines abandonados</p>

    <p>mi memoria se abre y se cierra</p>

    <p>como una puerta al viento</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Perdida en el silencio</p>

    <p>de las palabras fantasmas.</p>

    <p>Si vivir es memoria cerrada</p>

    <p>quién me pierde</p>

    <p>en el silencio fantasma</p>

    <p>de las palabras</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Zona de la visión perpetua.</p>

    <p>Yo la atravesé en un misterioso gemido.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>Yo he dado el reino de mi edad a la noche de los cuerpos</p>

    <p>para saber si hay una luz detrás de la puerta cerrada.</p>
  </div>

  <p class="salto10 centrado">*</p>

  <div class="salto10 poema">
    <p>En un lugar de temblores</p>

    <p>manos oscilan enamoradas</p>

    <p>en la dulzura de mi rostro</p>

    <p>sobre tu oscuridad ardiente.</p>
  </div>
</body>
