<body>
  <h3 title="Para Janis Joplin">PARA JANIS JOPLIN</h3>

  <p class="centrado">(<i>fragmento</i>)</p>

  <div class="salto25 poema">
    <p>a cantar dulce y a morirse luego.</p>

    <p>no:</p>

    <p>a ladrar.</p>

    <p class="salto10">así como duerme la gitana de Rousseau.</p>

    <p>así cantás, más las lecciones de terror.</p>

    <p class="salto10">hay que llorar hasta romperse</p>

    <p>para crear o decir una pequeña canción,</p>

    <p>gritar tanto para cubrir los agujeros de la ausencia</p>

    <p>eso hiciste vos, eso yo.</p>

    <p>me pregunto si eso no aumentó el error.</p>

    <p class="salto10">hiciste bien en morir.</p>

    <p>por eso te hablo,</p>

    <p>por eso me confío a una niña monstruo.</p>
  </div>

  <p class="salto10 derecha">1972</p>
</body>
