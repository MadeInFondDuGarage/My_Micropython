  <h3 title="IV Alguna vez, tal vez…">IV</h3>

  <p>Alguna vez, tal vez, encontraremos refugio en la realidad verdadera. Entretanto ¿puedo decir hasta qué punto estoy en contra?</p>

  <p class="salto10">Te hablo de la soledad mortal. Hay cólera en el destino porque se acerca, entre las arenas y las piedras, el lobo gris. ¿Y entonces? Porque romperá todas las puertas, porque sacará afuera a los muertos para que devoren a los vivos, para que sólo haya muertos y los vivos desaparezcan. No tengas miedo del lobo gris. Yo lo nombré para comprobar que existe y porque hay una voluptuosidad inadjetivable en el hecho de comprobar.</p>

  <p class="salto10">Las palabras hubieran podido salvarme, pero estoy demasiado viviente. No, no quiero cantar muerte. Mi muerte… el lobo gris… la matadora que viene de la lejanía… ¿No hay un alma viva en esta ciudad? Porque ustedes están muertos. ¿Y qué espera puede convertirse en esperanza si está todos muertos? ¿Y cuándo vendrá lo que esperamos? ¿Cuándo dejaremos de huir? ¿Cuándo ocurrirá todo esto? ¿Cuándo? ¿Dónde? ¿Cómo? ¿Cuánto? ¿Por qué? ¿Para quién?</p>
