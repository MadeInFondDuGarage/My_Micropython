<body>
  <h2 title="Hombre común">HOMBRE COMÚN</h2>

  <div class="poema">
    <p>siempre reniega azules</p>

    <p>conforme a la ruta</p>

    <p>negra la línea recta</p>

    <p>negra la tierra sana</p>

    <p>temblor extraño que no agita</p>

    <p>pechos sí y no velludos</p>

    <p>esperanzas no fundidas revuelven</p>

    <p>a él a ella a todos</p>

    <p>mirad! su carne transborda</p>

    <p>reminiscencias ganado opaco</p>
  </div>
</body>
