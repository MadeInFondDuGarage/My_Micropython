  <h3 title="Cantora nocturna">CANTORA NOCTURNA</h3>

  <p class="derecha"><i>Joe, macht die Musik von damals macht…</i></p>

  <p class="salto25">La que murió de su vestido azul está cantando. Canta imbuida de muerte al sol de su ebriedad. Adentro de su canción hay un vestido azul, hay un caballo blanco, hay un corazón verde tatuado con los ecos de los latidos de su corazón muerto. Expuesta a todas las perdiciones, ella canta junto a una niña extraviada que es ella: su amuleto de la buena suerte. Y a pesar de la niebla verde en los labios y del frío gris en los ojos, su voz corroe la distancia que se abre entre la sed y la mano que busca el vaso. Ella canta.</p>

  <p class="salto25 asangre"><i>A Olga Orozco</i></p>
