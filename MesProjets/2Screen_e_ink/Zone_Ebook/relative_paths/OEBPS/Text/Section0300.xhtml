<body>
  <h3 class="oculto" title="lloro, miro el mar y lloro…">o</h3>

  <div class="poema">
    <p class="saltoinicio">lloro, miro el mar y lloro.</p>

    <p>canto algo, muy poco.</p>

    <p class="salto10">hay un mar, hay la luz.</p>

    <p>hay sombras, hay un rostro.</p>

    <p class="salto10">un rostro con rastros de paraíso perdido.</p>

    <p class="salto10">he buscado.</p>

    <p class="salto10">sino que he buscado,</p>

    <p>sino que agonizo.</p>
  </div>
