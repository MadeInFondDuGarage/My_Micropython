  <h3 title="I —Se abrió la flor de la distancia…">I</h3>

  <p>—Se abrió la flor de la distancia. Quiero que mires por la ventana y me digas lo que veas, gestos inconclusos, objetos ilusorios, formas fracasadas… Como si te hubieses preparado desde la infancia, acércate a la ventana.</p>

  <p class="salto10">—Un café lleno de sillas vacías, iluminado hasta la exasperación, la noche en forma de ausencia, el cielo como de una materia deteriorada, gotas de agua en una ventana, pasa alguien que no vi nunca, que no veré jamás.</p>

  <p class="salto10">—¿Qué hice del don de la mirada?</p>

  <p class="salto10">—Una lámpara demasiado intensa, una puerta abierta, alguien fuma en la sombra, el tronco y el follaje de un árbol, un perro se arrastra, una pareja de enamorados se pasea despacio bajo la lluvia, un diario en una zanja, un niño silbando…</p>

  <p class="salto10">—Proseguí</p>

  <p class="salto10">—(<i>En tono vengativo</i>). Una equilibrista enana se echa al hombro una bolsa de huesos y avanza por el alambre con los ojos cerrados.</p>

  <p class="salto10">—¡No!</p>

  <p class="salto10">—Está desnuda pero lleva sombrero, tiene pelos por todas partes y es de color gris de modo que con sus cabellos rojos parece la chimenea de la escenografía teatral de un teatro para locos. Un gnomo desdentado la persigue mascando las lentejuelas…</p>

  <p class="salto10">—Basta, por favor.</p>

  <p class="salto10">—(<i>En tono fatigado</i>). Una mujer grita, un niño llora. Siluetas espían desde sus madrigueras. Ha pasado un transeúnte. Se ha cerrado una puerta.</p>
