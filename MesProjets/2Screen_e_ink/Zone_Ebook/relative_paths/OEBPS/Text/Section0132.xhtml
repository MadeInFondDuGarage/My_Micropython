<body>
  <h3 title="Presencia">PRESENCIA</h3>

  <div class="poema">
    <p>tu voz</p>

    <p>en este no poder salirse las cosas</p>

    <p>de mi mirada</p>

    <p>ellas me desposeen</p>

    <p>hacen de mí un barco sobre un río de piedras</p>

    <p>si no es tu voz</p>

    <p>lluvia sola en mi silencio de fiebres</p>

    <p>tú me desatas los ojos</p>

    <p>y por favor</p>

    <p>que me hables</p>

    <p>siempre</p>
  </div>
</body>
