<body>
  <h2 title="Siempre">SIEMPRE</h2>

  <p class="derecha"><i>A Rubén Vela</i></p>

  <div class="salto25 poema">
    <p>Cansada del estruendo mágico de las vocales</p>

    <p>Cansada de inquirir con los ojos elevados</p>

    <p>Cansada de la espera del yo de paso</p>

    <p>Cansada de aquel amor que no sucedió</p>

    <p>Cansada de mis pies que sólo saben caminar</p>

    <p>Cansada de la insidiosa fuga de preguntas</p>

    <p>Cansada de dormir y de no poder mirarme</p>

    <p>Cansada de abrir la boca y beber el viento</p>

    <p>Cansada de sostener las mismas vísceras</p>

    <p>Cansada del mar indiferente a mis angustias</p>

    <p>¡Cansada de Dios! ¡Cansada de Dios!</p>

    <p>Cansada por fin de las muertes de turno</p>

    <p>a la espera de la hermana mayor</p>

    <p>la otra la gran muerte</p>

    <p>dulce morada para tanto cansancio</p>
  </div>
</body>
</html>
