<body>
  <h2 title="El ausente">EL AUSENTE</h2>

  <p class="centrado">I</p>

  <div class="salto10 poema">
    <p>La sangre quiere sentarse.</p>

    <p>Le han robado su razón de amor.</p>

    <p>Ausencia desnuda.</p>

    <p>Me deliro, me desplumo.</p>

    <p>¿Qué diría el mundo si dios</p>

    <p>lo hubiera abandonado así?</p>
  </div>

  <p class="salto10 centrado">II</p>

  <div class="salto10 poema">
    <p>Sin ti</p>

    <p>el sol cae como un muerto abandonado.</p>

    <p class="salto10">Sin ti</p>

    <p>me torno en mis brazos</p>

    <p>y me llevo la vida</p>

    <p>a mendigar fervor.</p>
  </div>
</body>
