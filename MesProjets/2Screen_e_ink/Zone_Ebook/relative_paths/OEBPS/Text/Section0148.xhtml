<body>
  <h3 title="Anillos de ceniza">ANILLOS DE CENIZA</h3>

  <p class="derecha"><i>A Cristina Campo</i></p>

  <div class="salto25 poema">
    <p>Son mis voces cantando</p>

    <p>para que no canten ellos,</p>

    <p>los amordazados grismente en el alba,</p>

    <p>los vestidos de pájaro desolado en la lluvia.</p>

    <p class="salto10">Hay, en la espera,</p>

    <p>un rumor a lila rompiéndose.</p>

    <p>Y hay, cuando viene el día,</p>

    <p>una partición del sol en pequeños soles negros.</p>

    <p>Y cuando es de noche, siempre,</p>

    <p>una tribu de palabras mutiladas</p>

    <p>busca asilo en mi garganta,</p>

    <p>para que no cante ellos,</p>

    <p>los funestos, los dueños del silencio.</p>
  </div>
</body>
