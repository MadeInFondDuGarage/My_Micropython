  <h3 title="Alguien cae en su primera caída">ALGUIEN CAE EN SU PRIMERA CAÍDA<a href="../Text/notas.xhtml#nt21" id="rf21"><sup>[21]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A Ramón Xirau</i></p>

  <div class="salto25 poema">
    <p>Palabra por palabra</p>

    <p>tuvo que aprender</p>

    <p>del último otro lado.</p>
