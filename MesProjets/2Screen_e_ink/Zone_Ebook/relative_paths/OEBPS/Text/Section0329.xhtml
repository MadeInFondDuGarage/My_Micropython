  <h3 class="oculto" title="SOMBRA: Je régarde ma main déserte…">o</h3>

  <p class="saltoinicio">S<small>OMBRA</small>: Je régarde ma main déserte.</p>

  <p class="evitasgc-8">Ai-je tenu la rose pure?</p>

  <p class="evitasgc-8">O ma nuit, nul jour ne la tue.</p>

  <p>—K: Sombra lloró y habló más que en toda su existencia junta. Fue poco antes de caer en el círculo opaco.</p>

  <p>—X: Vayamos por las calles ahora que la tarde se cubrió de pasionarias.</p>

  <p>—U<small>NA SOMBRA</small>: Le devant est louable (on peut le louer par heure).</p>

  <p>Le derrier est lavable (on peut le Labrounir étant donnée qu’ on a souffert as el desdichado, ô monde, ô langage, ô Isidore!</p>
