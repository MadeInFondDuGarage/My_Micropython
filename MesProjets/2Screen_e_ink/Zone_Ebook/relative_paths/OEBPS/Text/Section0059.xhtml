<body>
  <h2 title="Exilio">EXILIO</h2>

  <p class="derecha"><i>A Raúl Gustavo Aguirre</i></p>

  <div class="salto25 poema">
    <p>Esta manía de saberme ángel,</p>

    <p>sin edad,</p>

    <p>sin muerte en que vivirme,</p>

    <p>sin piedad por mi nombre</p>

    <p>ni por mis huesos que lloran vagando.</p>

    <p class="salto10">¿Y quién no tiene un amor?</p>

    <p>¿Y quién no goza entre amapolas?</p>

    <p>¿Y quién no posee un fuego, una muerte,</p>

    <p>un miedo, algo horrible,</p>

    <p>aunque fuere con plumas,</p>

    <p>aunque fuere con sonrisas?</p>

    <p class="salto10">Siniestro delirio amar a una sombra.</p>

    <p>La sombra no muere.</p>

    <p>Y mi amor</p>

    <p>sólo abraza a lo que fluye</p>

    <p>como lava del infierno:</p>

    <p>una logia callada,</p>

    <p>fantasmas en dulce erección,</p>

    <p>sacerdotes de espuma,</p>

    <p>y sobre todo ángeles,</p>

    <p>ángeles bellos como cuchillos</p>

    <p>que se elevan en la noche</p>

    <p>y devastan la esperanza.</p>
  </div>
</body>
