  <h3 class="oculto" title="Zona de la tensión perpetua…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Zona de la tensión perpetua.</p>

    <p>Yo la atravesé con mi voz.</p>

    <p>La atravesé en un misterioso gemido</p>

    <p>para sólo llegar a una tensión perpetua</p>
