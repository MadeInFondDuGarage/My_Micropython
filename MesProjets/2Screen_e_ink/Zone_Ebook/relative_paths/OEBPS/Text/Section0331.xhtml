  <h3 title="Texto de sombra">TEXTO DE SOMBRA<a href="../Text/notas.xhtml#nt26" id="rf26"><sup>[26]</sup></a>&nbsp;</h3>

  <p>¿Qué máscara usaré cuando emerja de la sombra? Hablo de esa perra que en el silencio teje una trama de falso silencio para que yo me confunda de silencio y cante del modo correcto para dirigirse a los muertos.</p>

  <p>Indeciblemente caigo en esto que en mí encuentro más o menos presente cuando alguien formula mi nombre. ¿Por qué mi boca está siempre abierta?</p>
