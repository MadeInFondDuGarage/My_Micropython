<body>
  <h3 title="Sólo un amor">SÓLO UN AMOR</h3>

  <div class="poema">
    <p>Mi amor se amplía.</p>

    <p>Es un paracaídas perfecto.</p>

    <p>Es un clic que se exhala y</p>

    <p class="evitasgc-1">su pecho se hace inmenso.</p>

    <p>Mi amor no ruge</p>

    <p class="evitasgc-8">no clama</p>

    <p class="evitasgc-8">no ruega</p>

    <p class="evitasgc-8">no ríe.</p>

    <p>Su cuerpo es un ojo.</p>

    <p>Su piel es un mapamundi.</p>

    <p>Mis palabras perforan la</p>

    <p class="evitasgc-1">última señal de su nombre.</p>

    <p>Mis besos son anguilas que él</p>

    <p class="evitasgc-1">Se ufana en dejar resbalar.</p>

    <p>Mis caricias un chorro reminiscente de</p>

    <p class="evitasgc-1">música sobre fuentes de Roma.</p>

    <p>Nadie pudo huir aún de su territorio</p>

    <p class="evitasgc-1">anímico.</p>

    <p>No hay rutas ni pliegues ni insectos.</p>

    <p>Todo es tan terso que mis lágrimas se</p>

    <p class="evitasgc-1">sublevan.</p>

    <p>Mi creación es una mojigatería junto a</p>

    <p class="evitasgc-1">su rubio carromato.</p>

    <p>En estos momentos el tintero alza vuelo y</p>

    <p class="evitasgc-1">enfila hacia linderos inacabables de</p>

    <p class="evitasgc-1">mosquitos haciendo el amor.</p>

    <p>Suena el fatídico sonido. Ya no vuelo.</p>

    <p>Es mi amor que se amplía.</p>
  </div>
</body>
