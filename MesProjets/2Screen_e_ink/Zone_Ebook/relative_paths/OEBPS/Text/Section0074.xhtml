<body>
  <h2 title="Desde esta orilla">DESDE ESTA ORILLA</h2>

  <div class="derecha cursiva">
    <p><i>Soy pura</i></p>

    <p><i>porque la noche que me encerraba</i></p>

    <p><i>en su negror mortal</i></p>

    <p><i>ha huido</i>.</p>
  </div>

  <p class="salto10 derecha">W. B<small>LAKE</small></p>

  <div class="salto25 poema">
    <p>Aún cuando el amado</p>

    <p>brille en mi sangre</p>

    <p>como una estrella colérica,</p>

    <p>me levanto de mi cadáver</p>

    <p>y cuidando de no hollar mi sonrisa muerta</p>

    <p>voy al encuentro del sol.</p>

    <p class="salto10">Desde esta orilla de nostalgia</p>

    <p>todo es ángel.</p>

    <p>La música es amiga del viento</p>

    <p>amigo de las flores</p>

    <p>amigas de la lluvia</p>

    <p>amiga de la muerte.</p>
  </div>
</body>
