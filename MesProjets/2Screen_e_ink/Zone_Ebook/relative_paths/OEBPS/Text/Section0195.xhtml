<body>
  <h3 title="Estar">ESTAR</h3>

  <div class="poema">
    <p>Vigilas desde este cuarto</p>

    <p>donde la sombra temible es la tuya.</p>

    <p class="salto10">No hay silencio aquí</p>

    <p>sino frases que evitas oír.</p>

    <p class="salto10">Signos en los muros</p>

    <p>narran la bella lejanía.</p>

    <p class="salto10">(Haz que no muera</p>

    <p>sin volver a verte)</p>
  </div>
</body>
