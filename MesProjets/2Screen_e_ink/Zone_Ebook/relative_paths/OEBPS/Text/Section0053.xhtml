<body>
  <h2 title="La jaula">LA JAULA</h2>

  <div class="poema">
    <p>Afuera hay sol.</p>

    <p>No es más que un sol</p>

    <p>Pero los hombres lo miran</p>

    <p>y después cantan.</p>

    <p class="salto10">Yo no sé del sol.</p>

    <p>Yo sé la melodía del ángel</p>

    <p>y el sermón caliente</p>

    <p>del último viento.</p>

    <p>Sé gritar hasta el alba</p>

    <p>cuando la muerte se posa desnuda</p>

    <p>en mi sombra.</p>

    <p class="salto10">Yo lloro debajo de mi nombre.</p>

    <p>Yo agito pañuelos en la noche</p>

    <p>y sedientos de realidad</p>

    <p>bailan conmigo</p>

    <p>Yo oculto clavos</p>

    <p>para escarnecer a mis sueños enfermos.</p>

    <p class="salto10">Afuera hay sol.</p>

    <p>Yo me visto de cenizas.</p>
  </div>
</body>
</html>
