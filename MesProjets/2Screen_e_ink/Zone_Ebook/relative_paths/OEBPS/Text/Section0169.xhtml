<body>
  <h3 title="Sombra de los días a venir">SOMBRA DE LOS DÍAS A VENIR</h3>

  <p class="derecha"><i>A Ivonne A. Bordelois</i></p>

  <div class="salto25 poema">
    <p>Mañana</p>

    <p>me vestirán con cenizas al alba,</p>

    <p>me llenarán la boca de flores.</p>

    <p>Aprenderé a dormir</p>

    <p>en la memoria de un muro,</p>

    <p>en la respiración</p>

    <p>de un animal que sueña.</p>
  </div>
</body>
