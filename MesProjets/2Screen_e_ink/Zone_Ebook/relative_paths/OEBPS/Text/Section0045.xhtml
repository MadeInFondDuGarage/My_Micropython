<body>
  <h2 title="La última inocencia">LA ÚLTIMA INOCENCIA</h2>

  <div class="poema">
    <p>Partir</p>

    <p>en cuerpo y alma</p>

    <p>partir.</p>

    <p class="salto10">Partir</p>

    <p>deshacerse de las miradas</p>

    <p>piedras opresoras</p>

    <p>que duermen en la garganta.</p>

    <p class="salto10">He de partir</p>

    <p>no más inercia bajo el sol</p>

    <p>no más sangre anonadada</p>

    <p>no más formar fila para morir.</p>

    <p class="salto10">He de partir</p>

    <p class="salto10">Pero arremete, ¡viajera!</p>
  </div>
</body>
