  <h2 title="29 Aquí vivimos con una mano en la garganta…">29</h2>

  <p class="asangre">Aquí vivimos con una mano en la garganta. Que nada es posible ya lo sabían los que inventaban lluvias y tejían palabras con el tormento de la ausencia. Por eso en sus plegarias había un sonido de manos enamoradas de la niebla.</p>

  <p class="salto25 asangre"><i>A André Pieyre de Mandiargues</i></p>
