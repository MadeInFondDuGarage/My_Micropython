<body>
  <h3 title="Caer">CAER</h3>

  <div class="poema">
    <p>Nunca de nuevo la esperanza</p>

    <p>en un ir y venir</p>

    <p>de nombres, de figuras.</p>

    <p>Alguien soñó muy mal,</p>

    <p>alguien consumió por error</p>

    <p>las distancias olvidadas.</p>
  </div>
