  <h3 title="Rescate">RESCATE</h3>

  <p>Y es siempre el jardín de lilas del otro lado del río. Si el alma pregunta si queda lejos se le responderá: del otro lado del río, no éste sino aquél.</p>

  <p class="salto25 asangre"><i>A Octavio Paz</i></p>
