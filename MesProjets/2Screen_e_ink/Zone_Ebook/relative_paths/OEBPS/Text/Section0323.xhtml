  <h3 title="Algunos textos de sombra">ALGUNOS TEXTOS DE SOMBRA<a href="../Text/notas.xhtml#nt24" id="rf24"><sup>[24]</sup></a>&nbsp;</h3>

  <div class="epigrafe">
    <p><i>Es una exhortación a los jóvenes para que</i></p>

    <p><i>no estén tristes, ya que existen la</i></p>

    <p><i>naturaleza, la libertad, Goethe, Schiller</i>,</p>

    <p><i>Shakespeare, las flores, los insectos, etc</i>.</p>

    <p class="salto10 derecha">F<small>RANZ</small> K<small>AFKA</small></p>
  </div>

  <p class="salto25 centrado"><i>Un jardín</i></p>

  <p class="salto25">Pido el silencio</p>

  <p>Mi historia es larga triste como la cabellera de Ofelia</p>

  <p class="salto10">Es un jardín dibujado en mi cuaderno. Madrugada. Instante desgarrado en que la luz es tentación y promesa porque algo ha muerto, la noche</p>

  <p class="salto10">—<i>Sólo quería ver el jardín</i>.</p>

  <p>—<i>Soy mi propio espectro.</i></p>

  <p>—<i>No hay que jugar al espectro porque se llega a serlo.</i></p>

  <p>—¿Sos real?</p>

  <p>—La imagen de un corazón que encierra la imagen de un jardín por el que voy llorando.</p>

  <p>—<i>Ils jouent la pièce en étranger.</i></p>

  <p>—<i>Sinto o mundo chorar como lingua estrangeira.</i></p>

  <p>—<i>Das ganze verkerhrte Wesen fort.</i></p>

  <p>—<i>Another calling: my own words coming back…</i></p>
