<body>
  <h3 title="Solamente las noches">SOLAMENTE LAS NOCHES<a href="../Text/notas.xhtml#nt32" id="rf32"><sup>[32]</sup></a>&nbsp;</h3>

  <div class="derecha">
    <p><i>A Jean Aristeguieta</i>,</p>

    <p><i>A Árbol de Fuego</i>.</p>
  </div>

  <div class="salto25 poema">
    <p>escribiendo</p>

    <p>he pedido, he perdido.</p>

    <p class="salto10">en esta noche, en este mundo,</p>

    <p>abrazada a vos,</p>

    <p>alegría de naufragio.</p>

    <p class="salto10">he querido sacrificar mis días y mis semanas</p>

    <p>en las ceremonias del poema.</p>

    <p class="salto10">he implorado tanto</p>

    <p>desde el fondo de los fondos</p>

    <p>de mi escritura.</p>

    <p class="salto10">Coger y morir no tienen adjetivos.</p>
  </div>

  <p class="salto10 derecha">1972</p>
</body>
