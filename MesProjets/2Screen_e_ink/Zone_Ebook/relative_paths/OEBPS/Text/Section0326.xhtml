  <h3 title="El entendimiento">EL ENTENDIMIENTO</h3>

  <p>Empecemos por decir que Sombra había muerto. ¿Sabía Sombra que Sombra había muerto? Indudablemente. Sombra y ella fueron consocias durante años. Sombra fue su única albacea, su única amiga y la única que vistió luto por Sombra. Sombra no estaba tan terriblemente afligida por el triste suceso y el día del entierro lo solemnizó con un banquete.</p>

  <p>Sombra no borró el nombre de Sombra. La casa de comercio se conocía bajo la razón social «Sombra y Sombra». Algunas veces los clientes nuevos llamaban Sombra a Sombra; pero Sombra atendía por ambos nombres, como si ella, Sombra, fuese en efecto Sombra, quien había muerto.</p>
