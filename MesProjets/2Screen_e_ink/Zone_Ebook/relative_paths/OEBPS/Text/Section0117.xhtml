<body>
  <h3 class="oculto" title="los náufragos detrás de la sombra…">o</h3>

  <div class="poema">
    <p class="saltoinicio">los náufragos detrás de la sombra</p>

    <p>abrazaron a la que se suicidó</p>

    <p>con el silencio de su sangre</p>

    <p class="salto10">lo noche bebió vino</p>

    <p>y bailó desnuda entre los huesos de la niebla</p>
