<body>
  <h2 title="Seguiré">SEGUIRÉ</h2>

  <div class="poema">
    <p>roto marco centra este <i>todo</i></p>

    <p>de árbol castrado llorando</p>

    <p>medir cada paso a lo largo</p>

    <p>si no se perturba la luna</p>

    <p>la luz redondea blancuras</p>

    <p>de nabos rallados</p>

    <p>tirar cada envoltura</p>

    <p>si no se distorsiona lo negro</p>

    <p>la música enrojece la ruta</p>

    <p>de cada pequeño húmedo</p>

    <p>girar girar girar</p>

    <p>percibir junto al marco roto</p>

    <p>sentires de tacos y muelas</p>

    <p>querer agarrarlo <i>todo</i></p>
  </div>
