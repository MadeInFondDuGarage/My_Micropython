<body>
  <h2 title="Noche">NOCHE</h2>

  <div class="derecha">
    <p><i>Quoi, toujours? Entre moi sans cesse et</i></p>

    <p><i>Le bonheur!</i></p>

    <p>G. <small>DE</small> N<small>ERVAL</small></p>
  </div>

  <div class="salto10 poema">
    <p>Tal vez esta noche no es noche</p>

    <p>debe ser un sol horrendo, o</p>

    <p>lo otro, o cualquier cosa…</p>

    <p>¡Qué sé yo! ¡Faltan palabras,</p>

    <p>falta candor, falta poesía</p>

    <p>cuando la sangre llora y llora!</p>

    <p class="salto10">¡Pudiera ser tan feliz esta noche!</p>

    <p>Si sólo me fuera dado palpar</p>

    <p>las sombras, oír pasos</p>

    <p>decir «buenas noches» a cualquiera</p>

    <p>que pasease a su perro,</p>

    <p>miraría la luna, dijera su</p>

    <p>extraña lactescencia, tropezaría</p>

    <p>con piedras al azar, como se hace.</p>

    <p class="salto10">Pero hay algo que rompe la piel,</p>

    <p>una ciega furia</p>

    <p>que corre por mi venas.</p>

    <p>¡Quiero salir! Cancerbero del alma:</p>

    <p>¡Deja, déjame traspasar tu sonrisa!</p>

    <p class="salto10">¡Pudiera ser tan feliz esta noche!</p>

    <p>Aún quedan ensueños rezagados.</p>

    <p class="salto10">¡Y tantos libros! ¡Y tantas luces!</p>

    <p>¡Y mis pocos años! ¿Por qué no?</p>

    <p>La muerte está lejana. No me mira.</p>

    <p>¡Tanta vida Señor!</p>

    <p>¿Para qué tanta vida?</p>
  </div>
</body>
</html>
