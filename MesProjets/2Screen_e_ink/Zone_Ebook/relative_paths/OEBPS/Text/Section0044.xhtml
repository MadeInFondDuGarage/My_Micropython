<body>
  <h2 title="A la espera de la oscuridad">A LA ESPERA DE LA OSCURIDAD</h2>

  <div class="poema">
    <p>Ese instante que no se olvida</p>

    <p>Tan vacío devuelto por las sombras</p>

    <p>Tan vacío rechazado por los relojes</p>

    <p>Ese pobre instante adoptado por mi ternura</p>

    <p>Desnudo desnudo de sangre de alas</p>

    <p>Sin ojos para recordar angustias de antaño</p>

    <p>Sin labios para recoger el sumo de las violencias</p>

    <p>Perdidas en el centro de los helados campanarios.</p>

    <p class="salto10">Ampáralo niña ciega del alma</p>

    <p>Ponle tus cabellos escarchados por el fuego</p>

    <p>Abrázalo pequeña estatua de terror</p>

    <p>Señálale el mundo convulsionado a tus pies</p>

    <p>A tus pies mueren las golondrinas</p>

    <p>Tiritantes de pavor frente al futuro</p>

    <p>Dile que los suspiros del mar</p>

    <p>Humedecen las únicas palabras</p>

    <p>Por las que vale vivir.</p>

    <p class="salto10">Pero ese instante sudoroso de nada</p>

    <p>Acurrucado en la cueva del destino</p>

    <p>Sin manos para decir nunca</p>

    <p>Sin manos para regalar mariposas</p>

    <p>A los niños muertos</p>
  </div>
</body>
