<body>
  <h3 title="Texto de sombra">TEXTO DE SOMBRA</h3>

  <p>Quiero existir más allá de mí misma: con los aparecidos.</p>

  <p>Quiero existir como la que soy: una idea fija. Quiero ladrar, no alabar el silencio del espacio al que se nace.</p>
