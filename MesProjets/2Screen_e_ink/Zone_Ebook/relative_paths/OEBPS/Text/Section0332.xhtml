  <h3 title="Sala de psicopatología">SALA DE PSICOPATOLOGÍA<a href="../Text/notas.xhtml#nt27" id="rf27"><sup>[27]</sup></a>&nbsp;</h3>

  <p>Después de años en Europa</p>

  <p>Quiero decir París, Saint-Tropez, Cap</p>

  <p>St. Pierre, Provence, Florencia, Siena,</p>

  <p>Roma, Capri, Ischia, San Sebastián,</p>

  <p>Santillana del Mar, Marbella,</p>

  <p>Segovia, Ávila, Santiago,</p>

  <p class="evitasgc-3">y tanto</p>

  <p class="evitasgc-3">y tanto</p>

  <p class="evitasgc-3">por no hablar de New York y del West Village con rastros de muchachas estranguladas</p>

  <p class="evitasgc-3">—quiero que me estrangule un negro —dijo</p>

  <p class="evitasgc-3">—lo que querés es que te viole —dije (¡oh Sigmund! con vos se acabaron los hombres del mercado matrimonial que frecuenté en las mejores playas de Europa)</p>

  <p>y como soy tan inteligente que ya no sirvo para nada,</p>

  <p>y como he soñado tanto que ya no soy de este mundo,</p>

  <p>aquí estoy, entre las inocentes almas de la sala 18,</p>

  <p>persuadiéndome día a día</p>

  <p>de que la sala, las almas puras y yo tenemos sentido, tenemos destino,</p>

  <p>—una señora originaria del más oscuro barrio de un pueblo que no figura en el mapa dice:</p>

  <p>—El dotor me dijo que tengo problemas. Yo no sé. Yo tengo algo aquí (se toca las tetas) y unas ganas de llorar que mama mía.</p>

  <p>Nietzsche: «Esta noche tendré una madre o dejaré de ser.»</p>

  <p>Strindberg: «El sol, madre, el sol.»</p>

  <p>P. Éluard: «Hay que pegar a la madre mientras es joven.»</p>

  <p>Sí, señora, la madre es un animal carnívoro que ama la vegetación lujuriosa. A la hora que la parió abre las piernas, ignorante del sentido de su posición destinada a dar a luz, a tierra, a fuego, a aire,</p>

  <p>pero luego una quiere volver a entrar en esa maldita concha,</p>

  <p>después de haber intentado nacerse sola sacando mi cabeza por mi útero</p>

  <p>(y como no pude, busco morir y entrar en la pestilente guarida de la oculta ocultadora cuya función es ocultar)</p>

  <p>hablo de la concha y hablo de la muerte,</p>

  <p>todo es concha, yo he lamido conchas en varios países y sólo sentí orgullo por mi virtuosismo —la mahtma gandhi del lengüeteo, la Einstein de la mineta, la Reich del lengüetazo, la Reik del abrirse camino entre pelos como de rabinos desaseados— ¡oh el goce de la roña!</p>

  <p>Ustedes, los mediquitos de la 18 son tiernos y hasta besan al leproso, pero</p>

  <p>¿se casarían con el leproso?</p>

  <p>Un instante de inmersión en lo bajo y en lo oscuro,</p>

  <p>sí, de eso son capaces,</p>

  <p>pero luego viene la vocecita que acompaña a los jovencitos como ustedes:</p>

  <p>—¿Podrías hacer un chiste con todo esto, no?</p>

  <p>Y</p>

  <p>sí,</p>

  <p>aquí en el Pirovano</p>

  <p>hay almas que NO SABEN</p>

  <p>porqué recibieron la visita de las desgracias.</p>

  <p>Pretenden explicaciones lógicas los pobres pobrecitos, quieren que la sala —verdadera pocilga— esté muy limpia, porque la roña les da terror, y el desorden, y la soledad de los días vacíos habitados por antiguos fantasmas emigrantes de las maravillosas e ilícitas pasiones de la infancia.</p>

  <p>Oh, he besado tantas pijas para encontrarme de repente en una sala llena de carne prisión donde las mujeres vienen y van hablando de la mejoría.</p>

  <p>Pero</p>

  <p>¿qué cosa curar?</p>

  <p>Y ¿por dónde empezar a curar?</p>

  <p>Es verdad que la psicoterapia en su forma exclusivamente verbal es casi tan bella como el suicidio.</p>

  <p>Se habla.</p>

  <p>Se amuebla el escenario vacío del silencio.</p>

  <p>O, si hay silencio, éste se vuelve mensaje.</p>

  <p>—¿Por qué está callada? ¿En qué piensa?</p>

  <p>No pienso, al menos no ejecuto lo que llaman pensar. Asisto al inagotable fluir del murmullo. A veces —casi siempre— estoy húmeda. Soy una perra, a pesar de Hegel. Quisiera un tipo con una pija así y cogerme a mí y dármela hasta que acabe viendo curanderos (que sin duda me la chuparán) a fin de que me exorcicen y me procuren una buena frigidez.</p>

  <p>Húmeda</p>

  <p>Concha de corazón de criatura humana,</p>

  <p>corazón que es un pequeño bebé inconsolable,</p>

  <p>«Como un niño de pecho he acallado mi alma» (Salmo)</p>

  <p>Ignoro qué hago en la sala 18 salvo honorarla con mi presencia prestigiosa (si me quisieran un poquito me ayudarían a anularla)</p>

  <p>oh no es que quiera coquetear con la muerte</p>

  <p>yo quiero solamente poner fin a esta agonía que se vuelve ridícula a fuerza de prolongarse,</p>

  <p>(Ridículamente te han adornado para este mundo —dice una voz apiadada de mí)</p>

  <p>Y</p>

  <p>Que te encuentres con vos misma —dijo.</p>

  <p>Y yo le dije:</p>

  <p>Para reunirme con el <i>migo</i> de <i>conmigo</i> y ser una sola y misma entidad con él tengo que matar al <i>migo</i> para que así se muera el <i>con</i> y, de este modo, anulados los contrarios, la dialéctica supliciante finaliza en la fusión de los contrarios.</p>

  <p>El suicidio determina</p>

  <p>un cuchillo sin hoja</p>

  <p>al que le falta el mango.</p>

  <p>Entonces:</p>

  <p>adiós sujeto y objeto,</p>

  <p>todo se unifica como en otros tiempos, en el jardín de los cuentos para niños lleno de arroyuelos de frescas aguas prenatales,</p>

  <p>ese jardín es el <i>centro</i> del mundo, es el lugar de la cita, es el espacio vuelto tiempo y el tiempo vuelto lugar, es el alto momento de la fusión y del encuentro,</p>

  <p>fuera del espacio profano en donde el Bien es sinónimo de evolución de sociedades de consumo,</p>

  <p>y lejos de los enmierdantes simulacros de medir el tiempo mediante relojes, calendarios y demás objetos hostiles,</p>

  <p>lejos de las ciudades en que se compra y se vende (oh, en ese jardín para la niña que fui, la pálida alucinada en los suburbios malsanos por los que erraba del brazo de las sombras: niña, mi querida niña que no has tenido madre (ni padre, es obvio)</p>

  <p>De modo que arrastré mi culo hasta la sala 18,</p>

  <p>en la que finjo creer que mi enfermedad de lejanía, de separación de absoluta NO-ALIANZA con Ellos</p>

  <p>—Ellos son todos y yo soy yo</p>

  <p>finjo, pues, que logro mejorar, finjo creer a estos muchachos de buena voluntad (¡oh, los buenos sentimientos!) me podrían ayudar,</p>

  <p>pero a veces —a menudo— los recontraputeo desde mis sombras interiores que estos mediquillos jamás sabrán conocer (la profundidad, cuanto más profunda, más indecible) y los puteo porque evoco a mi amado viejo, el Dr. Pichón R., tan hijo de puta como nunca lo será ninguno de los mediquitos (tan buenos, hélas!) de esta sala,</p>

  <p>pero mi viejo se muere y éstos hablan y, lo peor, éstos tienen cuerpos nuevos, sanos (maldita palabra) en tanto mi viejo agoniza en la miseria por no haber sabido ser una mierda práctico, por haber afrontado el terrible misterio que es la destrucción de un alma, por haber hurgado en lo oculto como un pirata —no poco funesto pues las monedas de oro de inconsciente llevaban carne de ahorcado, y en un recinto lleno de espejos rotos y sal volcada—</p>

  <p>viejo remaldito, especie de aborto pestífero de fantasmas sifilíticos, cómo te adoro en tu tortuosidad solamente parecida a la mía,</p>

  <p>y cabe decir que siempre desconfié de tu genio (no sos genial; sos un saqueador y un plagiario) y a la vez te confié,</p>

  <p>oh, es a vos que mi tesoro fue confiado,</p>

  <p>te quiero tanto que mataría a todos estos médicos adolescentes para darte a beber de su sangre y que vos vivas un minuto, un siglo más,</p>

  <p>(vos, yo, a quienes la vida no nos merece)</p>

  <p class="salto10">Sala 18</p>

  <p>Cuando pienso en laborterapia me arrancaría los ojos en una casa en ruinas y me los comería pensando en mis años de escritura continua,</p>

  <p>15 o 20 horas escribiendo sin cesar, aguzada por el demonio de las analogías, tratando de configurar mi atroz materia verbal errante,</p>

  <p>porque —oh viejo hermoso Sigmund Freud— la ciencia psicoanalítica se olvidó la llave en algún lado:</p>

  <p>abrir se abre</p>

  <p>pero ¿cómo cerrar la herida?</p>

  <p class="salto10">El alma sufre sin tregua, sin piedad, y los malos médicos no restañan la herida que supura.</p>

  <p>El hombre está herido por una desgarradura que tal vez, o seguramente, le ha causado la vida que nos dan.</p>

  <p>«Cambiar la vida» (Marx)</p>

  <p>«Cambiar al hombre (Rimbaud)</p>

  <p>Freud:</p>

  <p>«La pequeña A. Está embellecida por la desobediencia», (Cartas…)</p>

  <p class="salto10">Freud: poeta trágico. Demasiado enamorado de la poesía clásica.</p>

  <p class="asangre">Sin duda, muchas claves las extrajo de «los filósofos de la naturaleza», de «los románticos alemanes» y, sobre todo, de mi amadísimo Lichtenberg, el genial físico y matemático que escribía en su Diario cosas como:</p>

  <p>«Él le había puesto nombres a sus dos pantuflas»</p>

  <p>Algo solo estaba ¿no?</p>

  <p>(¡Oh, Lichtenberg, pequeño jorobado, yo te hubiera amado!)</p>

  <p>Y a Kierkegaard</p>

  <p>Y a Dostoyevski</p>

  <p>Y sobre todo a Kafka</p>

  <p>a quien le pasó lo que a mí, si bien él era púdico y casto —«¿Qué hice del don del sexo?» —y yo soy una pajera como no existe otra;</p>

  <p>pero le pasó (a Kafka) lo que mí:</p>

  <p><i>se separó</i></p>

  <p>fue demasiado lejos en la soledad</p>

  <p>y supo —tuvo que saber—</p>

  <p>que de allí no se vuelve</p>

  <p class="salto10">se alejó —me alejé—</p>

  <p>no por desprecio (claro es que nuestro orgullo es infernal)</p>

  <p>sino porque una es extranjera</p>

  <p>una es de otra parte,</p>

  <p>ellos se casan,</p>

  <p>procrean,</p>

  <p>veranean,</p>

  <p>tienen horarios,</p>

  <p>no se asustan por la tenebrosa</p>

  <p>ambigüedad del lenguaje</p>

  <p>(No es lo mismo decir <i>Buenas noches</i> que decir <i>Buenas noches</i>)</p>

  <p class="salto10">El lenguaje</p>

  <p>—yo no puedo más,</p>

  <p>alma mía, pequeña inexistente,</p>

  <p>decídete;</p>

  <p>te las picás o te quedás,</p>

  <p>pero no me toques así,</p>

  <p>con pavura, con confusión,</p>

  <p>o te vas o te las picás,</p>

  <p>yo, por mi parte, no puedo más.</p>

  <p class="salto10 derecha">1971</p>
