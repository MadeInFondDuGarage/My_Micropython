  <h3 class="oculto" title="Que me dejen con mi voz nueva…">o</h3>

  <p class="saltoinicio">Que me dejen con mi voz nueva, desconocida. No, no me dejen. Sombría como un <i>golem</i> la infancia se ha ido, y la gracia y la disipación de mis dones.</p>
