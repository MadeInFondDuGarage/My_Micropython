<body>
  <h3 title="Nocturno de Chopin por un pianista de cuatro años">NOCTURNO DE CHOPIN POR UN PIANISTA DE CUATRO AÑOS</h3>

  <div class="poema">
    <p>Su música me lleva</p>

    <p>a un acantilado con un pájaro</p>

    <p>que juega a oírse cantar.</p>

    <p>Su música me alumbra en la lluvia</p>

    <p>por donde vamos yo y una jaula vacía.</p>
  </div>
