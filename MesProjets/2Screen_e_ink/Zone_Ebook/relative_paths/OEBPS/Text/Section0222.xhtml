  <h3 title="Lazo mortal">LAZO MORTAL</h3>

  <p>Palabras emitidas por un pensamiento a modo de tabla del náufrago. Hacer el amor adentro de nuestro abrazo significó una luz negra: la oscuridad se puso a brillar. Era la luz reencontrada, doblemente apagada pero de algún modo más viva que mil soles. El color del mausoleo infantil, el mortuorio color de los detenidos deseos se abrió en la salvaje habitación. El ritmo de los cuerpos ocultaba el vuelo de los cuervos. El ritmo de los cuerpos cavaba un espacio de luz adentro de la luz.</p>
