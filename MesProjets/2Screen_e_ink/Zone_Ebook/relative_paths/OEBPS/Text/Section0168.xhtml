<body>
  <h3 title="Memoria">MEMORIA</h3>

  <p class="derecha"><i>A Jorge Gaitán Durán</i></p>

  <div class="salto25 poema">
    <p>Arpa de silencio</p>

    <p>en donde anida el miedo.</p>

    <p>Gemido lunar de las cosas</p>

    <p>significando ausencia.</p>

    <p class="salto10">Espacio de color cerrado.</p>

    <p>Alguien golpea y arma</p>

    <p>un ataúd para la hora,</p>

    <p>otro ataúd para la luz.</p>
  </div>
</body>
