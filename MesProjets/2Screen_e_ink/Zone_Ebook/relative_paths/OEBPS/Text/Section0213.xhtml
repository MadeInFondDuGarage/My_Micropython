<body>
  <h3 title="El infierno musical">EL INFIERNO MUSICAL</h3>

  <p>Golpean con soles</p>

  <p class="salto10">Nada se acopla con nada aquí</p>

  <p class="salto10">Y de tanto animal muerto en el cementerio de huesos filosos de mi memoria</p>

  <p class="salto10">Y de tantas monjas como cuervos que se precipitan a hurgar entre mis piernas</p>

  <p class="salto10"><i>La cantidad de fragmentos me desgarra</i></p>

  <p class="salto10">Impuro diálogo</p>

  <p class="salto10">Un proyectarse desesperado de la materia verbal</p>

  <p class="salto10">Liberada de sí misma</p>

  <p class="salto10">Naufragando en sí misma</p>
