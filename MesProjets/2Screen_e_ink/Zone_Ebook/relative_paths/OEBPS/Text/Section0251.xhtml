<body>
  <h3 class="oculto" title="boca enlutada…">o</h3>

  <div class="poema">
    <p class="saltoinicio">boca enlutada</p>

    <p>enumerando mis muertes</p>

    <p class="salto10">boca sin lengua</p>

    <p>plegaria a nadie</p>

    <p class="salto10">se suceden en mi persona</p>

    <p>generaciones</p>

    <p>de pasajeras sin destino</p>

    <p>oscilan extrañas</p>

    <p class="salto10">llórame por estar aquí</p>

    <p>llórame y átame a las rosas</p>

    <p>al manantial que cesó</p>

    <p>augúrame luces asustadas</p>

    <p class="salto10">plática de los exterminadores</p>

    <p>que vienen a mi rostro</p>

    <p>preparado para vivir</p>
  </div>
</body>
