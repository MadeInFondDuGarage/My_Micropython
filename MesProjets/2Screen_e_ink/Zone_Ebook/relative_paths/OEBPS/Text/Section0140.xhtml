<body>
  <h3 title="Despedida">DESPEDIDA</h3>

  <div class="poema">
    <p>Mata su luz un fuego abandonado.</p>

    <p>Sube su canto un pájaro enamorado.</p>

    <p>Tantas criaturas ávidas en su silencio</p>

    <p>y esta pequeña lluvia que me acompaña.</p>
  </div>
