<body>
  <h3 title="Lejanía">LEJANÍA</h3>

  <div class="poema">
    <p>Mi ser henchido de barcos blancos.</p>

    <p>Mi ser reventado sentires.</p>

    <p>Toda yo bajo las reminiscencias de</p>

    <p class="evitasgc-2">tus ojos.</p>

    <p>Quiero destruir la picazón de tus</p>

    <p class="evitasgc-2">pestañas.</p>

    <p>Quiero rehuir la inquietud de tus</p>

    <p class="evitasgc-2">labios.</p>

    <p>Por qué tu visión fantasmagórica re-</p>

    <p class="evitasgc-2">dondea las cálices de</p>

    <p class="evitasgc-2">estas horas?</p>
  </div>
