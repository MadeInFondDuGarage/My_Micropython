  <div class="sinopsis">
    <p class="salto10">Publicamos ahora en la colección de Poesía la obra poética completa (libros de poemas editados en vida de la autora y poemas inéditos compilados a partir de manuscritos) de Alejandra Pizarnik, una de las figuras más emblemáticas de las literaturas hispánicas, controvertida, polémica, que se convirtió en un mito entre los jóvenes de los años ochenta y noventa. Su poesía se caracteriza por un hondo intimismo y una severa sensualidad. En palabras de Octavio Paz, uno de sus más apasionados defensores, la obra de Pizarnik lleva a cabo «una cristalización verbal por amalgama de insomnio pasional y lucidez meridiana en una disolución de realidad sometida a las más altas temperaturas», y Pieyre de Mandiargues le escribió, con motivo de la publicación de <i>Extracción de la piedra de locura</i>: «Tengo amor a tus poemas: querría que hicieras muchos y que tus poemas difundieran por todas partes el amor y el terror».</p>
