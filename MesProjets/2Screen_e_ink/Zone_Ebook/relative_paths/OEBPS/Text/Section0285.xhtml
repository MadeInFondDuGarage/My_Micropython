  <h3 class="oculto" title="Suponiendo que me viese llorar…">o</h3>

  <div class="asangre">
    <p class="saltoinicio">Suponiendo que me viese llorar y me estrechara contra su pecho, mi persona quedaría extinguida. Es verdad que entonces podría verle los ojos así como Van Gogh miró el sol y luego lo separó en pequeños soles giratorios: <i>¿»Ser» se escribe con dos «ee»?</i></p>

    <p class="salto10">Las muñecas son terribles. ¿Y por qué no? Si lo es el animal, la piedra, el hombre. En el poema se desocultan las muñecas y otras cosas que son noche. El poema, la noche. ¿Conocés vos la noche?</p>

    <p class="salto10">Rosas son las rosas que están en la mano de la insaciable, la del color infernal.</p>

    <p class="salto10">La noche, pienso el silencio. La noche emerge de la muerte. La noche emerge de la vida. En la noche viven los faltos de todo.</p>

    <p class="salto10">Entonces, de mañana, grité)</p>

    <p class="salto10">Noche mía, pequeña, poblada de vividores.</p>

    <p>Oh mi amor, llamame con un nombre unido a una muy antigua y olvidada ternura. Voy a reconstruir la trama de una tragedia solamente interior. <i>Todo es un interior</i>.</p>
  </div>

  <p class="salto10 derecha">feb. 1970</p>
