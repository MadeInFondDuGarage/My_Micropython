<body>
  <h2 title="Tiempo">TIEMPO</h2>

  <p class="derecha"><i>A Olga Orozco</i></p>

  <div class="salto25 poema">
    <p>Yo no sé de la infancia</p>

    <p>más que un miedo luminoso</p>

    <p>y una mano que me arrastra</p>

    <p>a mi otra orilla.</p>

    <p class="salto10">Mi infancia y su perfume</p>

    <p>a pájaro acariciado.</p>
  </div>
</body>
