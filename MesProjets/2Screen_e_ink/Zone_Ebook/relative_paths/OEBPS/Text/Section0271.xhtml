  <h3 title="Naufragio inconcluso">NAUFRAGIO INCONCLUSO<a href="../Text/notas.xhtml#nt8" id="rf8"><sup>[8]</sup></a>&nbsp;</h3>

  <p>Este temporal a destiempo, estas rejas en las niñas de mis ojos, esta pequeña historia de amor que se cierra como un abanico que abierto mostraba a la bella alucinada: la más desnuda del bosque en el silencio musical de los abrazos.</p>
