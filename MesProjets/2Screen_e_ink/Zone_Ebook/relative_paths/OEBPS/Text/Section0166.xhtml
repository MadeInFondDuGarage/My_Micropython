<body>
  <h3 title="Formas">FORMAS</h3>

  <div class="poema">
    <p>no sé si pájaro o jaula</p>

    <p>mano asesina</p>

    <p>o joven muerta entre cirios</p>

    <p>o amazona jadeando en la gran garganta oscura</p>

    <p>o silenciosa</p>

    <p>pero tal vez oral como una fuente</p>

    <p>tal vez juglar</p>

    <p>o princesa en la torre más alta</p>
  </div>
