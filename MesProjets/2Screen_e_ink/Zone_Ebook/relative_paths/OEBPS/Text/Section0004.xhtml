<body>
  <h2 title="Humo">HUMO</h2>

  <div class="poema">
    <p>marcos rozados en callado hueso</p>

    <p>agitan un cocktail humeante</p>

    <p>miles de calorías desaparecen</p>

    <p>ante la repicante austeridad</p>

    <p>de los humos vistos de atrás</p>

    <p>dos manos de trébol roto</p>

    <p>casi enredan los dientes separados</p>

    <p>y castigan las oscuras encías</p>

    <p>bajo ruidos recibidos al segundo</p>

    <p>los pelos ríen moviendo</p>

    <p>las huellas de varios marcianos</p>

    <p>cognac boudeaux-amarillento</p>

    <p>rasca retretes sanguíneos</p>

    <p>tres voces fonean tres besos</p>

    <p>para mí para ti para mí</p>

    <p>pescar la calandria eufórica</p>

    <p>en chapas latosas</p>

    <p>ascendente faena!</p>
  </div>
</body>
</html>
