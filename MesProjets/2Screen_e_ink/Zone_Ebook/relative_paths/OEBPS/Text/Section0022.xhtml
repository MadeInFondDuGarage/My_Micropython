  <h2 title="Dédalus Joyce">DÉDALUS JOYCE</h2>

  <p class="asangre">Hombre funesto de claves nocturnas y cuerpo desnudo junto al río profundo de brillantes escupidas. Hombre de ojos anti-miopes exploradores de infinidad. Hombre de rostro en sombra y cuerpo genio abstracto. Hombre sin miedo de pluma en mano ni de ojos en ser ni sonrisa suprema. Hombre dios llegaste solo de infinitudes asombrofantasmales ornado de lágrimas de superioridad vergonzante. Hombre destructor de tabúes y cielos estrellados. Hombre de frágiles vestidos que caen dejando hermanos desnudos. Hombre sin alimento para otorgar a los que buscan. Hombre de altos mares de surcos desolados. Hombre-barco blanco. Hombre que arrancaste el vómito para sepultar el mito. Hombre de tiempo y espacio que arrancan cuerdas locuras. Hombre superhombre, frialdad y tibieza en conjunción. Hombre.</p>
