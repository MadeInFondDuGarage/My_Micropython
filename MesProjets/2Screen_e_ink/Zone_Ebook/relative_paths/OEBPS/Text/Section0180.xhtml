<body>
  <h3 title="Privilegio">PRIVILEGIO</h3>

  <p class="centrado">I</p>

  <div class="salto10 poema">
    <p>Ya he perdido el nombre que me llamaba,</p>

    <p>su rostro rueda por mí</p>

    <p>como el sonido del agua en la noche,</p>

    <p>del agua cayendo en el agua.</p>

    <p>Y es su sonrisa la última sobreviviente,</p>

    <p>no mi memoria.</p>
  </div>

  <p class="salto10 centrado">II</p>

  <div class="salto10 poema">
    <p>El más hermoso</p>

    <p>en la noche de los que se van,</p>

    <p>oh deseado,</p>

    <p>es sin fin tu no volver,</p>

    <p>sombra tú hasta el día de los días.</p>
  </div>
</body>
