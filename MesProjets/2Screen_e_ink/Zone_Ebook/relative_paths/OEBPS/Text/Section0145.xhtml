<body>
  <h3 title="Infancia">INFANCIA</h3>

  <div class="poema">
    <p>hora en que la yerba crece</p>

    <p>en la memoria del caballo.</p>

    <p>El viento pronuncia discursos ingenuos</p>

    <p>en honor de las lilas,</p>

    <p>y alguien entra en la muerte</p>

    <p>con los ojos abiertos</p>

    <p>como Alicia en el país de lo ya visto.</p>
  </div>
