  <h3 title="Cuadro">CUADRO</h3>

  <p>Ruidos de alguien subiendo una escalera. La de los tormentos, la que regresa de la naturaleza, sube una escalera de la que baja un reguero de sangre. Negros pájaros quema la flor de la distancia en los cabellos de la solitaria. Hay que salvar, no a la flor, sino a las palabras.</p>
