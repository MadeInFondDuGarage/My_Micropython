<body>
  <h2 title="Cenizas">CENIZAS</h2>

  <div class="poema">
    <p>Hemos dicho palabras,</p>

    <p>palabras para despertar muertos,</p>

    <p>palabras para hacer un fuego,</p>

    <p>palabras donde poder sentarnos</p>

    <p>y sonreír.</p>

    <p class="salto10">Hemos creado el sermón</p>

    <p>del pájaro y del mar,</p>

    <p>el sermón del agua,</p>

    <p>el sermón del amor.</p>

    <p class="salto10">Nos hemos arrodillado</p>

    <p>y adorado frases extensas</p>

    <p>como el suspiro de la estrella,</p>

    <p>frases como olas,</p>

    <p>frases con alas.</p>

    <p class="salto10">Hemos inventado nuevos nombres</p>

    <p>para el vino y para la risa,</p>

    <p>para las miradas y sus terribles</p>

    <p>caminos.</p>

    <p class="salto10">Yo ahora estoy sola</p>

    <p>—como la avara delirante</p>

    <p>sobre su montaña de oro—</p>

    <p>arrojando palabras hacia el cielo,</p>

    <p>pero yo estoy sola</p>

    <p>y no puedo decirle a mi amado</p>

    <p>aquellas palabras por las que vivo.</p>
  </div>
</body>
</html>
