<body>
  <h2 title="Salvación">SALVACIÓN</h2>

  <div class="poema">
    <p>Se fuga la isla</p>

    <p>Y la muchacha vuelve a escalar el viento</p>

    <p>y a descubrir la muerte del pájaro profeta</p>

    <p>Ahora</p>

    <p>es el fuego sometido</p>

    <p>Ahora</p>

    <p>es la carne</p>

    <p class="evitasgc-9">la hoja</p>

    <p class="evitasgc-9">la piedra</p>

    <p>perdidos en la fuente del tormento</p>

    <p>como el navegante en el horror de la civilización</p>

    <p>que purifica la caída de la noche</p>

    <p>Ahora</p>

    <p>La muchacha halla la máscara del infinito</p>

    <p>y rompe el muro de la poesía.</p>
  </div>
</body>
