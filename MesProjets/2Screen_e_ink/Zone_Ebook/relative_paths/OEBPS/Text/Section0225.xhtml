  <h3 title="Los de lo oculto">LOS DE LO OCULTO</h3>

  <p>Para que las palabras no basten es preciso alguna muerte en el corazón.</p>

  <p class="salto10">La luz del lenguaje me cubre como una música, imagen mordida por los perros del desconsuelo, y el invierno sube por mí como la enamorada del muro.</p>

  <p class="salto10">Cuando espero dejar de esperar, sucede tu caída dentro de mí. Ya no soy más que un adentro.</p>
