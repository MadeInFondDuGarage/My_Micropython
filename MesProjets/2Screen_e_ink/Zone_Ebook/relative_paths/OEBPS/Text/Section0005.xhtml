<body>
  <h2 title="Reminiscencias">REMINISCENCIAS</h2>

  <div class="poema">
    <p>y el tiempo estranguló mi estrella</p>

    <p>cuatro números giran insidiosos</p>

    <p>ennegreciendo las confituras</p>

    <p>y el tiempo estranguló mi estrella</p>

    <p>caminaba trillada sobre pozo oscuro</p>

    <p>los brillos lloraban a mis verdores</p>

    <p>y yo miraba y yo miraba</p>

    <p>y el tiempo estranguló mi estrella</p>

    <p>recordar tres rugidos de</p>

    <p>tiernas montañas y radios oscuras</p>

    <p>dos copas amarillas</p>

    <p>dos gargantas raspadas</p>

    <p>dos besos comunicantes de la visión de</p>

    <p class="evitasgc-1">una existencia a otra existencia</p>

    <p>dos promesas gimientes de</p>

    <p class="evitasgc-1">tremendas locuacidades ajenas</p>

    <p>dos promesas de no ser de sí ser de no ser</p>

    <p>dos sueños jugando la ronda del sino en</p>

    <p class="evitasgc-1">derredor de un cosmos de</p>

    <p class="evitasgc-1">champagne amarillo blanquecino</p>

    <p>dos miradas cerciorando la avidez de una</p>

    <p class="evitasgc-1">estrella chiquita</p>

    <p>y el tiempo estranguló mi estrella</p>

    <p>cuatro números ríen en volteretas desabridas</p>

    <p>muere uno</p>

    <p>nace uno</p>

    <p>y el tiempo estranguló mi estrella</p>

    <p>sones de nenúfares ardientes</p>

    <p>desconectan mis futuras sombras</p>

    <p>un vaho desconcertante rellena</p>

    <p class="evitasgc-1">mi soleado rincón</p>

    <p>la sombra del sol tritura la</p>

    <p class="evitasgc-1">la esfinge de mi estrella</p>

    <p>las promesas se coagulan</p>

    <p>frente al signo de estrellas estranguladas</p>

    <p>y el tiempo estranguló mi estrella</p>

    <p>pero su esencia existirá</p>

    <p>en mi intemporal interior</p>

    <p>brilla esencia de mi estrella!</p>
  </div>
</body>
