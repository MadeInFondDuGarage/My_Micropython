  <h1 class="oculto" title="Autor"/>

  <p class="vineta"><img alt="" height="40%" src="../Images/autor.jpg"/></p>

  <div class="autor">
    <p>ALEJANDRA PIZARNIK. Nació en Buenos Aires el 29 de Abril de 1936. Estudió filosofía y letras en la UBA y, más tarde, pintura. Entre 1960 y 1964 vivió en París donde trabajó para la revista «Cuadernos» y algunas editoriales francesas, publicó poemas y críticas en varios diarios, tradujo a Antonin Artaud, Henri Michaux, Aimé Cesairé, e Yves Bonnefoy, y estudió historia de la religión y literatura francesa. A su vuelta a Buenos Aires publicó tres de sus principales volúmenes, «Los trabajos y las noches» (1965), «Extracción de la piedra de locura» (1968) y «El infierno musical» (1971), así como su trabajo en prosa «La condesa sangrienta» (1971). El 25 de septiembre de 1972, mientras pasaba un fin de semana fuera de la clínica psiquiátrica donde estaba internada murió de una sobredosis intencional de seconal.</p>
  </div>
