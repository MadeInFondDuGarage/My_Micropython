  <h3 title="Sin tierra común">SIN TIERRA COMÚN</h3>

  <p>Alguna vez sabrás porque hablas menos de lo que dices. Alguna vez conocerás lo que ya habías dicho dijiste. Sólo tu puedes hablar del hablar porque es tu emblema, tu flagelo.</p>

  <p>Aún ahora, también ahora, sílabas hostiles disuenan en tu cuerpo. Pero tu sabes que un día se libertarán, irrumpirán, y nunca dirás las palabras de todos, aquellas que no aceptan servirte porque a ti no te sirve.</p>
