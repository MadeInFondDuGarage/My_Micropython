<body>
  <h3 class="oculto" title="Perdida en el silencio…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Perdida en el silencio</p>

    <p>de las piedras fantasmas.</p>

    <p>¿Quién es el heredero del viento,</p>

    <p>quién me llena la boca de días,</p>

    <p>quién hace que yo viva?</p>

    <p class="salto10">¿Quién prueba una verdad</p>

    <p>en mi dolor sin fondo?</p>

    <p class="salto25">¿Quién me ha exilado con los que cantan?</p>

    <p>¿Quién me perdió en el silencio</p>

    <p>de las palabras fantasmas?</p>
  </div>
</body>
</html>
