<body>
  <h2 title="Nemo">NEMO</h2>

  <div class="poema">
    <p>no llegará lejos el día de raro verdor</p>

    <p>en que cantaré a la luna odiada que da luz a mi espesa cabeza cortada a la navaja</p>

    <p>que da luz a los vientos brutales</p>

    <p>a las flores agudas que arden en los dedos bajo las curitas benignas</p>

    <p>a la estrella que se oculta cuando se la llama</p>

    <p>a la lluvia húmeda contoneándose en su desnudez repulsiva</p>

    <p>el sol amarillo que traspasa las pieles marcando oscuras huellas</p>

    <p>el relojito enviado desde el infierno interruptor de los bellos sueños</p>

    <p>a los mares helados arrastrando basuras olas cintillos dorados ardores en los ojos</p>
  </div>
</body>
