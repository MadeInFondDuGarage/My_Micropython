<body>
  <h2 title="Peregrinaje">PEREGRINAJE</h2>

  <p class="derecha"><i>A Elizabeth Azcona Cranwell</i></p>

  <div class="salto25 poema">
    <p>Llamé, llamé como la náufraga dichosa</p>

    <p>a las olas verdugas</p>

    <p>que conocen el verdadero nombre</p>

    <p>de la muerte</p>

    <p class="salto10">He llamado al viento,</p>

    <p>le confié mi deseo de ser.</p>

    <p class="salto10">Pero un pájaro muerto</p>

    <p>vuela hacia la desesperanza</p>

    <p>en medio de la música</p>

    <p>cuando brujas y flores</p>

    <p>cortan la mano de la bruma.</p>

    <p>Un pájaro muerto llamado azul.</p>

    <p class="salto10">No es la soledad con alas,</p>

    <p>es el silencio de la prisionera,</p>

    <p>es la mudez de pájaros y viento,</p>

    <p>es el mundo enojado con mi risa</p>

    <p>o los guardianes del infierno</p>

    <p>rompiendo mis cartas.</p>

    <p class="salto10">He llamado, he llamado.</p>

    <p>He llamado, hacia nunca.</p>
  </div>
</body>
