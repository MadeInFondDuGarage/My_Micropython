<body>
  <h3 title="Fiesta">FIESTA</h3>

  <div class="poema">
    <p>He desplegado mi orfandad</p>

    <p>sobre la mesa, como un mapa.</p>

    <p>Dibujé el itinerario</p>

    <p>hacia mi lugar al viento.</p>

    <p>Los que llegan no me encuentran.</p>

    <p>Los que espero no existen.</p>

    <p class="salto10">Y he bebido licores furiosos</p>

    <p>para transmutar los rostros</p>

    <p>en un ángel, en vasos vacíos.</p>
  </div>
