<body>
  <h3 title="Cuarto solo">CUARTO SOLO</h3>

  <div class="poema">
    <p>Si te atreves a sorprender</p>

    <p>la verdad de esta vieja pared;</p>

    <p>y sus fisuras, desgarraduras,</p>

    <p>formando rostros, esfinges,</p>

    <p>manos, clepsidras,</p>

    <p>seguramente vendrá</p>

    <p>una presencia para tu sed,</p>

    <p>probablemente partirá</p>

    <p>esta ausencia que te bebe.</p>
  </div>
</body>
