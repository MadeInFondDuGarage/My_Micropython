<body>
  <h3 title="Invocaciones">INVOCACIONES</h3>

  <div class="poema">
    <p>Insiste en tu abrazo,</p>

    <p>redobla tu furia,</p>

    <p>crea un espacio de injurias</p>

    <p>entre yo y el espejo,</p>

    <p>crea un canto de leprosa</p>

    <p>entre yo y la que me creo.</p>
  </div>
