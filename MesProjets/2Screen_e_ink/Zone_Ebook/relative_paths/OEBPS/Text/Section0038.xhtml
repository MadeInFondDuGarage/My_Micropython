<body>
  <h2 title="La enamorada">LA ENAMORADA</h2>

  <div class="poema">
    <p>esta lúgubre manía de vivir</p>

    <p>esta recóndita humorada de vivir</p>

    <p>te arrastra alejandra no lo niegues.</p>

    <p class="salto10">hoy te miraste en el espejo</p>

    <p>y te fue triste estabas sola</p>

    <p>la luz rugía el aire cantaba</p>

    <p>pero tu amado no volvió</p>

    <p class="salto10">enviarás mensajes sonreirás</p>

    <p>tremolarás tus manos así volverá</p>

    <p>tu amado tan amado</p>

    <p class="salto10">oyes la demente sirena que lo robó</p>

    <p>el barco con barbas de espuma</p>

    <p>donde murieron las risas</p>

    <p>recuerdas el último abrazo</p>

    <p>oh nada de angustias</p>

    <p>ríe en el pañuelo llora a carcajadas</p>

    <p>pero cierra las puertas de tu rostro</p>

    <p>para que no digan luego</p>

    <p>que aquella mujer fuiste tú</p>

    <p class="salto10">te remuerden los días</p>

    <p>te culpan las noches</p>

    <p>te duele la vida tanto tanto</p>

    <p>desesperada, ¿adónde vas?</p>

    <p>desesperada ¡nada más!</p>
  </div>
</body>
</html>
