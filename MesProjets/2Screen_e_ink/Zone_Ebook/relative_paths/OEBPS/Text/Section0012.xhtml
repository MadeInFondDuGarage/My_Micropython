<body>
  <h2 title="Mi bosque">MI BOSQUE</h2>

  <div class="poema">
    <p>acumular deseos en plantas ingratas</p>

    <p>referir lo tuyo</p>

    <p>en verdor solemne</p>

    <p>y entonces vendrán diez caballos</p>

    <p>a tirar la cola al viento negro</p>

    <p>moverán las hojas</p>

    <p>sus crines mojadas</p>

    <p>y vendrá la escuadra</p>

    <p>redondeando versos</p>
  </div>
</body>
