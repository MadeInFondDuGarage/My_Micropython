  <h3 class="oculto" title="Sumisa la niña muda…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Sumisa a la niña muda</p>

    <p>que habla en mi nombre,</p>

    <p>me cierro, me defiendo,</p>

    <p>cuando las cosas,</p>

    <p>como hordas de huecos,</p>

    <p>vienen a mi terror.</p>
