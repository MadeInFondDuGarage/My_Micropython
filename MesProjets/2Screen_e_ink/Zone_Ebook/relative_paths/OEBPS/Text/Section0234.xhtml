  <h3 title="III Voces, rumores, sombras…">III</h3>

  <p>Voces, rumores, sombras, cantos de ahogados: no sé si son signos o una tortura. Alguien demora en el jardín el paso del tiempo. Y las criaturas del otoño abandonadas al silencio.</p>

  <p class="salto10">Yo estaba predestinada a nombrar las cosas con nombres esenciales. Yo ya no existo y lo sé; lo que no sé es qué vive en lugar mío. Pierdo la razón si hablo, pierdo los años si callo. Un viento violento arrasó con todo. Y no haber podido hablar por todos aquellos que olvidaron el canto.</p>
