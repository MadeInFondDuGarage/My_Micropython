<body>
  <h3 title="Los trabajos y las noches">LOS TRABAJOS Y LAS NOCHES</h3>

  <div class="poema">
    <p>para reconocer en la sed mi emblema</p>

    <p>para significar el único sueño</p>

    <p>para no sustentarme nunca de nuevo en el amor</p>

    <p class="salto10">he sido toda ofrenda</p>

    <p>un puro errar</p>

    <p>de loba en el bosque</p>

    <p>en la noche de los cuerpos</p>

    <p class="salto10">para decir la palabra inocente</p>
  </div>
