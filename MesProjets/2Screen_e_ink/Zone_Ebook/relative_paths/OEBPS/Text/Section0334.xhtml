<body>
  <h3 class="oculto" title="es como si me pidiera la luna…">o</h3>

  <div class="poema">
    <p class="saltoinicio">es como si me pidiera la luna.</p>

    <p>Me digo:</p>

    <p>Si me pide la luna es porque la necesita.</p>

    <p>Pero si (supongamos) le llevo la luna, me dirá</p>

    <p>algo nada lindo de escuchar.</p>

    <p class="evitasgc-17">Además, está lo otro, está lo otro.</p>

    <p class="evitasgc-13">(«Si me muriera ahora mismo</p>

    <p class="evitasgc-15">qué alegre iba a ser.»)</p>

    <p class="evitasgc-19">Si me muriera.<a href="../Text/notas.xhtml#nt28" id="rf28"><sup>[28]</sup></a></p>
  </div>
</body>
