  <h3 title="[…] del silencio">[…] DEL SILENCIO<a href="../Text/notas.xhtml#nt14" id="rf14"><sup>[14]</sup></a>&nbsp;</h3>

  <p class="centrado">I</p>

  <p class="salto10">Esta muñeca vestida de azul es mi emisaria en el mundo.</p>

  <p>Sus ojos son de huérfana cuando llueve en un jardín donde un pájaro lila devora lilas y un pájaro rosa devora rosas.</p>

  <p class="salto10">Tengo miedo del lobo gris que se disimula en la lluvia.</p>

  <p>Lo que se ve, lo que se va, es indecible.</p>

  <p>Las palabras cierran todas las puertas.</p>

  <p class="salto10">Recuerdo el tiempo sobre los álamos queridos.</p>

  <p>El arcaísmo de mi drama determinó, en mi criatura compartida, una cámara letal.</p>

  <p>Yo era lo imposible y también el desgarramiento por lo imposible.</p>

  <p class="salto10">Oh el color infernal de mis pasiones.</p>

  <p>Sin embargo, quedé cautiva de la antigua ternura.</p>

  <p class="salto25 centrado">II</p>

  <p class="salto10">No hay quien pinte con colores verdes.</p>

  <p>Todo es anaranjado.</p>

  <p>Si soy algo soy violencia.</p>

  <p>Los colores rayan el silencio y crean animales deteriorados. Luego alguien intentará escribir un poema. Y será mediante las formas, los colores, el desamor, la lucidez (no continúo porque no quiero asustar a los niños).</p>

  <p class="salto25 centrado">III</p>

  <p class="salto10">El poema es espacio y hiere.</p>

  <p>No soy como mi muñeca, que sólo se nutre de leche de pájaro.</p>
