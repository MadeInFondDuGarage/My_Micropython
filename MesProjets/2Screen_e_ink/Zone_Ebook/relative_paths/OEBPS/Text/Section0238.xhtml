<body>
  <h3 class="oculto" title="el silencio es luz…">o</h3>

  <div class="poema">
    <p class="saltoinicio">el silencio es luz</p>

    <p>el canto sabio de la desdicha</p>

    <p>emana tiempo primitivo</p>

    <p>buscaba la piedra no el plan</p>

    <p>un himno inocente no las maldiciones</p>

    <p>el conocimiento de mis nombres</p>

    <p>para olvidarlos y olvidarme</p>

    <p>pero lo que no busqué es el exilio</p>

    <p>ni tampoco me dije mentiras</p>

    <p>no adoré el sol</p>

    <p>pero no esperé esta luz negra</p>

    <p>al filo del mediodía</p>
  </div>
</body>
</html>
