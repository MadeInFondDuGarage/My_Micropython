<body>
  <h2 title="Tratando a la sombra roja">TRATANDO A LA SOMBRA ROJA</h2>

  <div class="poema">
    <p>su soledad maúlla</p>

    <p>ceros y ceros</p>

    <p>vertiente de olores ingenuos</p>

    <p>retina ante desconocido</p>

    <p>las brisas sonantes</p>

    <p>retornan picando</p>

    <p>su ser de sonrisas</p>

    <p>y dientes abiertos</p>

    <p>reír en la noche soleada</p>

    <p>del vigoroso participio</p>
  </div>
</body>
