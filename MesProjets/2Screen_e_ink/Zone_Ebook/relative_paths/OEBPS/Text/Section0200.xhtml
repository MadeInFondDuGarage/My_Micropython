<body>
  <h3 title="Como agua sobre una piedra">COMO AGUA SOBRE UNA PIEDRA</h3>

  <div class="poema">
    <p>a quien retorna en busca de su antiguo buscar</p>

    <p>la noche se le cierra como agua sobre una piedra</p>

    <p>como aire sobre un pájaro</p>

    <p>como se cierran dos cuerpos al amarse</p>
  </div>
