  <h2 class="oculto" title="Introducción de Octavio Paz">o</h2>

  <p class="asangre saltoinicio">Á<small>RBOL DE</small> D<small>IANA</small> <i>de Alejandra Pizarnik</i>. (Quím.): <i>cristalización verbal por amalgama de insomnio pasional y lucidez meridiana en una disolución de la realidad sometida a las más altas temperaturas. El producto no contiene una sola partícula de mentira</i>. (Bot.): <i>el árbol de Diana es transparente y no da sombra. Tiene luz propia, centelleante y breve. Nace en las tierras resecas de América. La hostilidad del clima, la inclemencia de los discursos y la gritería, la opacidad general de las especies pensantes, sus vecinas, por un fenómeno de compensación bien conocido, estimulan las propiedades luminosas de esta planta. No tiene raíces; el tallo es un cono de luz ligeramente obsesiva; las hojas son pequeñas, cubiertas por cuatro o cinco líneas de escritura fosforescente, pecíolo elegante y agresivo, márgenes dentadas; las flores son diáfanas, separadas las femeninas de las masculinas, las primeras axilares, casi sonámbulas y solitarias, las segundas en espigas, espoletas y, más raras veces, púas</i>. (Mit. y Etnogr.): <i>los antiguos creían que el arco de la diosa era una rama desgajada del árbol de Diana. La cicatriz del tronco era considerada como el sexo (femenino) del cosmos. Quizá se trata de una higuera mítica (la savia de las ramas tiernas es lechosa, lunar). El mito alude posiblemente a un sacrificio por desmembración: un adolescente (¿hombre o mujer?) era descuartizado cada luna nueva, para estimular la reproducción de las imágenes en la boca de la profetisa (arquetipo de la unión de los mundos inferiores y superiores). El árbol de Diana es uno de los atributos masculinos de la deidad femenina. Algunos ven en esto una confirmación suplementaria del origen hermafrodita de la materia gris y, acaso, de todas las materias; otros deducen que es un caso de expropiación de la sustancia masculina solar: el rito sería sólo una ceremonia de mutilación mágica del rayo primordial. En el estado actual de nuestros conocimientos es imposible decidirse por cualquiera de estas dos hipótesis. Señalemos, sin embargo, los participantes comían después carbones incandescentes, costumbre que perdura hasta nuestros días</i>. (Blas.): <i>escudo de armas parlantes</i>. (Fís.): <i>durante mucho tiempo se negó la realidad física del árbol de Diana. En efecto, debido a su extraordinaria transparencia, pocos pueden verlo. Soledad, concentración y un afinamiento general de la sensibilidad son requisitos indispensables para la visión. Algunas personas, con reputación de inteligencia, se de que, a pesar de su preparación</i>, no ven nada. <i>Para disipar su error, basta recordar que el árbol de Diana no es un cuerpo que se pueda ver: es un objeto (animado) que nos deja ver más allá, un instrumento natural de visión. Por lo demás, una pequeña prueba de crítica experimental desvanecerá</i>, efectiva y definitivamente, <i>los prejuicios de la ilustración contemporánea: colocado frente al sol, el árbol de Diana refleja sus rayos y los reúne en un foco central llamado poema, que produce un calor luminoso capaz de quemar, fundir y hasta volatilizar a los incrédulos. Se recomienda esta prueba a los críticos literarios de nuestra lengua.</i></p>

  <div class="salto10 derecha">
    <p>O<small>CTAVIO</small> P<small>AZ</small></p>

    <p class="cursiva">París, abril de 1962</p>
