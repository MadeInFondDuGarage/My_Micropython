<body>
  <h3 title="Encuentro">ENCUENTRO</h3>

  <div class="poema">
    <p>Alguien entra en el silencio y me abandona.</p>

    <p>Ahora la soledad no está sola.</p>

    <p>Tú hablas como la noche.</p>

    <p>Te anuncias como la sed.</p>
  </div>
