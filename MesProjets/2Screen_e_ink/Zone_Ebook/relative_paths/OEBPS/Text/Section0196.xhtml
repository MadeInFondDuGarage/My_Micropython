  <h3 title="Las promesas de la música">LAS PROMESAS DE LA MÚSICA</h3>

  <p>Detrás de un muro blanco la variedad del arco iris. La muñeca en su jaula está haciendo el otoño. Es el despertar de las ofrendas. Un jardín recién creado, un llanto detrás de la música. Y que suene siempre, así nadie asistirá al movimiento del nacimiento, a la mímica de las ofrendas, al discurso de aquella que soy anudada a esta silenciosa que también soy. Y que de mí no quede más que la alegría de quien pidió entrar y le fue concedido. Es la música, es la muerte, lo que yo quise decir en noches variadas como los colores del bosque.</p>
