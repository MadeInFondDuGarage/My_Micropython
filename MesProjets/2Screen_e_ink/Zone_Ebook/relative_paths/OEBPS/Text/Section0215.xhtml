  <h3 title="La palabra del deseo">LA PALABRA DEL DESEO</h3>

  <p>Esta espectral textura de la oscuridad, esta melodía en los huesos, este soplo de silencios diversos, este ir abajo por abajo, esta galería oscura, oscura, este hundirse sin hundirse.</p>

  <p class="salto10">¿Qué estoy haciendo? Está oscuro y quiero entrar. No sé que más decir. (Yo no quiero decir, yo quiero entrar.) El dolor en los huesos, el lenguaje roto a paladas, poco a poco reconstituir el diagrama de la irrealidad.</p>

  <p class="salto10">Posesiones no tengo (esto es seguro; al fin algo seguro). Luego una melodía. Es una melodía plañidera, una luz lila, una inminencia sin destinatario. Veo la melodía. Presencia de una luz anaranjada. Sin tu mirada no voy a saber vivir, también esto es seguro. Te suscito, te resucito. Y me dijo que saliera al viento y fuera de casa en casa preguntando si estaba.</p>

  <p class="salto10">Paso desnuda con un cirio en la mano, castillo frío, jardín de las delicias. La soledad no es estar parada en el muelle, a la madrugada, mirando el agua con avidez. La soledad es no poder decirla por no poder circundarla por no poder darle un rostro por no poder hacerla sinónimo de un paisaje. La soledad sería esta melodía rota de mis frases.</p>
