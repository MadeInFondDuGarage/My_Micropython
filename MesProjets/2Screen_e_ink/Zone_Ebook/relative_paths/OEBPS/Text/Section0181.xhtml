  <h3 title="Contemplación">CONTEMPLACIÓN</h3>

  <p>Murieron las formas despavoridas y no hubo más un afuera y un adentro. Nadie estaba escuchando el lugar porque el lugar no existía.</p>

  <p><i>Con el propósito de escuchar están escuchando el lugar.</i></p>

  <p>Adentro de tu máscara relampaguea la noche. Te atraviesan con graznidos. Te martillean con pájaros negros. Colores enemigos se unen en la tragedia.</p>
