<body>
  <h2 title="Reminiscencias quirománticas">REMINISCENCIAS QUIROMÁNTICAS</h2>

  <div class="poema">
    <p>dos manos de flores pendientes resumen la</p>

    <p>burda escultura de exóticas formas que</p>

    <p>brillan vendiendo a las brujas el</p>

    <p>augusto signo de vida por muerte</p>

    <p>leyendo en las líneas las miles de</p>

    <p>veces que vences o gimes o lloras o ríes o</p>

    <p>emprendes camino a un paso fijo que</p>

    <p>lucha en la noche repeliendo los</p>

    <p>viles ataúdes que esgrime el fracaso</p>
  </div>
</body>
