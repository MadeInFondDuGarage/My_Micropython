<body>
  <h3 title="Moradas">MORADAS</h3>

  <p class="derecha"><i>A Théodore Fraenkel</i></p>

  <div class="salto25 poema">
    <p>En la mano crispada de un muerto,</p>

    <p>en la memoria de un loco,</p>

    <p>en la tristeza de un niño,</p>

    <p>en la mano que busca el vaso,</p>

    <p>en el vaso inalcanzable,</p>

    <p>en la sed de siempre.</p>
  </div>
</body>
