  <h3 title="Crepúsculo">CREPÚSCULO</h3>

  <div class="poema">
    <p>La sombra cubre pétalos mirados</p>

    <p>El viento se lleva el último gesto de una hoja</p>

    <p>El mar ajeno y doblemente mudo</p>

    <p>en el verano que apiada por sus luces</p>

    <p class="salto10">Un deseo de aquí</p>

    <p>Una memoria de allá</p>
