<body>
  <h2 title="Mucho más allá">MUCHO MÁS ALLÁ</h2>

  <div class="poema">
    <p>¿Y qué si nos vamos anticipando</p>

    <p>de sonrisa en sonrisa</p>

    <p>hasta la última esperanza?</p>

    <p class="salto10">¿Y qué?</p>

    <p>¿Y qué me da a mí,</p>

    <p>a mí que he perdido mi nombre,</p>

    <p>el nombre que me era dulce sustancia</p>

    <p>en épocas remotas, cuando yo no era yo</p>

    <p>sino una niña engañada por su sangre?</p>

    <p class="salto10">¿A qué, a qué</p>

    <p>este deshacerme, este desangrarme,</p>

    <p>este desplumarme, este desequilibrarme</p>

    <p>si mi realidad retrocede</p>

    <p>como empujada por una ametralladora</p>

    <p>y de pronto se lanza a correr,</p>

    <p>aunque igual la alcanzan,</p>

    <p>hasta que cae a mis pies como un ave muerta?</p>

    <p>Quisiera hablar de la vida.</p>

    <p>Pues esto es la vida,</p>

    <p>Este aullido, este clavarse las uñas</p>

    <p>en el pecho, este arrancarse</p>

    <p>la cabellera a puñados, este escupirse</p>

    <p>a los propios ojos, sólo por decir,</p>

    <p>sólo por ver si se puede decir:</p>

    <p>«¿es que yo soy? ¿verdad que sí?</p>

    <p>¿no es verdad que yo existo</p>

    <p>y no soy la pesadilla de una bestia?».</p>

    <p>Y con las manos embarradas</p>

    <p>golpeamos a las puertas del amor.</p>

    <p class="salto10">Y con la conciencia cubierta</p>

    <p>de sucios y hermosos velos,</p>

    <p>pedimos por Dios.</p>

    <p>Y con las sienes restallantes</p>

    <p>de imbécil soberbia</p>

    <p>tomamos de la cintura a la vida</p>

    <p>y pateamos de soslayo a la muerte.</p>

    <p class="salto10">Pues eso es lo que hacemos.</p>

    <p>Nos anticipamos de sonrisa en sonrisa</p>

    <p>hasta la última esperanza.</p>
  </div>
</body>
