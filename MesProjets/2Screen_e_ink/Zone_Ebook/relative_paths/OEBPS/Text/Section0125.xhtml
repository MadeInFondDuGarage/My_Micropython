<body>
  <h3 title="Poema">POEMA</h3>

  <div class="poema">
    <p>Tú eliges el lugar de la herida</p>

    <p>en donde hablamos nuestro silencio.</p>

    <p>Tú haces de mi vida</p>

    <p>esta ceremonia demasiado pura.</p>
