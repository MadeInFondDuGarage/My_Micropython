<body>
  <h2 title="Poema a mi papel">POEMA A MI PAPEL</h2>

  <div class="poema">
    <p>leyendo propios poemas</p>

    <p>penas impresas trascendencias cotidianas</p>

    <p>sonrisa orgullosa equívoco perdonado</p>

    <p>es mío es mío es mío!</p>

    <p>leyendo letra cursiva</p>

    <p>latir interior alegre</p>

    <p>sentir que la dicha se coagula</p>

    <p>o bien o mal o bien</p>

    <p>extrañeza de sentirse innatos</p>

    <p>cáliz armonioso y autónomo</p>

    <p>límite en dedo gordo de pie cansado y</p>

    <p>pelo lavado en rizosa cabeza</p>

    <p>no importa:</p>

    <p>es mío es mío es mío.!!</p>
  </div>
</body>
