<body>
  <h2 title="Yo soy…">YO SOY…</h2>

  <div class="poema">
    <p>mis alas?</p>

    <p>dos pétalos podridos</p>

    <p class="salto10">mi razón?</p>

    <p>copitas de vino agrio</p>

    <p class="salto10">mi vida?</p>

    <p>vacío bien pensado</p>

    <p class="salto10">mi cuerpo?</p>

    <p>un tajo en la silla</p>

    <p class="salto10">mi vaivén?</p>

    <p>un gong infantil</p>

    <p class="salto10">mi rostro?</p>

    <p>un cero disimulado</p>

    <p class="salto10">mis ojos?</p>

    <p>ah! trozos de infinito</p>
  </div>
</body>
