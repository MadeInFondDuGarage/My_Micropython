<body>
  <h2 title="La noche">LA NOCHE</h2>

  <div class="poema">
    <p>Poco sé de la noche</p>

    <p>pero la noche parece saber de mí,</p>

    <p>y más aún, me asiste como si me quisiera,</p>

    <p>me cubre la conciencia con sus estrellas.</p>

    <p class="salto10">Tal vez la noche sea la vida y el sol la muerte.</p>

    <p>Tal vez la noche es nada</p>

    <p>y las conjeturas sobre ella nada</p>

    <p>y los seres que la viven nada.</p>

    <p>Tal vez las palabras sean lo único que existe</p>

    <p>en el enorme vacío de los siglos</p>

    <p>que nos arañan el alma con sus recuerdos.</p>

    <p class="salto10">Pero la noche ha de conocer la miseria</p>

    <p>que bebe de nuestra sangre y de nuestras ideas.</p>

    <p>Ella ha de arrojar odio a nuestras miradas</p>

    <p>sabiéndolas llenas de intereses, de desencuentros.</p>

    <p class="salto10">Pero sucede que oigo a la noche llorar en mis huesos.</p>

    <p>Su lágrima inmensa delira</p>

    <p>y grita que algo se fue para siempre.</p>

    <p class="salto10">Alguna vez volveremos a ser.</p>
  </div>
</body>
