<body>
  <h2 title="Fiesta en el vacío">FIESTA EN EL VACÍO</h2>

  <div class="poema">
    <p>Como el viento sin alas encerrado en mis ojos</p>

    <p>es la llamada de la muerte.</p>

    <p>Sólo un ángel me enlazará al sol.</p>

    <p>Dónde el ángel,</p>

    <p>dónde su palabra.</p>

    <p class="salto10">Oh perforar con vino la suave necesidad de ser.</p>
  </div>
