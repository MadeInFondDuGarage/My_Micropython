  <h3 title="La celeste silenciosa al borde del pantano">LA CELESTE SILENCIOSA AL BORDE DEL PANTANO<a href="../Text/notas.xhtml#nt7" id="rf7"><sup>[7]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A Enrique Pichón Rivière</i></p>

  <p class="salto25">Cerraron el rostro que fue idéntico al más alto sueño de la augusta infancia y pájaros temerosos en despliegue rapidísimo de plumas negras hicieron el paisaje del perfecto terror. Soy tu silencio, tu tragedia, tu veladora. Puesto que sólo soy noche, puesto que toda noche de mi vida es tuya.</p>
