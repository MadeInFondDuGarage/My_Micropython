<body>
  <h3 title="XVIII palabras reflejas que solas se dicen…">XVIII</h3>

  <div class="poema">
    <p>palabras reflejas que solas se dicen</p>

    <p>en poemas que no fluyen yo naufrago</p>

    <p>todo en mí se dice con su sombra</p>

    <p>y cada sombra con su doble</p>
  </div>
