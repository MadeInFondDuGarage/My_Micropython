  <h3 title="Sortilegios">SORTILEGIOS</h3>

  <p>Y las damas vestidas de rojo para mi dolor y con mi dolor insumidas en soplo, agazapadas como fetos de escorpiones en el lado más interno de mi nuca, las madres de rojo que me aspiran el único calor que me doy con mi corazón que apenas pudo nunca latir, a mi que siempre tuve que aprender sola cómo se hace para beber y comer y respirar y a mí que nadie me enseñó a llorar y nadie me enseñará ni siquiera las grandes damas adheridas a la entretela de mi respiración con babas rojizas y velos flotantes de sangre, mi sangre, la mía sola, la que yo me procuré y ahora vienen a beber de mí luego de haber matado al rey que flota en el río y mueve los ojos y sonríe pero está muerto y cuando alguien está muerto, muerto está por más que sonría y las grandes, las trágicas damas de rojo han matado al que se va río abajo y yo me quedo como rehén en perpetua posesión.</p>
