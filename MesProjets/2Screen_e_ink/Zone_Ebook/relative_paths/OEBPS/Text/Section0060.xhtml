<body>
  <h2 title="Artes invisibles">ARTES INVISIBLES</h2>

  <div class="poema">
    <p>Tú que cantas todas mis muertes.</p>

    <p>Tú que cantas lo que no confías</p>

    <p>al sueño del tiempo,</p>

    <p>descríbeme la casa del vacío</p>

    <p>háblame de esas palabras vestidas de féretros</p>

    <p>que habitan mi inocencia.</p>

    <p class="salto10">Con todas mis muertes</p>

    <p>yo me entrego a mi muerte,</p>

    <p>con puñados de infancia,</p>

    <p>con deseos ebrios</p>

    <p>que no anduvieron bajo el sol,</p>

    <p>y no hay una palabra madrugadora</p>

    <p>que le dé la razón a la muerte,</p>

    <p>y no hay un dios donde morir sin muecas.</p>
  </div>
</body>
