  <h3 title="Fragmentos para dominar el silencio">FRAGMENTOS PARA DOMINAR EL SILENCIO</h3>

  <p class="centrado">I</p>

  <p>Las fuerzas del lenguaje son las damas solitarias, desoladas, que cantan a través de mi voz que escucho a lo lejos. Y lejos, en la negra arena, yace una niña densa de música ancestral. ¿Dónde la verdadera muerte? He querido iluminarme a la luz de mi falta de luz. Los ramos se mueren en la memoria. La yacente anida en mí con su máscara de loba. La que no pudo más e imploró llamas y ardimos.</p>

  <p class="salto10 centrado">II</p>

  <p class="salto10">Cuando a la casa del lenguaje se le vuela el tejado y las palabras no guarecen, yo hablo.</p>

  <p class="salto10">Las damas de rojo se extraviaron dentro de sus máscaras aunque regresarían para sollozar entre flores.</p>

  <p class="salto10">No es muda la muerte. Escucho el canto de los enlutados sellar las hendiduras del silencio. Escucho tu dulcísimo canto florecer mi silencio gris.</p>

  <p class="salto10 centrado">III</p>

  <p class="salto10">La muerte ha restituido al silencio su prestigio hechizante. Y yo no diré mi poema y yo he de decirlo. Aún si el poema (aquí, ahora) no tiene sentido, no tiene destino.</p>
