<body>
  <h3 title="Una palabra">UNA PALABRA</h3>

  <p class="derecha"><i>A Juan Battle Planas</i></p>

  <div class="salto25 poema">
    <p>Originada por el hacedor de vértigos,</p>

    <p>inscrita en los muros de la casa negra,</p>

    <p>una palabra inmola</p>

    <p>a la de ojos feroces.</p>

    <p>En amoroso silencio ella entona</p>

    <p>la canción para el yacente.</p>
  </div>
