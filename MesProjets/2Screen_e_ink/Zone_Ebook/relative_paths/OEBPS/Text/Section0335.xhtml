  <h3 title="Sous la nuit">SOUS LA NUIT<a href="../Text/notas.xhtml#nt29" id="rf29"><sup>[29]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A Y. Yván Pizarnik de Kolikovski, mi padre</i></p>

  <p class="salto25">Los ausentes soplan grismente y la noche es densa. La noche tiene el color de los párpados del muerto.</p>

  <p>Huyo toda la noche, encauzo la persecución y la fuga, canto un canto para mis males, pájaros negros sobre mortajas negras.</p>

  <p>Grito mentalmente, el viento demente me desmiente, me confino, me alejo de la mano crispada, no quiero saber otra cosa que este clamor, este resolar en la noche, esta errancia, este no hallarse.</p>

  <p class="salto10">Toda la noche hago la noche.</p>

  <p>Toda la noche me abandonas lentamente como el agua cae lentamente. Toda la noche escribo para buscar a quien me busca.</p>

  <p>Palabra por palabra yo escribo la noche.</p>
