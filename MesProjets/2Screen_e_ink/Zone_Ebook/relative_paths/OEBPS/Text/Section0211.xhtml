  <h3 title="Piedra fundamental">PIEDRA FUNDAMENTAL</h3>

  <p>No puedo hablar con mi voz sino con mis voces.</p>

  <p class="salto10">Sus ojos eran la entrada del templo, para mí, que soy errante, que amo y muero. Y hubiese cantado hasta hacerme una con la noche, hasta deshacerme desnuda en la entrada del tiempo.</p>

  <p class="salto10">Un canto que atravieso como un túnel.</p>

  <p class="salto10">Presencias inquietantes,</p>

  <p>gestos de figuras que se aparecen vivientes por obra de un lenguaje activo que las alude,</p>

  <p>signos que insinúan terrores insolubles.</p>

  <p class="salto10">Una vibración de los cimientos, un trepidar de los fundamentos, drenan y barrenan,</p>

  <p>y he sabido dónde se aposenta aquello tan otro que es yo, que espera que me calle para tomar posesión de mí y drenar y barrenar los cimientos, los fundamentos,</p>

  <p>aquello que me es adverso desde mí, conspira, toma posesión de mi terreno baldío,</p>

  <p>no,</p>

  <p class="evitasgc-1">he de hacer algo,</p>

  <p>no,</p>

  <p class="evitasgc-1">no he de hacer nada,</p>

  <p class="salto10">algo en mí no se abandona a la cascada de cenizas que me arrasa dentro de mí con ella que es yo, conmigo que soy ella y que soy yo, indeciblemente distinta de ella.</p>

  <p class="salto10">En el silencio mismo (no el mismo silencio) tragar noche, una noche inmensa inmersa en el sigilo de los pasos perdidos.</p>

  <p class="salto10">No puedo hablar para nada decir. Por eso nos perdemos, yo y el poema, en la tentativa inútil de transcribir relaciones ardientes.</p>

  <p class="salto10">¿A dónde la conduce esta escritura? A lo negro, a lo estéril, a lo fragmentado.</p>

  <p class="salto10">Las muñecas desventradas por mis antiguas manos de muñeca, la desilusión al encontrar pura estopa (pura estepa tu memoria): el padre, que tuvo que ser Tiresias, flota en el río. Pero tú, ¿por qué te dejaste asesinar escuchando cuentos de álamos nevados?</p>

  <p class="salto10">Yo quería que mis dedos de muñeca penetraran en las teclas. Yo no quería rozar, como una araña, el teclado. Yo quería hundirme, clavarme, fijarme, petrificarme. Yo quería entrar en el teclado para entrar adentro de la música para tener una patria. Pero la música se movía, se apresuraba. Sólo cuando un refrán reincidía, alentaba en mí la esperanza de que se estableciera algo parecido a una estación de trenes, quiero decir: un punto de partida firme y seguro; un lugar desde el cual partir, desde el lugar, hacia el lugar, en unión y fusión con el lugar. Pero el refrán era demasiado breve, de modo que yo no podía fundar una estación pues no contaba más que con un tren salido de los rieles que se contorsionaba y se distorsionaba. Entonces abandoné la música y sus traiciones porque la música estaba más arriba o más abajo, pero no en el centro, en el lugar de la fusión y del encuentro. (Tú que fuiste mi única patria ¿en dónde buscarte? Tal vez en este poema que voy escribiendo.)</p>

  <p class="salto10">Una noche en el circo recobré un lenguaje perdido en el momento que los jinetes con antorchas en la mano galopaban en ronda feroz sobre corceles negros. Ni en mis sueños de dicha existirá un coro de ángeles que suministre algo semejante a los sonidos calientes para mi corazón de los cascos contra las arenas.</p>

  <p class="salto10">(<i>Y me dijo: Escribe; porque estas palabras son fieles y verdaderas.</i>)</p>

  <p class="salto10">(<i>Es un hombre o una piedra o un árbol el que va a comenzar el canto…</i>)</p>

  <p class="salto10">Y era un estremecimiento suavemente trepidante (lo digo para aleccionar a la que extravió en mí su musicalidad y trepida con más disonancia que un caballo azuzado por una antorcha en las arenas de un país extranjero).</p>

  <p class="salto10">Estaba abrazada al suelo, diciendo un nombre. Creí que me había muerto y que la muerte era decir un nombre sin cesar.</p>

  <p class="salto10">No es esto, tal vez, lo que quiero decir. Este decir y decirse no es grato. No puedo hablar con mi voz sino con mis voces. También este poema es posible que sea una trampa, un escenario más.</p>

  <p class="salto10">Cuando el baco alternó su ritmo y vaciló en el agua violenta, me erguí como la amazona que domina solamente con sus ojos azules al caballo que se encabrita (¿o fue con sus ojos azules?). El agua verde en mi cara, he de beber de ti hasta que la noche se abra. Nadie puede salvarme pues soy invisible aun para mí que me llamo con tu voz. ¿En dónde estoy? Estoy en un jardín.</p>

  <p class="salto10">Hay un jardín.</p>
