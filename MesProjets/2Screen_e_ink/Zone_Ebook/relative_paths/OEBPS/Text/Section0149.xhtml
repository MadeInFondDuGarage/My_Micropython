<body>
  <h3 title="Madrugada">MADRUGADA</h3>

  <div class="poema">
    <p>Desnudo soñando una noche solar.</p>

    <p>He yacido días animales.</p>

    <p>El viento y la lluvia me borraron</p>

    <p>como a un fuego, como a un poema</p>

    <p>escrito en un muro.</p>
  </div>
