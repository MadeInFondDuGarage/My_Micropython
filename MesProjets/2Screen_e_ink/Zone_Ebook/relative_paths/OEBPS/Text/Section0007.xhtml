<body>
  <h2 title="Ser incoloro">SER INCOLORO</h2>

  <div class="centrado">
    <p>(<i>al conejito que se</i></p>

    <p><i>comía las uñas</i>)</p>
  </div>

  <div class="salto25 poema">
    <p>costura desclavada en mi caos humor diario</p>

    <p>repiqueo infinito arpa rayada</p>

    <p>cadáveres llorosos mar salino</p>

    <p class="salto10">tu opacidad quitará fuentes de verde jabón</p>

    <p>banderines colorados</p>

    <p>en mano derecha de uñas comidas</p>
  </div>
