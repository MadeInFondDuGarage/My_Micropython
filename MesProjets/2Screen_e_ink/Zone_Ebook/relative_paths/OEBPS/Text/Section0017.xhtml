<body>
  <h2 title="Ajedrez">AJEDREZ</h2>

  <div class="poema">
    <p>todavía la enclítica no destruye</p>

    <p>los peones reverentes ante él</p>

    <p>millares de montañas</p>

    <p>revientan exquisitas</p>

    <p>delante del sol rojo</p>

    <p>(no sol amarillo)</p>

    <p>pensar innato en moldeadas rejas</p>

    <p>torta trashumeante de vela sin fogón</p>

    <p>quisiera ser masa lingüística</p>

    <p>para cortarle la barba</p>

    <p>ondas en preciosa lumbre</p>

    <p>alzar bandera gratuita</p>

    <p>kilómetros de nueces</p>

    <p>y golpes en relevante torniquete</p>
  </div>
</body>
