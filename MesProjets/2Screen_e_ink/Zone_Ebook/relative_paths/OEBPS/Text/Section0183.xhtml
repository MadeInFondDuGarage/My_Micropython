<body>
  <h3 title="Cuento de invierno">CUENTO DE INVIERNO</h3>

  <p>La luz del viento entre los pinos ¿comprendo estos signos de tristeza incandescente?</p>

  <p class="salto10">Un ahorcado se balancea en el árbol marcado con la cruz lila.</p>

  <p class="salto10">Hasta que logró deslizarse fuera de mi sueño y entrar a mi cuarto, por la ventana, en complicidad con el viento de medianoche.</p>
