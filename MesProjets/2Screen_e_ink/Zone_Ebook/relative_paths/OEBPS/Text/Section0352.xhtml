  <h3 title="Escrito en el crepúsculo">ESCRITO EN EL CREPÚSCULO<a href="../Text/notas.xhtml#nt34" id="rf34"><sup>[34]</sup></a>&nbsp;</h3>

  <p>¿Para quién el silencio?</p>

  <p>—El anochecer es el mismo en todas partes.</p>

  <p>—Estás detrás de la lluvia, detrás de la cara del muerto.</p>

  <p>Si pudiera comerme la lengua, si pudiera ahogar en un agua negra mi memoria soleada.</p>

  <p>—Cuando hablas no se entiende nada.</p>

  <p>—Soy oscura porque estoy sola.</p>

  <p>—No les hablés: mirá y pasá.</p>

  <p>—Me coge. Que parece morir. Que parezco agonizar.</p>

  <p class="salto10 derecha">16/VI/72</p>
