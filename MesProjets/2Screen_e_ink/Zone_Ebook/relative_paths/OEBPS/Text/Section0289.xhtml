  <h3 title="Contemplación">CONTEMPLACIÓN<a href="../Text/notas.xhtml#nt16" id="rf16"><sup>[16]</sup></a>&nbsp;</h3>

  <p>Con miedo antiguo se lamentan o lloran las voces. Formas fugitivas venidas para la ceremonia en que arrancarán de ti el corazón de tu lejana figura. La noche relampaguea dentro de tu máscara. Te agujerean con graznidos, te martillean con pájaros negros. Colores enemigos se unen en la tragedia.</p>

  <p>Cuando llegamos al centro de la oscuridad el bosque se abrió. Murieron las formas despavoridas de la noche y no hubo más un afuera ni un adentro. Te precipitaron, desapareciste con la máscara en la mano. Y ya nada se pareció a un corazón.</p>
