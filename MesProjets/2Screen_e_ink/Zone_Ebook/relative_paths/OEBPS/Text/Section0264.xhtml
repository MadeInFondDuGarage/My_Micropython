<body>
  <h3 title="Capítulos principales">CAPÍTULOS PRINCIPALES</h3>

  <div class="poema">
    <p>Llega la muerte con su manada de huesos</p>

    <p>sonrío sumisa a una niña idiota</p>

    <p>que implora en mi nombre</p>

    <p>juntas (la muerte, la niña y yo)</p>

    <p>no encontramos otro oficio que execrar</p>

    <p>Al final todos se casan:</p>

    <p>el mar y las olas,</p>

    <p>la noche y lo oscuro,</p>

    <p>el vaso y el vino,</p>

    <p>el anillo y el dedo,</p>

    <p>la muerte y el cadáver.</p>
  </div>
