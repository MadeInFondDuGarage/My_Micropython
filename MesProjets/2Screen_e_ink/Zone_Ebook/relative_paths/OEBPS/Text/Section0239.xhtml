<body>
  <h3 class="oculto" title="Como dedos rodando premeditadamente…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Como dedos rodando premeditadamente</p>

    <p>Como dedos de muerto pulsando la sola cuerda de un arpa</p>

    <p>Como alas pesadas cuando sueño que duermo con los ojos abiertos</p>

    <p>Como el sol que se ensombrece en mi mirada</p>

    <p>Como la oscuridad desunida en toda la noche de mi vida</p>

    <p>Como los perros de mi sombra</p>
  </div>
