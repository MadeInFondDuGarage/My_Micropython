<body>
  <h2 title="La de los ojos abiertos">LA DE LOS OJOS ABIERTOS</h2>

  <div class="poema">
    <p>la vida juega en la plaza</p>

    <p>con el ser que nunca fui</p>

    <p class="salto10">y aquí estoy</p>

    <p class="salto10">baila pensamiento</p>

    <p>en la cuerda de mi sonrisa</p>

    <p class="salto10">y todos dicen que esto pasó y es</p>

    <p class="salto10">va pasando</p>

    <p>va pasando</p>

    <p>mi corazón</p>

    <p>abre la ventana</p>

    <p class="salto10">vida</p>

    <p>aquí estoy</p>

    <p class="salto10">mi vida</p>

    <p>mi sola y aterida sangre</p>

    <p>percute en el mundo</p>

    <p class="salto10">pero quiero saberme viva</p>

    <p>pero no quiero hablar</p>

    <p>de la muerte</p>

    <p>ni de sus extrañas manos.</p>
  </div>
</body>
</html>
