  <h2 title="Puerto adelante">PUERTO ADELANTE</h2>

  <p class="asangre">Noche tibia sensación placentera. Los sones abstractos de las vías colmaban sus oídos eufóricos. Pensaba en el puerto que veía tan seguido… puerto de colores impresionistas y hombres sucios de brazos mojados y brillosos y vello crecido y húmedo. Hombres impasibles a la lejanía maravillosa, al cielo entre los barcos, al paisaje de conjunto, al suelo atiborrado de objetos de lugares remotos como pedazos de mundo en el melancólico corazón de un mar…</p>

  <p>Sí. Hundirse una noche en las calles del puerto. Caminar, caminar…</p>

  <p>Sí. Sola. Siempre sola. Lenta, muy lentamente. Y el aire estará enrarecido, será un aire cosmopolita y el suelo lleno de papeles de cigarrillos que alguna vez existieron, blancos y hermosos.</p>

  <p>Sí. Se seguirá caminando. Hundirse, oscuridad, caminar…</p>

  <p>Sí. Y una estrella dará su color al ancla de plata que llevaba en su pecho. Tirar el ancla. Sí. Muy junto a ese barco gigante de rayas rojas y blancas y verdes…irse, y no volver.</p>
