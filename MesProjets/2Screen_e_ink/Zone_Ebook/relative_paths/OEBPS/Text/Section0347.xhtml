<body>
  <h3 class="oculto" title="sólo vine a ver el jardín…">o</h3>

  <div class="poema">
    <p class="saltoinicio">sólo vine a ver el jardín.</p>

    <p>tengo frío en las manos.</p>

    <p>frío en el pecho.</p>

    <p>frío en el lugar donde en los demás se forma el pensamiento.</p>

    <p>no es éste el jardín que vine a buscar</p>

    <p>a fin de entrar, de entrar, no de salir.</p>

    <p class="salto10">por favor, no creas que me lamento.</p>

    <p>si comprendieras la voluptuosidad de comprobar.</p>

    <p class="salto10">me amaron, a lo menos eso dijeron.</p>

    <p>muchos me amaron porque no soy parecida más que a mí</p>

    <p>y por otros imponderables más bellos que la sonrisa de la Virgen de las Rocas.</p>

    <p>yo, ahora, creo amar y me siento acabada, epilogada.</p>

    <p>¿cómo aprender los gestos primarios</p>

    <p>de las pasiones elementales?</p>

    <p class="salto10">No me consuela</p>
  </div>

  <p class="salto10 derecha">1972</p>
</body>
