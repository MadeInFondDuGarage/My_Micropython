<body>
  <h3 title="Te hablo">TE HABLO</h3>

  <p class="derecha"><i>A H. M.</i></p>

  <div class="salto25 poema">
    <p>estoy con pavura.</p>

    <p>hame sobrevenido lo que más temía.</p>

    <p>no estoy en dificultad:</p>

    <p>estoy en no poder más.</p>

    <p class="salto10">No abandoné el vacío y el desierto.</p>

    <p>vivo en peligro.</p>

    <p class="salto10">tu canto no me ayuda.</p>

    <p>cada vez más tenazas,</p>

    <p>más miedos,</p>

    <p>más sombras negras.</p>
  </div>
</body>
