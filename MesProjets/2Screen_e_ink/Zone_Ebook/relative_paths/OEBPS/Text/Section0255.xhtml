  <h3 class="oculto" title="en el amanecer venido de mis ojos…">o</h3>

  <div class="poema">
    <p class="saltoinicio">en el amanecer venido de mis ojos</p>

    <p>pájaros parados en el aire son a mis ojos</p>

    <p>lo que las flores en la mano de un muerto</p>

    <p>voz dorada en el aire</p>

    <p>caída de un árbol abierto</p>

    <p>y no es verdad que pediré socorro</p>
