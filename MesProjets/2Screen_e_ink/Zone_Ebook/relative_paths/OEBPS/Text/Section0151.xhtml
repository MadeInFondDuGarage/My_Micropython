<body>
  <h3 title="En un lugar para huirse">EN UN LUGAR PARA HUIRSE</h3>

  <div class="poema">
    <p>Espacio. Gran espera.</p>

    <p>Nadie viene. Esta sombra.</p>

    <p class="salto10">Darle lo que todos:</p>

    <p>significaciones sombrías,</p>

    <p>no asombradas.</p>

    <p class="salto10">Espacio. Silencio ardiente.</p>

    <p>¿Qué se dan entre sí las sombras?</p>
  </div>
