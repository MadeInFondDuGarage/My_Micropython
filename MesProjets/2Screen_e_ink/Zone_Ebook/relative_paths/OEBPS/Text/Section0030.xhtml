<body>
  <h3 title="Más allá del olvido">MÁS ALLÁ DEL OLVIDO</h3>

  <div class="poema">
    <p>alguna vez de un costado de la luna</p>

    <p>verás caer los besos que brillan en mí</p>

    <p>las sombras sonreirán altivas</p>

    <p>luciendo el secreto que gime vagando</p>

    <p>vendrán las hojas impávidas que</p>

    <p>algún día fueron lo que mis ojos</p>

    <p>vendrán las mustias fragancias que</p>

    <p>innatas descendieron del alado son</p>

    <p>vendrán las rojas alegrías que</p>

    <p>burbujean intensas en el sol que</p>

    <p>redondea las armonías equidistantes en</p>

    <p>el humo danzante de la pipa de mi amor</p>
  </div>
</body>
