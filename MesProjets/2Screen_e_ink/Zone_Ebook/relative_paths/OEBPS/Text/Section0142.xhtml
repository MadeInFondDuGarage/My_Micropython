<body>
  <h3 title="Sentido de su ausencia">SENTIDO DE SU AUSENCIA</h3>

  <div class="poema">
    <p>si yo me atrevo</p>

    <p>a mirar y a decir</p>

    <p>es por su sombra</p>

    <p>unida tan suave</p>

    <p>a mi nombre</p>

    <p>allá lejos</p>

    <p>en la lluvia</p>

    <p>en mi memoria</p>

    <p>por su rostro</p>

    <p>que ardiendo en mi poema</p>

    <p>dispersa hermosamente</p>

    <p>un perfume</p>

    <p>a amado rostro desaparecido</p>
  </div>
</body>
