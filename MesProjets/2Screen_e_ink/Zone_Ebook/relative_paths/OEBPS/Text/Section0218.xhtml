  <h3 title="En un ejemplar de «Les chants de maldoror»">EN UN EJEMPLAR DE «LES CHANTS DE MALDOROR»</h3>

  <p>Debajo de mi vestido ardía un campo con flores alegres como los niños de la medianoche.</p>

  <p class="salto10">El soplo de la luz en mis huesos cuando escribo la palabra tierra. Palabra o presencia seguida por animales perfumados; triste como sí misma, hermosa como el suicidio; y que me sobrevuela como una dinastía de soles.</p>
