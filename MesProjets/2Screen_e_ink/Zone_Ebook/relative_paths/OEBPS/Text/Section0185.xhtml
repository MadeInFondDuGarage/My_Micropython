  <h3 title="Desfundación">DESFUNDACIÓN</h3>

  <p>Alguien quiso abrir alguna puerta. Duelen sus manos aferradas a su prisión de huesos de mal agüero.</p>

  <p>Toda la noche ha forcejeado con su nueva sombra. Llovió adentro de la madrugada y martillaban con lloronas.</p>

  <p>La infancia implora desde mis noches de cripta.</p>

  <p>La música emite colores ingenuos.</p>

  <p>Grises pájaros en el amanecer son a la ventana cerrada lo que a mis males mi poema.</p>
