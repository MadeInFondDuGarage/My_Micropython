<body>
  <h3 class="oculto" title="como la bella en el bosque despierta…">o</h3>

  <div class="poema">
    <p class="saltoinicio">como la bella en el bosque despierta</p>

    <p>para siempre sin príncipe que esperar</p>

    <p>y la sonrisa muda se borró hace mucho</p>

    <p class="salto10">a dónde vas bajo el cielo gris oculto</p>

    <p>por pequeñas ventanas con ojos sucios</p>

    <p>donde detrás no hay nada</p>

    <p>nadie hay detrás y están todos muertos</p>

    <p class="salto10">la voz decía sobre el despertar</p>

    <p>y sobre la muerte</p>

    <p>y la voz decía y los ojos decían</p>

    <p>y todo estaba condenado</p>

    <p>pero la voz no se cansaba</p>

    <p class="salto10">ciudad de nada en nadie</p>

    <p>el cuerpo se hace</p>

    <p>la voz se rehace</p>
  </div>
</body>
</html>
