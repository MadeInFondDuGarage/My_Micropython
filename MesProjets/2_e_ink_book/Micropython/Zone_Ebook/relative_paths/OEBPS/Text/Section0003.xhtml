<body>
  <h2 title="Días contra el ensueño">DÍAS CONTRA EL ENSUEÑO</h2>

  <div class="poema">
    <p>No querer blancos rodando</p>

    <p>en planta movible.</p>

    <p>No querer voces robando</p>

    <p>semillosas arqueada aéreas.</p>

    <p>No querer vivir mil oxígenos</p>

    <p>nimias cruzadas al cielo.</p>

    <p>No querer trasladar mi curva</p>

    <p>sin encerar la hoja actual.</p>

    <p>No querer vencer al imán</p>

    <p>la alpargata se deshilacha.</p>

    <p>No querer tocar abstractos</p>

    <p>llegar a mi último pelo marrón.</p>

    <p>No querer vencer colas blandas</p>

    <p>los árboles sitúan las hojas.</p>

    <p>No querer traer sin caos</p>

    <p>portátiles vocablos.</p>
  </div>
</body>
