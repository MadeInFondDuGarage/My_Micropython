  <h2 title="31 Es un cerrar los ojos…">31</h2>

  <p class="asangre">Es un cerrar los ojos y jurar no abrirlos. En tanto afuera se alimenten de relojes y de flores nacidas de la astucia. Pero con los ojos cerrados y un sufrimiento en verdad demasiado grande pulsamos los espejos hasta que las palabras olvidadas suenan mágicamente.</p>
