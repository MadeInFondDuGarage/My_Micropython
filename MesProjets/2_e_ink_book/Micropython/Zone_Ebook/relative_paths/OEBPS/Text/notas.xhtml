  <h1>Notas</h1>

  <div class="nota">
    <p id="nt1"><sup>[1]</sup> En esta sección se incluye el contenido de un carpeta con 41 hojas de poemas mecanografiados y corregidos a mano por AP que cabe situar aproximadamente entre los años indicados. Las fechas 1956-58 figuran solamente encabezando la parte titulada «Aproximaciones». Como en todos los casos, se siguen las correcciones de la autora, pero no se incluyen aquellos textos que, por su cantidad de correcciones, no se ha considerado oportuno presentar en este volumen. <a href="../Text/Section0237.xhtml#rf1">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt2"><sup>[2]</sup> Lleva una nota de AP a mano: «vue le 19 août 1967» <a href="../Text/Section0259.xhtml#rf2">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt3"><sup>[3]</sup> Publicado en <i>Sur</i>, Buenos Aires, nº 284, 1963, y en <i>El deseo de la palabra</i>, Ocnos, Barcelona, 1973. <a href="../Text/Section0266.xhtml#rf3">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt4"><sup>[4]</sup> Véase nota 3. <a href="../Text/Section0267.xhtml#rf4">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt5"><sup>[5]</sup> Véase nota 3. <a href="../Text/Section0268.xhtml#rf5">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt6"><sup>[6]</sup> <i>La Nación</i>, Buenos Aires, 21-III-1965. <a href="../Text/Section0269.xhtml#rf6">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt7"><sup>[7]</sup> <i>La Estafeta Literaria</i>, Madrid, nº 379-380, 1967, y la lámina de la Editorial Esezeta, Buenos Aires, 1972. <a href="../Text/Section0270.xhtml#rf7">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt8"><sup>[8]</sup> <i>Papeles de Son Armadans</i>, Palma de Mallorca, año 14, nº 145, abril de 1968 <a href="../Text/Section0271.xhtml#rf8">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt9"><sup>[9]</sup> «Densidad», «En la oscuridad abierta» y «La oscura», fueron publicados en 1969 como parte de «Nombres y figuras (aproximaciones)», en la colección dirigida por Antonio Beneyto, La Esquina, Barcelona, 1969, cuyo contenido, menos estos tres poemas, luego formó parte de <i>El infierno musical</i>, Siglo <small>XXI</small>, Buenos Aires, 1971. <a href="../Text/Section0274.xhtml#rf9">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt10"><sup>[10]</sup> <i>Papeles de Son Armadans</i>, nº CLXX, Madrid, mayo de 1970. <a href="../Text/Section0275.xhtml#rf10">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt11"><sup>[11]</sup> Este poema, como el anterior, procede de una libreta, que cabe datar entre 1969 y 1970. Una alusión en la última hoja de la libreta indicaría que estaban terminados para su autora. <a href="../Text/Section0277.xhtml#rf11">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt12"><sup>[12]</sup> Hoja suelta de cuaderno manuscrita lápiz. <a href="../Text/Section0278.xhtml#rf12">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt13"><sup>[13]</sup> Hojita mecanografiada y corregida por AP, sin fecha. <a href="../Text/Section0279.xhtml#rf13">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt14"><sup>[14]</sup> Este conjunto de ocho poemas («Del silencio» a «Sólo señal») y las citas que lo preceden, proviene de 17 hojas mecanografiadas y manuscritas que Alejandra Pizarnik llevó en 1971 a la poeta Perla Rotzait a su domicilio, en «una carpetita marrón con sus poemas prolijamente enganchados». <a href="../Text/Section0281.xhtml#rf14">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt15"><sup>[15]</sup> Debajo de la fecha, a mano: «ver poema 12-3-70». <a href="../Text/Section0284.xhtml#rf15">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt16"><sup>[16]</sup> <i>Poesía Argentina de Hoy</i>, Editorial Aguilar, 1971, álbum y disco. <a href="../Text/Section0289.xhtml#rf16">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt17"><sup>[17]</sup> <i>Encuentros</i>, Buenos Aires, sin fecha. <a href="../Text/Section0291.xhtml#rf17">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt18"><sup>[18]</sup> <i>Árbol de fuego</i>, Caracas, año 5, nº 46, enero de 1972 <a href="../Text/Section0293.xhtml#rf18">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt19"><sup>[19]</sup> Este título inicia una carpeta con lo seis poemas que se reproducen, siguiendo el orden de la carpeta. «Sobre un poema de Rubén Darío» y «Alguien cae en su primera caída» se incluyeron, sin variantes, en la edición de Ed. Sudamericana, Buenos Aires, 1982. <a href="../Text/Section0294.xhtml#rf19">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt20"><sup>[20]</sup> Publicado en <i>La Nación</i> Buenos Aires, 10-IX-1972 y en <i>Diálogos</i>, México, julio-agosto 1972. <a href="../Text/Section0295.xhtml#rf20">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt21"><sup>[21]</sup> Publicado en <i>Diálogos</i>, México, julio-agosto 1972 <a href="../Text/Section0297.xhtml#rf21">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="ntA"><sup>[*]</sup> Publicado en la revista <i>Árbol de Fuego</i>, nº 45, Caracas, 1971. <a href="../Text/Section0301.xhtml#rfA">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt22"><sup>[22]</sup> <i>Árbol de Fuego</i>, Caracas, diciembre de 1971, y <i>La Gaceta del Fondo de Cultura Económica</i>, México, Nueva Época, nº 19, julio de 1972. Esta versión sigue la publicada en <i>La Gaceta del FCE</i>. <a href="../Text/Section0321.xhtml#rf22">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt23"><sup>[23]</sup> Bajo este título «Textos de Sombra» se incluyen ocho textos hallados en los apartados INÉDITOS y ACABADOS de una carpeta, en una libreta, y hojitas sueltas, bajo «Sombra» o «Textos de Sombra». Estos manuscritos permiten suponer que AP pensaba en un libro único con ese título y un personaje, Sombra. Una nota de 1972 en otra libreta menciona Sombra, Casa de Citas y Sala 18 como textos separados sobre los que trabajaba. <a href="../Text/Section0322.xhtml#rf23">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt24"><sup>[24]</sup> Este capítulo, la cita y el texto que sigue, provienen de una hoja mecanografiada y corregida a mano por AP, en carpeta con la mención INÉDITOS donde figuran también los demás bajo la denominación «Textos de Sombra», en el orden que aquí se presentan. Las frases finales de «Un jardín» pertenecen a Henri Michaux, Cecilia Meireles, B. Brecht y Sydney Keyes. <a href="../Text/Section0323.xhtml#rf24">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt25"><sup>[25]</sup> Figura en carpeta con poemas 1970-72, sección «Acabados» <a href="../Text/Section0325.xhtml#rf25">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt26"><sup>[26]</sup> De una pequeña hoja mecanografiada y corregida a mano por AP. <a href="../Text/Section0331.xhtml#rf26">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt27"><sup>[27]</sup> AP escribió este poema durante su estadía en el Hospital Pirovano. El texto, tal como se reproduce, está mecanografiado y lleva correcciones hechas a mano por la autora. No se había incluido en la edición de 1982 de sus textos póstumos. <a href="../Text/Section0332.xhtml#rf27">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt28"><sup>[28]</sup> De un pequeño papel manuscrito que arriba dice «junio». <a href="../Text/Section0334.xhtml#rf28">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt29"><sup>[29]</sup> De una hoja mecanografiada por AP, enviada a Félix Grande, <i>Cuadernos Hispanoamericanos</i>, en agosto de 1972. <a href="../Text/Section0335.xhtml#rf29">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt30"><sup>[30]</sup> Esta versión sigue la incluida en carpeta bajo INÉDITOS, y da cuenta de las correcciones a mano de AP posteriores a la fechada en noviembre de 1970, que figura en <i>Textos de Sombra y otros poemas</i>, 1982, con el título de «La muerte y la muchacha (Schubert)». <a href="../Text/Section0338.xhtml#rf30">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt31"><sup>[31]</sup> Fragmento manuscrito en un pedazo de hoja suelta. Por errar de imprenta se editó como final de «Ojos primitivos» en <i>Textos de Sombra y otros poemas</i>, Ed. Sudamericana, Buenos Aires, 1982. <a href="../Text/Section0341.xhtml#rf31">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt32"><sup>[32]</sup> Adjunto a una carta no enviada a Jean Aristeguieta, directora de la revista <i>Árbol de Fuego</i> (Caracas), fechada en enero de 1972. <a href="../Text/Section0342.xhtml#rf32">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt33"><sup>[33]</sup> Se restituye a este texto la parte omitida en <i>Textos de Sombra y últimos poemas</i>, Sudamericana, Buenos Aires, 1982.<br/>
    Es la que precede a «No lo diré…», en hoja aparte donde figura el título y lleva un «sí» anotado a mano por AP. Se<br/>
    suprimen los puntos suspensivos de la edición de 1982. <a href="../Text/Section0350.xhtml#rf33">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt34"><sup>[34]</sup> Este texto, muy corregido, lleva abrochada una hoja previa con el título VOCES. <a href="../Text/Section0352.xhtml#rf34">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt35"><sup>[35]</sup> De copia mecanografiada por AP en 1972. Es el comienzo del que se incluye como «Prefacio de Sombra (I)». Se opta por presentar en este volumen las dos versiones, tal como se encuentran entre sus papeles. <a href="../Text/Section0353.xhtml#rf35">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt36"><sup>[36]</sup> Esta versión es la que figura en carpeta bajo «ACABADOS». Por error, en <i>Textos de Sombra…</i>., 1982, la estrofa final fue editada como poema aislado. Existen otras tres versiones: una manuscrita con el título «La sombra de su imagen» fechada 15-5-1970, otra a máquina sin fecha, en papel carta, y otra a lápiz en un cuaderno. <a href="../Text/Section0356.xhtml#rf36">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt37"><sup>[37]</sup> La palabra entre corchetes figura escrita a lápiz por AP encima de «querer», que no está tachada. <a href="../Text/Section0359.xhtml#rf37">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt38"><sup>[38]</sup> Copia corregida y mecanografiada por AP, 17-IX-72. <a href="../Text/Section0364.xhtml#rf38">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt39"><sup>[39]</sup> Por error, en <i>Textos de Sombra y otros poemas</i>, Ed. Sudamericana, Buenos Aires, 1982, este poema se editó sin tener en cuenta las tachaduras en el pedazo de papel en que está escrito a mano. Se edita ahora respetando las correcciones de AP. <a href="../Text/Section0365.xhtml#rf39">&lt;&lt;</a></p>
  </div>

  <div class="nota">
    <p id="nt40"><sup>[40]</sup> Hallado tal cual se reproduce, escrito con tiza en el pizarrón de su cuarto de trabajo. <a href="../Text/Section0366.xhtml#rf40">&lt;&lt;</a></p>
</div>
