  <h3 title="L’obscurité des eaux">L’OBSCURITÉ DES EAUX</h3>

  <p>Escucho resonar el agua que cae en mi sueño. Las palabras caen como el agua yo caigo. Dibujo en mis ojos la forma de mis ojos, nado en mis aguas, me digo en mis silencios. Toda la noche espero que mi lenguaje logre configurarme. Y pienso en el viento que viene a mí, permanece en mí. Toda la noche he caminado bajo la lluvia desconocida. A mí me han dado un silencio pleno de formas y visiones (dices). Y corres desolada como el único pájaro en el viento.</p>
