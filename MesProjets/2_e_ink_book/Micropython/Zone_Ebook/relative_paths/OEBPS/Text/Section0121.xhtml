<body>
  <h3 title="Caroline de Gunderode">CAROLINE DE GUNDERODE</h3>

  <div class="derecha">
    <p><i>En nostalgique je vagabondais</i></p>

    <p><i>par l’infini</i></p>

    <p>C. de G.</p>
  </div>

  <div class="salto25 poema">
    <p>La mano de la enamorada del viento</p>

    <p>acaricia la cara del ausente.</p>

    <p>La alucinada con su «maleta de piel de</p>

    <p class="evitasgc-1">pájaro»</p>

    <p>huye de sí misma con un cuchillo en la memoria.</p>

    <p>La que fue devorada por el espejo</p>

    <p>entra en un cofre de cenizas</p>

    <p>y apacigua a las bestias del olvido.</p>
  </div>

  <p class="salto25 asangre"><i>A Enrique Molina</i></p>
