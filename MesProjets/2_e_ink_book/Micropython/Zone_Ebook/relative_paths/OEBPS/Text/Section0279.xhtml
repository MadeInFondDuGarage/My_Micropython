<body>
  <h3 title="A un poema acerca del agua, de Silvina Ocampo">A UN POEMA ACERCA DEL AGUA, DE SILVINA OCAMPO<a href="../Text/notas.xhtml#nt13" id="rf13"><sup>[13]</sup></a>&nbsp;</h3>

  <div class="derecha">
    <p><i>A Silvina y a la condesa de Trípoli</i></p>

    <p><i>que emana toda la noche profecías</i></p>

    <p class="salto10">O. P<small>AZ</small></p>
  </div>

  <div class="salto25 poema">
    <p>Tu modo de silenciarte en el poema.</p>

    <p>Me abrís como a una flor</p>

    <p>(sin duda una flor pobre, lamentable)</p>

    <p>que ya no esperaba la terrible delicadeza</p>

    <p>de la primavera. Me abrís, me abro,</p>

    <p>me vuelvo de agua en tu poema de agua</p>

    <p>que <i>emana toda la noche profecías</i>.</p>
  </div>
</body>
