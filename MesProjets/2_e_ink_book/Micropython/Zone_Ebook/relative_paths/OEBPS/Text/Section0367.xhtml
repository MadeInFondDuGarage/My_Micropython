  <h1 title="Acerca de esta edición">ACERCA DE ESTA EDICIÓN</h1>

  <p class="asangre">El presente volumen recoge la obra poética publicada en vida de Alejandra Pizarnik, los poemas póstumos reunidos por Olga Orozco y por mí, y publicados en 1982 con el título de <i>Textos de Sombra y otros poemas</i> por la editorial Sudamericana de Buenos Aires, y poemas que han permanecido inéditos hasta la fecha. Otro volumen recogerá su obra en prosa y un tercero sus diarios.</p>

  <p>En esta primera entrega no se incluyen algunos textos que sí figuran en la edición <i>Textos de Sombra y otros poemas</i>. La decisión de incluir éste o aquel texto en uno y otro volumen no deja de ser una manera de leer, siempre personal, subjetiva; en cualquier forma, no responde a criterios académicos. Me dejé guiar por el tratamiento muy particular del ritmo que Alejandra Pizarnik daba a los textos en prosa. Por otra parte, la cantidad e importancia de los manuscritos inéditos hizo necesario separar algunos (y pasarlos al volumen de prosa) para poder incorporar otros.</p>

  <p>Todas las carpetas y cuadernos, más los pequeños papeles con anotaciones o poemas, a máquina o a mano, fueron conservados prácticamente en el mismo orden que se hallaban a la muerte de Alejandra Pizarnik. Ese orden, el de las carpetas o cuadernos, es el que he tratado, lo más escrupulosamente posible, de respetar. En notas al pie de página, en la parte correspondiente a «Poemas no recogidos en libros», doy cuenta de los manuscritos o cuadernos de donde proceden los textos. Alejandra Pizarnik era muy escrupulosa con sus papeles. Sus fichas de trabajo han sido de gran utilidad, incluso los ficheros en los que anotaba sus publicaciones en revistas, con fechas y lugares. Cuando he puesto fechas entre corchetes es porque no figuraban en el manuscrito, pero sí cabía deducirlas por la ubicación en la carpeta o el color de la tinta de las correcciones a mano. Todo este material, así como su correspondencia, las cajitas y sobrecitos en los que guardaba palabras o frases recogidas en lecturas o conversaciones, los cuadernos en los que anotaba poemas o fragmentos de otros autores, y que llamaba su «Palais du Vocabulaire», irán ahora a constituir el Archivo Alejandra Pizarnik, en la Universidad de Princeton, Estados Unidos, y podrán ser consultados por los estudiosos que tal ve un día deseen editar la obra con aparato crítico, estudiando detenidamente cada uno de los manuscritos y sus variantes y correcciones.</p>

  <p>Este volumen no es definitivo, en un sentido académico, es sólo una compilación, hecha, eso sí, con lealtad a Alejandra Pizarnik, y devoción a su obra, única e irrepetible.</p>

  <p class="salto10 derecha">A. B.</p>
