  <h3 title="Ojos primitivos">OJOS PRIMITIVOS</h3>

  <p>El color infernal de algunas pasiones, una antigua ternura. Los faltos de algo, de todo, al sol negro de sus deseos elementales, excesivos, no cumplidos.</p>

  <p class="salto10">Alguien canta una canción del color del nacimiento: por el estribillo pasa la loca con su corona plateada. Le arrojan piedras. Yo no miro nunca el interior de los cantos. Siempre, en el fondo, hay una reina muerta.</p>
