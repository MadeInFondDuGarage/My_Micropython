<body>
  <h3 title="Vértigos o contemplación de algo que termina">VÉRTIGOS O CONTEMPLACIÓN DE ALGO QUE TERMINA</h3>

  <div class="poema">
    <p>Esta lila se deshoja.</p>

    <p>Desde sí misma cae</p>

    <p>y oculta su antigua sombra.</p>

    <p>He de morir de cosas así.</p>
  </div>
