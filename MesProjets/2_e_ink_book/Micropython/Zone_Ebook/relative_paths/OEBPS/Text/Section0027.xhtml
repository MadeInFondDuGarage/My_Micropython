<body>
  <h3 title="Cielo">CIELO</h3>

  <div class="poema">
    <p>mirando el cielo</p>

    <p class="salto10">me digo que es celeste desteñido (témpera</p>

    <p>azul puro después de una ducha helada)</p>

    <p class="salto10">las nubes se mueven</p>

    <p class="salto10">pienso en tu rostro y en ti y en tus manos y</p>

    <p>en el ruido de tu pluma y en ti</p>

    <p>pero tu rostro no aparece en ninguna nube!</p>

    <p>yo esperaba verlo adherido a ella como un</p>

    <p>trozo de algodón enyodado dentro de la tela adhesiva</p>

    <p>sigo caminando</p>

    <p class="salto10">un cocktail mental embaldosa mi frente</p>

    <p>no sé si pensar en el cielo o en ti</p>

    <p>y si tirara una moneda? (cara tú seca cielo)</p>

    <p>no! tu ser no se arriesga y</p>

    <p>yo te deseo te de-se-o!</p>

    <p>cielo trozo de cosmos cielo murciélago infinito</p>

    <p>inmutable como los ojos de mi amor</p>

    <p class="salto10">pensemos en los dos</p>

    <p class="salto10">los dos tú + cielo = mis galopantes sensaciones</p>

    <p>biformes bicoloreadas bitremendas bilejanas</p>

    <p>lejanas lejanas</p>

    <p class="salto10">lejos</p>

    <p class="salto10">sí amor estás lejos como el mosquito</p>

    <p>sí! Ese que persigue a una mosquita junto</p>

    <p>al farol amarillosucio que vigila bajo el</p>

    <p>cielo negrolimpio esta noche angustiosa</p>

    <p class="evitasgc-5">llena de dualismos</p>
  </div>
</body>
