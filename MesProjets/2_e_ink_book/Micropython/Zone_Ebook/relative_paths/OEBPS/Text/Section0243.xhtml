<body>
  <h3 title="Lamento">LAMENTO</h3>

  <div class="poema">
    <p>la imagen del amor</p>

    <p>abisma términos impíos</p>

    <p>no llorarás por la eternidad</p>

    <p>sino por un niño que llora</p>

    <p>entre negras rocas</p>

    <p>el coro de ahogados</p>

    <p>tempestuosa certeza de melancolía</p>

    <p>yo sólo miro como se hunde esta barca</p>

    <p>yo sólo miro a nuestro rey invariable</p>

    <p>a nuestro ardoroso inmutable</p>

    <p>un niño cesa de respirar</p>

    <p>un barca se hunde</p>

    <p>yo miro el cielo</p>

    <p>yo escucho el silencio callado</p>
  </div>
</body>
