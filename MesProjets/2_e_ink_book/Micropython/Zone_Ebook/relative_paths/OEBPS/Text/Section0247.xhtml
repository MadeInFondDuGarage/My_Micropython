<body>
  <h3 class="oculto" title="Como una idiota cruzando la calle…">o</h3>

  <div class="poema">
    <p class="saltoinicio">Como una idiota cruzando la calle</p>

    <p>tengo miedo, me río, me saludo en el espejo</p>

    <p>con una sábana hedionda,</p>

    <p>me corto de raíz,</p>

    <p>me escupo, me execro.</p>

    <p>Como una santa acosada</p>

    <p>por voces angélicas</p>

    <p>me hundo en la canción de las plagas</p>

    <p>y me vengo, me renuncio,</p>

    <p>me silencio, me recuerdo.</p>
  </div>
</body>
