<body>
  <h3 title="Tu voz">TU VOZ</h3>

  <div class="poema">
    <p>Emboscado en mi escritura</p>

    <p>cantas en mi poema.</p>

    <p>Rehén de tu dulce voz</p>

    <p>Petrificada en mi memoria.</p>

    <p>Pájaro asido a su fuga.</p>

    <p>Aire tatuado por un ausente.</p>

    <p>Reloj que late conmigo</p>

    <p>para que nunca despierte.</p>
  </div>
</body>
