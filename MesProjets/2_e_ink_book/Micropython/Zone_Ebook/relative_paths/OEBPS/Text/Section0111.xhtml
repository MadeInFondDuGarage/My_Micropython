  <h2 title="35 Vida, mi vida, déjate caer…">35</h2>

  <p class="asangre">Vida, mi vida, déjate caer, déjate doler, mi vida, déjate enlazar de fuego, de silencio ingenuo, de piedras verdes en la casa de la noche, déjate caer y doler, mi vida.</p>
