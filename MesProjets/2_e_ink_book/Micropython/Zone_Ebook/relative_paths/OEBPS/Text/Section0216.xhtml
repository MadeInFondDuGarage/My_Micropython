  <h3 title="Nombres y figuras">NOMBRES Y FIGURAS</h3>

  <p>La hermosura de la infancia sombría, la tristeza imperdonable entre muñecas, estatuas, cosas mudas, favorables al doble monólogo entre yo y mi antro lujurioso, el tesoro de los piratas enterrado en mi primera persona del singular.</p>

  <p class="salto10">No se espera otra cosa que música y deja, deja que el sufrimiento que vibra en formas traidoras y demasiado bellas llegue al fondo de los fondos.</p>

  <p class="salto10">Hemos intentado hacernos perdonar lo que no hicimos, las ofensas fantásticas, las culpas fantasmas. Por bruma, por nadie, por sombras, hemos expiado.</p>

  <p class="salto10">Lo que quiero es honorar a la poseedora de mi sombra: la que sustrae de la nada nombres y figuras.</p>
