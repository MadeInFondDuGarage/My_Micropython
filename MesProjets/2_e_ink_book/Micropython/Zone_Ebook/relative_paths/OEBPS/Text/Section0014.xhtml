<body>
  <h2 title="…de mi diario">…DE MI DIARIO</h2>

  <div class="poema">
    <p>Miraba los coches en arreglo</p>

    <p>sin sus vestiduras metálicas</p>

    <p>las partes delanteras semejaban</p>

    <p>calaveras recién estrenadas</p>

    <p>Un sol amarillo dejaba caer indiferente</p>

    <p>pedazos luminosos de algo coloreado</p>

    <p>más las sombras persistían</p>

    <p>aún en los retazos del astro.</p>

    <p>Se sentía cansada ante las nubosidades</p>

    <p>que no se movían</p>

    <p>un blue rumiaba aburrido en su interior</p>

    <p>pasos extravagantes marcaban sus dedos</p>

    <p>movilidad acompasada de alfombra y ballet.</p>
  </div>
</body>
