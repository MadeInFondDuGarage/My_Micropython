  <h3 title="Presencia de sombra">PRESENCIA DE SOMBRA</h3>

  <p>Alguien habla. Alguien me dice.</p>

  <p>Extraordinario silencio el de esta noche.</p>

  <p>Alguien proyecta su sombra en la pared de mi cuarto. Alguien me mira con mis ojos que no son los míos.</p>

  <p>Ella escribe como una lámpara que se apaga, ella escribe como una lámpara que se enciende. Camina silenciosa. La noche es una mujer vieja con la cabeza llena de flores. La noche no es la hija preferida de la reina loca.</p>

  <p>Camina silenciosa hacia la profundidad hija de los reyes.</p>

  <p>De demencia la noche, de no tiempo. De memoria la noche, de siempre sombras.</p>
