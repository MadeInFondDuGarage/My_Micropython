<body>
  <h3 title="Donde circunda lo ávido">DONDE CIRCUNDA LO ÁVIDO</h3>

  <div class="poema">
    <p>Cuando sí venga mis ojos brillarán</p>

    <p>de la luz de quien yo lloro</p>

    <p>mas ahora alienta un rumor de fuga</p>

    <p>en el corazón de toda cosa.</p>
  </div>
