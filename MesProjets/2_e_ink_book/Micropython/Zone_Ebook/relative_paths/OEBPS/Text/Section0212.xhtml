  <h3 title="Ojos primitivos">OJOS PRIMITIVOS</h3>

  <p>En donde el miedo no cuenta cuentos y poemas, no forma figuras de terror y de gloria.</p>

  <p class="salto10">Vacío gris es mi nombre, mi pronombre.</p>

  <p class="salto10">Conozco la gama de los miedos y ese comenzar a cantar despacito en el desfiladero que reconduce hacia mi desconocida que soy, mi emigrante de sí.</p>

  <p class="salto10">Escribo contra el miedo. Contra el viento con garras que se aloja en mi respiración.</p>

  <p class="salto10">Y cuando por la mañana temes encontrarte muerta (y que no haya más imágenes): el silencio de la compresión, el silencio del mero estar, en esto se van los años, en esto se fue la bella alegría animal.</p>
