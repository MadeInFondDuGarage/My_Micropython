  <h3 title="«Casa de la mente»">«CASA DE LA MENTE»<a href="../Text/notas.xhtml#nt12" id="rf12"><sup>[12]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A A.G</i>.</p>

  <div class="salto25 poema">
    <p>la casa mental</p>

    <p>reconstruida letra por letra</p>

    <p>palabra por palabra</p>

    <p>en mi doble figura de papel</p>

    <p class="salto10">atraviesa el mar de tinta</p>

    <p>para dar un nueva forma</p>

    <p>a un nuevo sentimiento</p>

    <p class="salto10">abre la boca</p>

    <p>verde de sin raíces</p>

    <p>la palabra sin su cuerpo</p>

    <p class="salto10">un nuevo orden musical</p>

    <p>de colores de cuerpos de excedentes</p>

    <p>de formas pequeñas</p>

    <p>que se mueven gritan dicen nunca</p>

    <p>la noche dice nunca</p>

    <p>la noche me pronuncia</p>

    <p>en un poema</p>
  </div>

  <p class="salto10 derecha">14/IV/1970</p>
</body>
