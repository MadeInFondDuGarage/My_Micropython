<body>
  <h3 title="Mendiga voz">MENDIGA VOZ</h3>

  <div class="poema">
    <p>Y aún me atrevo a amar</p>

    <p>el sonido de la luz en una hora muerta,</p>

    <p>el color del tiempo en un muro abandonado.</p>

    <p class="salto10">En mi mirada lo he perdido todo.</p>

    <p>Es tan lejos pedir. Tan cerca saber que no hay.</p>
  </div>
</body>
