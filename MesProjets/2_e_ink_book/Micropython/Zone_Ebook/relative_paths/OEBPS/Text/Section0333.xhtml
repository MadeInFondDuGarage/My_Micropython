  <h3 title="Alianza">ALIANZA</h3>

  <p>Ella se abandona en la tregua originada por la noche. Dentro de ella todo hace el amor.</p>

  <p class="salto10">Alianza entre lo contemplado y su contemplación. Alegría de transgredir, reclamo de puntos vivos de referencia y de la realidad total perceptible en un instante que es todos los instantes.</p>

  <p class="salto10">Ella se abandona a un pensar desmesurado y al hechizo por un espacio definido: un lugar que obra como llamamiento.</p>
