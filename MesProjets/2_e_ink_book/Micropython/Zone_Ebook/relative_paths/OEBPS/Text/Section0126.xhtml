  <h3 title="Revelaciones">REVELACIONES</h3>

  <div class="poema">
    <p>En la noche a tu lado</p>

    <p>las palabras son claves, son llaves.</p>

    <p>El deseo de morir es rey.</p>

    <p class="salto10">Que tu cuerpo sea siempre</p>

    <p>un amado espacio de revelaciones.</p>
