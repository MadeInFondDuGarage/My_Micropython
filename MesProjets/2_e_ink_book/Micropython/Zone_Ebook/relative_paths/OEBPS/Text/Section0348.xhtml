<body>
  <h3 class="oculto" title="Ella no espera en sí misma…">o</h3>

  <p class="saltoinicio derecha"><i>A Ana Becciú</i></p>

  <p class="salto25">Ella no espera en sí misma. Nada de sí misma. Demasiado ensimismada</p>

  <p class="salto10">Sólo vine a ver el jardín donde alguien moría por culpa de algo que no pasó o de alguien que no vino.</p>

  <p class="salto10">Ella es un interior.</p>

  <p>Todo ha sido demasiado y ella se irá.</p>

  <p class="salto10">Y yo me iré.</p>

  <p class="salto10 derecha">1972</p>
