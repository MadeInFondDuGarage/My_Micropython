<body>
  <h2 title="Poema para Emily Dickinson">POEMA PARA EMILY DICKINSON</h2>

  <div class="poema">
    <p>Del otro lado de la noche</p>

    <p>la espera su nombre,</p>

    <p>su subrepticio anhelo de vivir,</p>

    <p>¡del otro lado de la noche!</p>

    <p class="salto10">Algo llora en el aire,</p>

    <p>los sonidos diseñan el alba.</p>

    <p class="salto10">Ella piensa en la eternidad.</p>
  </div>
