<body>
  <h2 title="17 Días en que una palabra lejana…">17</h2>

  <p class="asangre">Días en que una palabra lejana se apodera de mí. Voy por esos días sonámbula y transparente. La hermosa autómata se canta, se encanta, se cuenta casos y cosas: nido de hilos rígidos donde me danzo y me lloro en mis numerosos funerales. (Ella es su espejo incendiado, su espera en hogueras frías, su elemento místico, su fornicación de nombres creciendo solos en la noche pálida.)</p>
