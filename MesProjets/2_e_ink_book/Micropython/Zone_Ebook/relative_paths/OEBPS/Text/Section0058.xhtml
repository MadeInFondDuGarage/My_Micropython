<body>
  <h2 title="La única herida">LA ÚNICA HERIDA</h2>

  <div class="poema">
    <p>¿Qué bestia caída de pasmo</p>

    <p>se arrastra por mi sangre</p>

    <p>y quiere salvarse?</p>

    <p class="salto10">He aquí lo difícil:</p>

    <p>caminar por las calles</p>

    <p>y señalar el cielo o la tierra.</p>
  </div>
