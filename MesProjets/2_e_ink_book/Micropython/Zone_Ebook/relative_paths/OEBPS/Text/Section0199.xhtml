  <h3 title="Adioses del verano">ADIOSES DEL VERANO</h3>

  <p>Suave rumor de la maleza creciendo. Sonidos de lo que destruye el viento. Llegan a mí como si yo fuera el corazón de lo que existe. Quisiera estar muerta y entrar yo también en un corazón ajeno.</p>
