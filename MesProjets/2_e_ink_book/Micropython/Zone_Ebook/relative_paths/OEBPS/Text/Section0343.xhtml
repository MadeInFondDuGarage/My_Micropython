<body>
  <h3 class="oculto" title="y cantos…">o</h3>

  <div class="poema">
    <p class="saltoinicio evitasgc-15">y cantos</p>

    <p>entre ruinas de niños ahogados,</p>

    <p>más allá de toda destrucción,</p>

    <p>de todas las ceremonias de la muerte</p>

    <p>está la presencia de quien yo amo,</p>

    <p>quien disipa las apariencias de los atroces espejos del mediodía,</p>

    <p>quien evita incluso que los espejos se rompan,</p>

    <p>que la sal se vuelque.</p>
  </div>

  <p class="salto10 derecha">[1971]</p>
</body>
