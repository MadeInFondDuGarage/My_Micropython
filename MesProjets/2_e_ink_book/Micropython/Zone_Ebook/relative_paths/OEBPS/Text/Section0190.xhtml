  <h3 title="Un sueño donde el silencio es de oro">UN SUEÑO DONDE EL SILENCIO ES DE ORO</h3>

  <p>El perro del invierno dentellea mi sonrisa. Fue en el puente. Yo estaba desnuda y llevaba un sombrero con flores y arrastraba mi cadáver también desnudo y con un sombrero de hojas secas.</p>

  <p>He tenido muchos amores —dije— pero el más hermoso fue mi amor por los espejos.</p>
