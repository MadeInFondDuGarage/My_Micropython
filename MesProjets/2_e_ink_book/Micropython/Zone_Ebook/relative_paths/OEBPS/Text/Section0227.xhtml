  <h3 title="Gesto para un objeto">GESTO PARA UN OBJETO</h3>

  <p>En tiempo dormido, un tiempo como un guante sobre un tambor.</p>

  <p class="salto10">Los tres que en mí contienden nos hemos quedado en el móvil punto fijo y no somos ni un es ni un estoy.</p>

  <p class="salto10">Antiguamente mis ojos buscaron refugio en las cosas humilladas, desamparadas, pero en amistad con mis ojos he visto, he visto y no aprobé.</p>
