  <h3 title="En un principio fueron mis muertos">EN UN PRINCIPIO FUERON MIS MUERTOS</h3>

  <p>Los ausentes soplan grismente y la noche es densa.</p>

  <p>La noche tiene el color de los párpados del muerto.</p>

  <p class="salto10">Toda la noche huyo, encauzo la persecución y la fuga,</p>

  <p>canto un canto para mis males,</p>

  <p>pájaros negros sobre mortajas negras.</p>

  <p class="salto10">Un viento demente me desmiente. Me confino, me alejo de la mano crispada, no sé otra cosa que la noche oscura.</p>
