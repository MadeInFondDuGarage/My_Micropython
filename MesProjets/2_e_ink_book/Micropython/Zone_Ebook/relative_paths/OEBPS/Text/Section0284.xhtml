  <h3 title="La noche, el poema">LA NOCHE, EL POEMA</h3>

  <div class="asangre">
    <p>Alguien ha encontrado su verdadera voz y la prueba en el mediodía de los muertos. Amigo del color de las cenizas. Nada más intenso que el terror de perder la identidad. Este recinto lleno de mis poemas atestigua que la niña abandonada en una casa en ruinas soy yo.</p>

    <p class="salto10">Escribo con la ceguera desalmada con que los niños arrojan piedras a una loca como si fuese un mirlo. En realidad no escribo: abro brecha para que hasta mí llegue, al crepúsculo, el mensaje de un muerto.</p>

    <p class="salto10">Y este oficio de escribir. Veo por espejo, en oscuridad. Presiento un lugar que nadie más que yo conoce. Canto de las distancias, escucho voces de pájaros pintados sobre árboles adornados como iglesias.</p>

    <p class="salto10">Mi desnudez te daba luz como una lámpara. Pulsabas mi cuerpo para que no hiciera el gran frío de la noche, lo negro.</p>

    <p class="salto10">Mis palabras exigen silencio y espacios abandonados.</p>

    <p class="salto10">Hay palabras con manos; apenas escritas, me buscan el corazón. Hay palabras condenadas como lilas en la tormenta. Hay palabras parecidas a ciertos muertos, si bien prefiero, entre todas, aquellas que evocan la muñeca de una niña desdichada.</p>
  </div>

  <p class="salto10 derecha">23/XI/69<a href="../Text/notas.xhtml#nt15" id="rf15"><sup>[15]</sup></a></p>
