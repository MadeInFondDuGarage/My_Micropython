<body>
  <h2 title="La caída">LA CAÍDA</h2>

  <div class="poema">
    <p>Música jamás oída,</p>

    <p>Amada en antiguas fiestas.</p>

    <p>¿Ya nunca volveré a abrazar</p>

    <p>al que vendrá después del final?</p>

    <p class="salto10">Pero esta inocente necesidad de viajar</p>

    <p>entre plegarias y aullidos.</p>

    <p>Yo no sé. No sé sino el rostro</p>

    <p>de cien ojos de piedra</p>

    <p>que llora junto al silencio</p>

    <p>y que me espera.</p>

    <p class="salto10">Jardín recorrido en lágrimas,</p>

    <p>habitantes que besé</p>

    <p>cuando mi muerte aún no había nacido.</p>

    <p>En el viento sagrado</p>

    <p>tejían mi destino.</p>
  </div>
</body>
