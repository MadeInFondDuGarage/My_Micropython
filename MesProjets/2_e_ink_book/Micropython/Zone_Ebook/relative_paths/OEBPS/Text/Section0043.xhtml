<body>
  <h2 title="Solamente">SOLAMENTE</h2>

  <div class="poema">
    <p>ya comprendo la verdad</p>

    <p>estalla en mis deseos</p>

    <p class="salto10">y en mis desdichas</p>

    <p>en mis desencuentros</p>

    <p>en mis desequilibrios</p>

    <p>en mis delirios</p>

    <p class="salto10">ya comprendo la verdad</p>

    <p class="salto10">ahora</p>

    <p>a buscar la vida</p>
  </div>
