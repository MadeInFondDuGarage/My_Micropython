<body>
  <h3 title="XII cuervos en mi mente…">XII</h3>

  <p class="derecha"><i>A Alain de Vermont</i></p>

  <div class="salto25 poema">
    <p>cuervos en mi mente</p>

    <p>sobre su querido cuerpo</p>

    <p class="salto10">es el gran frío de la noche</p>

    <p>lo negro</p>

    <p class="salto10">pasión de nuestros señores</p>

    <p>los deseos</p>
  </div>
