<body>
  <h2 title="Noche">NOCHE</h2>

  <div class="poema">
    <p>correr no sé dónde</p>

    <p>aquí o allá</p>

    <p>singulares recodos desnudos</p>

    <p>basta correr!</p>

    <p>trenzas sujetas a mi anochecer</p>

    <p>de caspa y agua colonia</p>

    <p>rosa quemada fósforo de seda</p>

    <p>creación sincera en surco capilar</p>

    <p>la noche desanuda su bagaje</p>

    <p>de blancos y negros</p>

    <p>tirar detener su devenir</p>
  </div>
</body>
