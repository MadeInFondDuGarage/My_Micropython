<body>
  <h2 title="Cenizas">CENIZAS</h2>

  <div class="poema">
    <p>La noche se astilló en estrellas</p>

    <p>mirándome alucinada</p>

    <p>el aire arroja odio</p>

    <p>embellecido su rostro</p>

    <p class="salto10">con música.</p>

    <p>Pronto nos iremos</p>

    <p class="salto10">Arcano sueño</p>

    <p>antepasado de mi sonrisa</p>

    <p>el mundo está demacrado</p>

    <p>y hay candado pero no llaves</p>

    <p>y hay pavor pero no lágrimas.</p>

    <p class="salto10">¿Qué haré conmigo?</p>

    <p class="salto10">Porque a Ti te debo lo que soy</p>

    <p class="salto10">Pero no tengo mañana</p>

    <p class="salto10">Porque a Ti te…</p>

    <p class="salto10">La noche sufre.</p>
  </div>
