<body>
  <h3 class="oculto" title="cuidado con las palabras…">o</h3>

  <div class="poema">
    <p class="saltoinicio">cuidado con las palabras</p>

    <p class="evitasgc-19">(dijo)</p>

    <p>tienen filo</p>

    <p class="evitasgc-18">te cortarán la lengua</p>

    <p>cuidado</p>

    <p class="evitasgc-17">te hundirán en la cárcel</p>

    <p>cuidado</p>

    <p class="evitasgc-17">no despertar a las palabras</p>

    <p>acuéstate en las arenas negras</p>

    <p>y que el mar te entierre</p>

    <p>y que los cuervos se suiciden en tus ojos cerrados</p>

    <p>cuídate</p>

    <p class="evitasgc-16">no tientes a los ángeles de las vocales</p>

    <p>no atraigas frases</p>

    <p class="evitasgc-15">poemas</p>

    <p class="evitasgc-14">versos</p>

    <p>no tienes nada que decir</p>

    <p>nada que defender</p>

    <p>sueña sueña que no estás aquí</p>

    <p>que ya te has ido</p>

    <p>que todo ha terminado</p>
  </div>
</body>
