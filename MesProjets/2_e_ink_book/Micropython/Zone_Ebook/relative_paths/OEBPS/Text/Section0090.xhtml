<body>
  <h2 title="14 El poema que no digo…">14</h2>

  <div class="poema">
    <p>El poema que no digo,</p>

    <p>el que no merezco.</p>

    <p>Miedo de ser dos</p>

    <p>camino del espejo:</p>

    <p>alguien en mí dormido</p>

    <p>me come y me bebe.</p>
  </div>
