  <h3 title="Caminos del espejo">CAMINOS DEL ESPEJO</h3>

  <p class="centrado">I</p>

  <p class="salto10">Y sobre todo mirar con inocencia. Como si no pasara nada, lo cual es cierto.</p>

  <p class="salto10 centrado">II</p>

  <p class="salto10">Pero a ti quiero mirarte hasta que tu rostro se aleje de mi miedo como un pájaro del borde filoso de la noche.</p>

  <p class="salto10 centrado">III</p>

  <p class="salto10">Como una niña de tiza rosada en un muro muy vieja súbitamente borrada por la lluvia.</p>

  <p class="salto10 centrado">IV</p>

  <p class="salto10">Como cuando se abre una flor y revela el corazón que no tiene.</p>

  <p class="salto10 centrado">V</p>

  <p class="salto10">Todos los gestos de mi cuerpo y de mi voz para hacer de mí la ofrenda, el ramo que abandona el viento en el umbral.</p>

  <p class="salto10 centrado">VI</p>

  <p class="salto10">Cubre la memoria de tu cara con la máscara de la que serás y asusta a la niña que fuiste.</p>

  <p class="salto10 centrado">VII</p>

  <p class="salto10">La noche de los dos se dispersó con la niebla. Es la estación de los alimentos fríos.</p>

  <p class="salto10 centrado">VIII</p>

  <p class="salto10">Y la sed, mi memoria es de la sed, yo abajo, en el fondo, en el pozo, yo bebía, yo recuerdo.</p>

  <p class="salto10 centrado">IX</p>

  <p class="salto10">Caer como un animal herido en el lugar que iba a ser de revelaciones.</p>

  <p class="salto10 centrado">X</p>

  <p class="salto10">Como quien no quiere la cosa. Ninguna cosa. Boca cosida. Párpados cosidos. Me olvidé. Adentro el viento. Todo cerrado y el viento adentro.</p>

  <p class="salto10 centrado">XI</p>

  <p class="salto10">Al negro sol del silencio las palabras se doraban.</p>

  <p class="salto10 centrado">XII</p>

  <p class="salto10">Pero el silencio es cierto. Por eso escribo. Estoy sola y escribo. No, no estoy sola. Hay alguien aquí que tiembla.</p>

  <p class="salto10 centrado">XIII</p>

  <p class="salto10">Aún si digo <i>sol</i> y <i>luna</i> y <i>estrella</i> me refiero a cosas que me suceden. ¿Y qué deseaba yo?</p>

  <p>Deseaba un silencio perfecto.</p>

  <p>Por eso hablo.</p>

  <p class="salto10 centrado">XIV</p>

  <p class="salto10">La noche tiene la forma de un grito de lobo.</p>

  <p class="salto10 centrado">XV</p>

  <p class="salto10">Delicia de perderse en la imagen presentida. Yo me levanté de mi cadáver, yo fui en busca de quien soy. Peregrina de mí, he ido hacia la que duerme en un país al viento.</p>

  <p class="salto10 centrado">XVI</p>

  <p class="salto10">Mi caída sin fin a mi caída sin fin en donde nadie me aguardó pues al mirar quien me aguardaba no vi otra cosa que a mí misma.</p>

  <p class="salto10 centrado">XVII</p>

  <p class="salto10">Algo caía en el silencio. Mi última palabra fue <i>yo</i> pero me refería al alba luminosa.</p>

  <p class="salto10 centrado">XVIII</p>

  <p class="salto10">Flores amarillas constelan un círculo de tela azul. El agua tiembla llena de viento.</p>

  <p class="salto10 centrado">XIX</p>

  <p class="salto10">Deslumbramiento del día, pájaros amarillos en la mañana. Una mano desata tinieblas, una mano arrastra la cabellera de una ahogada que no cesa de pasar por el espejo. Volver a la memoria del cuerpo, he de volver a mis huesos en duelo, he de comprender lo que dice mi voz.</p>
</body>
