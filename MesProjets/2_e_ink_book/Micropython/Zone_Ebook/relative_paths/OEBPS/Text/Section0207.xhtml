  <h3 title="Noche compartida en el recuerdo de una huida">NOCHE COMPARTIDA EN EL RECUERDO DE UNA HUIDA</h3>

  <p>Golpes en la tumba. Al filo de las palabras golpes en la tumba. Quien vive, dije. Yo dije quién vive. Y hasta cuando esta intromisión de lo externo en lo interno, o de lo menos interno de lo interno, que se va tejiendo como un manto de arpillera sobre mi pobreza indecible.</p>

  <p>No fue el sueño, no fue la vigilia, no fue el crimen, no fue el nacimiento: solamente el golpear con un pesado cuchillo sobre la tumba de mi amigo. Y lo absurdo de mi costado derecho, lo absurdo de un sauce inclinado hacia la derecha sobre un río, mi brazo derecho, mi hombro derecho, mi oreja derecha, mi pierna derecha, mi posesión derecha, mi desposesión. Desviarme hacia mi muchacha izquierda —manchas azules en mi palma izquierda, misteriosas manchas azules—, mi zona de silencio virgen, mi lugar de reposo en donde me estoy esperando. No, aún es demasiado desconocida, aún no sé reconocer estos sonidos nuevos que están iniciando un canto de queja diferente del mío que es un canto de quemada, que es un canto de niña perdida en una silenciosa ciudad en ruinas.</p>

  <p>¿Y cuántos centenares de años hace que estoy muerta y te amo?</p>

  <p>Escucho mis voces, los coros de los muertos. Atrapada entre las rocas; empotrada en la hendidura de una roca. No soy yo la hablante: es el viento que me hace aletear para que yo crea que estos cánticos del azar que se formulan por obra del movimiento son palabras venidas de mí.</p>

  <p>Y esto fue cuando empecé a morirme, cuando golpearon en los cimientos y me recordé.</p>

  <p>Suenan las trompetas de la muerte. El cortejo de muñecas de corazones de espejo con mis ojos azul-verdes reflejados en cada uno de los corazones. Imitas gestos viejos heredados. Las damas de antaño cantaban entre muros leprosos, escuchaban las trompetas de la muerte, miraban desfilar —ellas, las imaginadas— un cortejo imaginario de muñecas con corazones de espejo y en cada corazón mis ojos de pájara de papel dorado embestida por el viento. La imaginada pajarita cree cantar; en verdad sólo murmura como un sauce inclinado sobre el río.</p>

  <p>Muñequita de papel, yo la recorté en papel celeste, verde, rojo, y se quedó en el suelo, en el máximo de la carencia de relieves y de dimensiones. En medio del camino te incrustaron, figurita errante, estás en el medio del camino y nadie te distingue pues no te diferencias del suelo aun si a veces gritas, pero ha tantas cosas que gritan en un camino ¿por qué irían a ver qué significa esa mancha verde, celeste, roja?</p>

  <p>Si fuertemente, a sangre y fuego, se graban mis imágenes, sin sonidos, sin colores, ni siquiera lo blanco. Si se intensifica el rastro de los animales nocturnos en las inscripciones de mis huesos. Si me afinco en el lugar del recuerdo como una criatura se atiene a la saliente de una montaña y al más pequeño movimiento hecho de olvido cae —hablo de lo irremediable, pido lo irremediable—, el cuerpo desatado y los huesos desparramados en el silencio de la nieve traidora. Proyectada hacia el regreso, cúbreme con una mortaja lila. Y luego cántame una canción de una ternura sin precedentes, una canción que no diga de la vida ni de la muerte sino de gestos levísimos como el más imperceptible ademán de aquiescencia, una canción que sea menos que una canción, una canción como un dibujo que representa una pequeña casa debajo de un sol al que le faltan algunos rayos; allí ha de poder vivir la muñequita de papel verde, celeste y rojo; allí se ha de poder erguir y tal vez andar en su casita dibujada sobre una página en blanco.</p>
