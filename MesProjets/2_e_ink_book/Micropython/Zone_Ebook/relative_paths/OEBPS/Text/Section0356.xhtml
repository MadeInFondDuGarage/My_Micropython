  <h3 title="Jardín o tiempo">JARDÍN O TIEMPO<a href="../Text/notas.xhtml#nt36" id="rf36"><sup>[36]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A Renée Cuellar</i></p>

  <div class="salto25 poema">
    <p>Es una muerta estación</p>

    <p>cuando los lobos viven sólo de viento</p>

    <p>y la vista de todos los grises</p>

    <p>es lo único que rompe el silencio</p>

    <p>en el que yo vi mi sol oscurecerse</p>

    <p class="salto10">Voces mías que, unas con silencios</p>

    <p>y otras con colores,</p>

    <p>me atormentan:</p>

    <p>diremos su nombre y no vendrá;</p>

    <p>de cerca, de lejos, no responderá.</p>

    <p class="salto10">Serás desolada</p>

    <p>y tu voz será la fantasma</p>

    <p>que se arrastra por lo oscuro,</p>

    <p>jardín o tiempo donde su mirada</p>

    <p>silencio, silencio</p>
  </div>
</body>
