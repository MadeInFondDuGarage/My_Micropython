<body>
  <h2 title="Dibujo">DIBUJO</h2>

  <div class="poema">
    <p>La rodilla de la ensenada</p>

    <p>Huele primores bien escritos</p>

    <p>Escarchas salientes mojan su</p>

    <p>Cuerpo arqueado</p>

    <p>Mil relojes zumban</p>

    <p>Las horas de las mil distancias</p>

    <p>Y el florero renace</p>

    <p>Bajo la sombra de la catacumba</p>
  </div>
