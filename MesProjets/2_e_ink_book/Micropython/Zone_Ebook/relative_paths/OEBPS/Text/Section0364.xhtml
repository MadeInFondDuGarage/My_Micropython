  <h3 title="La mesa verde">LA MESA VERDE<a href="../Text/notas.xhtml#nt38" id="rf38"><sup>[38]</sup></a>&nbsp;</h3>

  <p>El sol como un gran animal demasiado amarillo. Es una suerte que nadie me ayude. Nada más peligroso, cuando se necesita ayuda, que recibir ayuda.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Me rememoro al sol de la infancia, infusa de muerte, de vida hermosa.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Pero a mi noche no la mata ningún sol.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">La errancia, la canción de nosotros dos, tiemblo como en una metáfora el alma comparada con una candela.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Y nada será tuyo salvo un ir hacia donde no hay dónde.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">He aquí que se estremece el espacio como un gran loco.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Alguien demora en el jardín el paso del tiempo.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Me alimento de música y de agua negra. Soy tu niña calcinada por un sueño implacable.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Máscaras de la noche en qué lugar perdido que nadie más que yo conoce.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">¿Tendré tiempo para hacerme una máscara cuando emerja de la sombra?</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Invitada a ir nada más que hasta el fondo.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Me pruebo en el lenguaje que compruebo el peso de mis muertos.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">El mar esconde sus muertos. Porque lo de abajo tiene que quedar abajo.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Para mejor ser el que fue, ha querellado con su nueva sombra, ha luchado contra lo opaco.</p>
