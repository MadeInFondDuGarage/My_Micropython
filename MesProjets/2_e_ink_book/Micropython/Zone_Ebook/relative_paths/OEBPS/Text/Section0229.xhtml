  <h3 title="Endechas">ENDECHAS</h3>

  <p class="centrado">I</p>

  <p class="salto10">El lenguaje silencioso engendra fuego. El silencio se propaga, el silencio es fuego.</p>

  <p class="salto10">Era preciso decir acerca del agua o simplemente apenas nombrarla, de modo de atraerse la palabra agua para que apague las llamas del silencio.</p>

  <p class="salto10">Porque no cantó, su sombra canta. Donde una vez sus ojos hechizaron mi infancia, el silencio al rojo rueda como un sol.</p>

  <p class="salto10">En el corazón de la palabra lo alcanzaron; y yo no puedo narrar el espacio ausente y azul creado por sus ojos.</p>

  <p class="salto25 centrado">II</p>

  <p class="salto10">Con una esponja húmeda de lluvia gris borraron el ramo de lilas dibujado en su cerebro.</p>

  <p class="salto10">El signo de su estar es la enlutada escritura de los mensajes que se envía. Ella se prueba en su nuevo lenguaje e indaga el peso del muerto en la balanza de su corazón.</p>

  <p class="salto25 centrado">III</p>

  <p class="salto10">Y el signo de su estar crea el corazón de la noche.</p>

  <p class="salto10">Aprisionada: alguna vez se olvidarán las culpas, se emparentarán los vivos y los muertos.</p>

  <p class="salto10">Aprisionada: no has sabido prever que su final iría a ser la gruta a donde iban los malos en los cuentos para niños.</p>

  <p class="salto10">Aprisionada: deja que se cante como se pueda y se quiera. Hasta que en la merecida noche se cierna la brusca desocultada. A exceso de sufrimiento exceso de noche y de silencio.</p>

  <p class="salto25 centrado">IV</p>

  <p class="salto10">Las metáforas de asfixia se despojan del sudario, el poema. El terror es nombrado con el modelo delante, a fin de no equivocarse.</p>

  <p class="salto25 centrado">V</p>

  <p class="salto10">Y yo sola con mis voces, y tú, tanto estás del otro lado que te confundo conmigo.</p>
