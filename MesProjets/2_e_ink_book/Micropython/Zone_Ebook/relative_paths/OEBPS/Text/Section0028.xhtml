<body>
  <h3 title="Voy cayendo">VOY CAYENDO</h3>

  <p class="centrado">1</p>

  <div class="poema">
    <p>el vino es como un llanto desolado que</p>

    <p>humedece mi juventud frente a tus besos que</p>

    <p class="evitasgc-7">otra deglute</p>

    <p>el vino es el elixir que pulveriza los</p>

    <p class="evitasgc-7">pestilentes deseos de</p>

    <p class="evitasgc-7">mi cuerpo que</p>

    <p>aletea gimiendo frente a tu efigie de</p>

    <p class="evitasgc-7">sombra amodorrada</p>
  </div>

  <p class="salto10 centrado">2</p>

  <div class="salto10 poema">
    <p>el vino se aclara mezclado a mis</p>

    <p class="evitasgc-7">lágrimas tan mudas</p>

    <p>tu rostro de gitano enharinado aparece en</p>

    <p class="evitasgc-7">cada burbuja</p>

    <p>mi garganta es un archipiélago maldito</p>

    <p>mi sien la tapa de un pozo inmundo</p>

    <p>desearte amor y enfrentar tu altura con</p>

    <p class="evitasgc-7">cursis angustias!</p>
  </div>
</body>
