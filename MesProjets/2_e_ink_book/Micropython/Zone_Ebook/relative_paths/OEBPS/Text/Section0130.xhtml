<body>
  <h3 title="Quien alumbra">QUIEN ALUMBRA</h3>

  <div class="poema">
    <p>Cuando me miras</p>

    <p>mis ojos son llaves,</p>

    <p>el muro tiene secretos,</p>

    <p>mi temor palabras, poemas.</p>

    <p>Sólo tú haces de mi memoria</p>

    <p>una viajera fascinada,</p>

    <p>un fuego incesante.</p>
  </div>
</body>
