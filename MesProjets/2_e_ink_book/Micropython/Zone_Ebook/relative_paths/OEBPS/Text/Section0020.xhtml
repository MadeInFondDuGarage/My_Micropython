<body>
  <h2 title="Un boleto objetivo">UN BOLETO OBJETIVO</h2>

  <p class="centrado">1</p>

  <div class="salto10 poema">
    <p>entre los soplos de tantas arterias</p>

    <p>hurgo agazapada en los bolsillos de</p>

    <p class="evitasgc-3">mi campera</p>

    <p>tratando de hallar algo que haga</p>

    <p class="evitasgc-3">flotar mi destripada</p>

    <p class="evitasgc-3">aurora</p>
  </div>

  <p class="salto10 centrado">2</p>

  <div class="salto10 poema">
    <p>miro rostros busco rostros hallo rostros</p>

    <p>la imagen de su igualdad enfría la</p>

    <p class="evitasgc-3">estética</p>

    <p>desde la ventanilla tranviaria mi</p>

    <p class="evitasgc-3">asiento es la cima</p>

    <p class="evitasgc-3">del mundo</p>
  </div>

  <p class="salto10 centrado">3</p>

  <div class="salto10 poema">
    <p>vuelan uñas brazos anillos peces</p>

    <p>vienen sonidos azules rojos verdes</p>

    <p>desfile que hierve en tremendos</p>

    <p class="evitasgc-3">borbotones</p>

    <p>mas nada altera insinuante la</p>

    <p class="evitasgc-3">seguridad en mi</p>

    <p class="evitasgc-3">asiento</p>
  </div>
</body>
