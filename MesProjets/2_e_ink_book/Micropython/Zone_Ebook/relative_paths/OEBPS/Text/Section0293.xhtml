  <h3 title="Poema para el padre">POEMA PARA EL PADRE<a href="../Text/notas.xhtml#nt18" id="rf18"><sup>[18]</sup></a>&nbsp;</h3>

  <div class="poema">
    <p>Y fue entonces</p>

    <p>que con la lengua muerta y fría en la boca</p>

    <p>cantó la canción que no le dejaron cantar</p>

    <p>en este mundo de jardines obscenos y de sombras</p>

    <p class="evitasgc-13">que venían a deshora a recordarle</p>

    <p class="evitasgc-13">cantos de su tiempo de muchacho</p>

    <p>en el que no podía cantar la canción que quería cantar</p>

    <p>la canción que no le dejaron cantar</p>

    <p>sino a través de sus ojos azules ausentes</p>

    <p>de su boca ausente</p>

    <p>de su voz ausente.</p>

    <p>Entonces, desde la torre más alta de la ausencia</p>

    <p>su canto resonó en la opacidad de lo ocultado</p>

    <p>en la extensión silenciosa</p>

    <p>llena de oquedades movedizas como las palabras que escribo.</p>
  </div>

  <p class="salto10 derecha">23 de noviembre de 1971</p>
