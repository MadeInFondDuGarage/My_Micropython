<body>
  <h3 class="oculto" title="Quiero decir, pero siento…">o</h3>

  <div class="asangre">
    <p class="saltoinicio">Quiero decir, pero siento lo que ella es. Encuentra que es muerte amor si bien todo, sin amor, le es ofensa. No sabe por qué no calla puesto que su amor la vuelve inocente. Dueña del crepúsculo, tañe los espejos de los pronombres.</p>

    <p class="salto10">Cada palabra que escribo me restituye a la ausencia por la que escribo lo que no escribiría si te dejara venir aquí.</p>

    <p class="salto10">Me atengo al poema. El poema me lleva a los confines, lejos de las casas de los vivos. ¿Y por dónde andaré cuándo me vaya y no vuelva?</p>

    <p class="salto10">Y nadie comprende. Toda mi vida te espera. Y sin embargo busco la noche del poema. Solamente pienso en tu cuerpo pero rehago el cuerpo de mi poema como quien trata de curarse una herida.</p>

    <p class="salto10">Y nadie me comprende. Yo sé que la vida, que el amor, deben cambiar. Esto que dice mi máscara sobre el animal que soy, alude penosamente a una alianza entre las palabras y las sombras. De donde se deriva un estado de terror que niega el orden de los humanos.</p>
  </div>

  <p class="salto10 derecha">26/XI/69</p>
</body>
