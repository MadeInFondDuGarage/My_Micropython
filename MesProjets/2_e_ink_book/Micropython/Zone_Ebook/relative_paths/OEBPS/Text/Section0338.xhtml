  <h3 title="El ojo de la alegría (un cuadro de Chagall y Schubert)">EL OJO DE LA ALEGRÍA<br/>
  (UN CUADRO DE CHAGALL Y SCHUBERT)<a href="../Text/notas.xhtml#nt30" id="rf30"><sup>[30]</sup></a>&nbsp;</h3>

  <div class="poema">
    <p>La muerte y la muchacha</p>

    <p>abrazadas en el bosque</p>

    <p>devoran el corazón de la música</p>

    <p>en el corazón del sinsentido</p>

    <p class="salto10">una muchacha lleva un candelabro de siete brazos</p>

    <p>y baila detrás de los tristes músicos</p>

    <p>que tañen violines rotos</p>

    <p>en torno a una mujer verde abrazada a un unicornio y a una mujer azul abrazada a un gallo</p>

    <p class="salto10">en lo bajo</p>

    <p>y en lo triste</p>

    <p>hay casitas</p>

    <p>que nadie ve</p>

    <p>de madera, húmedas,</p>

    <p>hundiéndose como barcos,</p>

    <p>¿era esto, pues, el concepto del espacio?</p>

    <p>criaturas en erección</p>

    <p>y la mujer azul</p>

    <p>en el ojo de la alegría enfoca directamente</p>

    <p>la taumaturga estación de los amores muertos.</p>
  </div>
