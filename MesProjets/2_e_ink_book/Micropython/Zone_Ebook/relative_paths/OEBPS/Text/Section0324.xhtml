  <h3 class="oculto" title="Solo buscaba un lugar…">o</h3>

  <p class="saltoinicio">Solo buscaba un lugar más o menos propicio para vivir, quiero decir: un sitio pequeño donde cantar y poder llorar tranquila a veces. En verdad no quería una casa; Sombra quería un jardín.</p>

  <p>—Sólo vine ver el jardín —dijo.</p>

  <p>Pero cada vez que visitaba un jardín comprobaba que no era el que buscaba, el que quería. Era como hablar o escribir. Después de hablar o de escribir siempre tenía que explicar:</p>

  <p>—No, no es eso lo que yo quería decir.</p>

  <p>Y lo peor es que también el silencio la traicionaba.</p>

  <p>—Es porque el silencio no existe —dijo.</p>

  <p>El jardín, las voces, la escritura, el silencio.</p>

  <p>—No hago otra cosa que buscar y no encontrar. Así pierdo las noches.</p>

  <p>Sintió que era culpable de algo grave.</p>

  <p>—Yo creo en las noches —dijo.</p>

  <p>A lo cual no supo responderse: sintió que le clavaban una flor azul en el pensamiento con el fin de que no siguiera el curso de su discurso hasta el fondo.</p>

  <p>—Es porque el fondo no existe —dijo.</p>

  <p>La flor azul se abrió en su mente. Vio palabras como pequeñas piedras diseminadas en el espacio negro de la noche. Luego, pasó un cisne con rueditas con un gran moño rojo en el interrogativo cuello. Una niñita que se le parecía montaba el cisne.</p>

  <p>—Esa niñita fui yo —dijo Sombra.</p>

  <p class="salto10">Sombra está desconcertada. Se dice que, en verdad, trabaja demasiado desde que murió Sombra. Todo es pretexto para ser un pretexto, pensó Sombra asombrada.</p>

  <p class="salto10 derecha">1-V-1972</p>
