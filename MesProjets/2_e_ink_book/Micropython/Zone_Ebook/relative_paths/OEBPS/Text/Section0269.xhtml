  <h3 title="Pequeños poemas en prosa">PEQUEÑOS POEMAS EN PROSA<a href="../Text/notas.xhtml#nt6" id="rf6"><sup>[6]</sup></a>&nbsp;</h3>

  <p>Se cerró el sol, se cerró el sentido del sol, se iluminó el sentido de cerrarse.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Llega un día en que la poesía se hace sin lenguaje, día en que se convocan los grandes y pequeños deseos diseminados en los versos, reunidos de súbito en dos ojos, los mismos que tanto alababa en la frenética ausencia de la página en blanco.</p>

  <p class="salto10 centrado">*</p>

  <p class="salto10">Enamorada de las palabras que crean noches pequeñas en lo increado del día y su vacío feroz…</p>
