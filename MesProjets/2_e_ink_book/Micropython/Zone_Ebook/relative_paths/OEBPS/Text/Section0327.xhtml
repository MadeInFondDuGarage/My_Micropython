  <h3 title="Escrito cuando sombra">ESCRITO CUANDO SOMBRA</h3>

  <p>—Empecemos por decir que Sombra había muerto.</p>

  <p>—Desapareció tras su propia desaparición.</p>

  <p>—Estaba trabajando en su despacho. Sin desearlo, escuchaba a la gente que pasaba golpeándose el pecho con las manos y las piedras del pavimento con los pies para entrar en calor.</p>

  <p>—Entretanto, la bruma y la oscuridad hiciéronse tan densas que Sombra caminaba por su gabinete alumbrándose con fósforos.</p>

  <p>S<small>OMBRA</small>: —¿Qué hora es?</p>

  <p>—La que acaba de pasar. La última.</p>

  <p>S<small>OMBRA</small>: —Hay en la escalera un niño. Es verdad que hace tiempo maltraté a un niño. A ése, precisamente.</p>

  <p>Sombra conocía al niño abandonado en la escalera. Entonces sollozó.</p>
