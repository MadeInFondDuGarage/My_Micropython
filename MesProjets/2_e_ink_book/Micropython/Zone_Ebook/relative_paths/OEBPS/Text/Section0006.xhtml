<body>
  <h2 title="Agua de lumbre">AGUA DE LUMBRE</h2>

  <div class="poema">
    <p class="evitasgc-2">Sí. Llueve…</p>

    <p>el cielo gime montones desteñidos</p>

    <p>sombras mojadas recogen sus trozos</p>

    <p>cavidades barrosas tremendas</p>

    <p>mezquinas gotas de agua sulfurada</p>

    <p>si bien no sé cómo recojo las masas</p>

    <p>de ver si me agita la pálida lumbre</p>

    <p>tremendo espesor de perros y gatos</p>

    <p>las gotas siguen</p>
  </div>
