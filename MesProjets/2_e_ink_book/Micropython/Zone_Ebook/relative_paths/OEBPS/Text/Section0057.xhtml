<body>
  <h2 title="Hija del viento">HIJA DEL VIENTO</h2>

  <div class="poema">
    <p>Han venido.</p>

    <p>Invaden la sangre.</p>

    <p>Huelen a plumas,</p>

    <p>a carencia,</p>

    <p>a llanto.</p>

    <p>Pero tú alimentas al miedo</p>

    <p>y a la soledad</p>

    <p>como a dos animales pequeños</p>

    <p>perdidos en el desierto.</p>

    <p class="salto10">Han venido</p>

    <p>a incendiar la edad del sueño.</p>

    <p>Un adiós es tu vida.</p>

    <p>Pero tú te abrazas</p>

    <p>como la serpiente loca de movimiento</p>

    <p>que sólo se halla a sí misma</p>

    <p>porque no hay nadie.</p>

    <p class="salto10">Tú lloras debajo de tu llanto,</p>

    <p>tú abres el cofre de tus deseos</p>

    <p>y eres más rica que la noche.</p>

    <p class="salto10">Pero hace tanta soledad</p>

    <p>que las palabras se suicidan</p>
  </div>
</body>
