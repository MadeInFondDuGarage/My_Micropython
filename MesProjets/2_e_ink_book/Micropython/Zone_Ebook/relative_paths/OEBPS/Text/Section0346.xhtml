<body>
  <h3 class="oculto" title="no, la verdad no es la música…">o</h3>

  <div class="poema">
    <p class="saltoinicio">no, la verdad no es la música</p>

    <p>yo, triste espera de una palabra</p>

    <p>que nombre lo que busco</p>

    <p>¿y qué busco?</p>

    <p>no el nombre de la deidad</p>

    <p>no el nombre de los nombres</p>

    <p>sino los nombres precisos y preciosos</p>

    <p>de mis deseos ocultos</p>

    <p class="salto10">algo en mí me castiga</p>

    <p>desde todas mis vidas:</p>

    <p>—Te dimos todo lo necesario para que comprendieras</p>

    <p>y preferiste la espera,</p>

    <p>como si todo te anunciase el poema</p>

    <p>(aquél que nunca escribirás porque es un jardín inaccesible</p>

    <p class="salto10">—sólo vine a ver el jardín—)</p>
  </div>

  <p class="salto10 derecha">[1971]</p>
</body>
</html>
