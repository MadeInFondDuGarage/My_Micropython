  <h3 title="Escrito en «anahuac» (talitas)">ESCRITO EN «ANAHUAC» (TALITAS)</h3>

  <p>Verde esencialmente reconcentrado en mis ojos que pintan la hierba que luego echa flores en la memoria de los animales.</p>

  <p class="salto10">Abrazada a la tierra. Tierra o madre o muerte, no me abandones aun si yo me he abandonado.</p>
