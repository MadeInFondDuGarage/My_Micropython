<body>
  <h3 class="oculto" title="el silencio es luz…">o</h3>

  <div class="poema">
    <p class="saltoinicio">y sin ira</p>

    <p>y sin hora</p>

    <p>sin ahora</p>

    <p>sin orar</p>

    <p>sin arar en la memoria</p>

    <p>sin errar en el pasaje de la noche al amor</p>

    <p>y del amor a su espera</p>

    <p class="salto10">y nos iremos en un corazón abandonado</p>

    <p>y nos iremos en el espacio abierto de tu mirada</p>

    <p class="salto10">y nos iremos en un corazón que espera</p>

    <p>amarrado al borde de un precipicio</p>

    <p>no dibujar el itinerario</p>

    <p>no usar la pluma</p>

    <p>sino cuando hablen de pájaros</p>

    <p>nada prever</p>

    <p>para que nada no venga</p>

    <p>y nos iremos como se va la oscuridad</p>

    <p>en la madrugada de las plegarias infantiles</p>

    <p class="salto10">felicidad de nuestros ojos</p>

    <p>ávido de peligros naturales</p>

    <p>será como quien silba junto a un lago</p>

    <p>silba el hecho de silbar</p>

    <p>o canta el hecho de cantar</p>

    <p>(una embarcación de papel atraviesa mi garganta</p>

    <p>adentro bogan dos niños mendigos</p>

    <p>andrajos audaces para despistar al viento</p>

    <p>a la brújula al designio de la noche)</p>
  </div>
