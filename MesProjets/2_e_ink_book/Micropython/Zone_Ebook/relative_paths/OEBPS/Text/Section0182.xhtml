  <h3 title="Nuit de cœur">NUIT DE CŒUR</h3>

  <p class="asangre">Otoño en el azul de un muro: sé amparo de las pequeñas muertas.</p>

  <p class="salto10 asangre">Cada noche, en la duración de un grito, viene una sombra nueva. A solas danza la misteriosa autónoma. Comparto su miedo de animal muy joven en la primera noche de las cacerías.</p>
