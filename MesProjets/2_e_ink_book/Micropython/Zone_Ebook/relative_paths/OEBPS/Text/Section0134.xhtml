<body>
  <h3 title="Duración">DURACIÓN</h3>

  <div class="poema">
    <p>De aquí partió en la negra noche</p>

    <p>y su cuerpo hubo de morar en este cuarto</p>

    <p>en donde sollozos, pasos peligrosos</p>

    <p>de quien no viene, pero hay su presencia</p>

    <p>amarrada a este lecho en donde sollozos</p>

    <p>porque un rostro llama,</p>

    <p>engarzado en lo oscuro,</p>

    <p>piedra preciosa.</p>
  </div>
