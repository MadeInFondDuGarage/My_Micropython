  <h3 title="En esta noche, en este mundo">EN ESTA NOCHE, EN ESTE MUNDO<a href="../Text/notas.xhtml#nt22" id="rf22"><sup>[22]</sup></a>&nbsp;</h3>

  <p class="derecha"><i>A Martha Isabel Moia</i></p>

  <div class="salto25 poema">
    <p>en esta noche en este mundo</p>

    <p>las palabras del sueño de la infancia de la muerte</p>

    <p>nunca es eso lo que uno quiere decir</p>

    <p>la natal castra</p>

    <p>la lengua es un órgano de conocimiento</p>

    <p>del fracaso de todo poema</p>

    <p>castrado por su propia lengua</p>

    <p>que es el órgano de la re-creación</p>

    <p>del re-conocimiento</p>

    <p>pero no el de la resurrección</p>

    <p>de algo a modo de negación</p>

    <p>de mi horizonte de maldoror con su perro</p>

    <p>y nada es promesa</p>

    <p>entre lo decible</p>

    <p>que equivale a mentir</p>

    <p>(todo lo que se puede decir es mentira)</p>

    <p>el resto es silencio</p>

    <p>sólo que el silencio no existe</p>

    <p class="salto10">no</p>

    <p>las palabras</p>

    <p>no hacen el amor</p>

    <p>hacen la ausencia</p>

    <p>si digo agua ¿beberé?</p>

    <p>si digo pan ¿comeré?</p>

    <p class="salto10">en esta noche en este mundo</p>

    <p>extraordinario silencio el de esta noche</p>

    <p>lo que pasa con el alma es que no se ve</p>

    <p>lo que pasa con la mente es que no se ve</p>

    <p>lo que pasa con el espíritu es que no se ve</p>

    <p>¿de dónde viene esta conspiración de invisibilidades?</p>

    <p>ninguna palabra es visible</p>

    <p class="salto10">sombras</p>

    <p>recintos viscosos donde se oculta</p>

    <p>la piedra de la locura</p>

    <p>corredores negros</p>

    <p>los he recorrido todos</p>

    <p>¡oh quédate un poco más entre nosotros!</p>

    <p class="salto10">mi persona está herida</p>

    <p>mi primera persona del singular</p>

    <p class="salto10">escribo como quien con un cuchillo alzado en la oscuridad</p>

    <p>escribo como estoy diciendo</p>

    <p>la sinceridad absoluta continuaría siendo</p>

    <p>lo imposible</p>

    <p>¡oh quédate un poco más entre nosotros!</p>

    <p class="salto10">los deterioros de las palabras</p>

    <p>deshabitando el palacio del lenguaje</p>

    <p>el conocimiento entre la piernas</p>

    <p>¿qué hiciste del don del sexo?</p>

    <p>oh mis muertos</p>

    <p>me los comí me atraganté</p>

    <p>no puedo más de poder más</p>

    <p class="salto10">palabras embozadas</p>

    <p>todo se desliza</p>

    <p>hacia la negra licuefacción</p>

    <p class="salto10">y el perro de maldoror</p>

    <p>en esta noche en este mundo</p>

    <p>donde todo es posible</p>

    <p>salvo</p>

    <p>el poema</p>

    <p class="salto10">hablo</p>

    <p>sabiendo que no se trata de eso</p>

    <p>siempre no se trata de eso</p>

    <p>oh ayúdame a escribir el poema más prescindible</p>

    <p class="evitasgc-9">el que no sirva ni para</p>

    <p class="evitasgc-9">ser inservible</p>

    <p>ayúdame a escribir palabras</p>

    <p>en esta noche en este mundo</p>
  </div>
</body>
