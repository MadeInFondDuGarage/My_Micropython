  <h3 class="oculto" title="Memoria de su voz…">o</h3>

  <p class="saltoinicio">Memoria de su voz en la funesta mañana velada por un sol que reverbera en los ojos de las tortugas.</p>

  <p class="salto10">Es de su voz es un recuerdo que me hace perder el conocimiento frente a esta conjunción celeste y verde de mar y cielo.</p>

  <p class="salto10">Yo preparo mi muerte.</p>
