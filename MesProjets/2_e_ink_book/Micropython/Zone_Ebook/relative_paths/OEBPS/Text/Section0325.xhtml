  <h3 title="Prefacio de sombra (I)">PREFACIO DE SOMBRA (I)<a href="../Text/notas.xhtml#nt25" id="rf25"><sup>[25]</sup></a>&nbsp;</h3>

  <p>La hija de la voz la poseyó en su estar, en su ser, por la tristeza.</p>

  <p class="salto10">Los pequeños pájaros ponzoñosos que se abrevan en un agua negra donde se refleja la maravilla, son sus animales, son sus emblemas. A un tiempo mismo busca calentar su corazón suplicante.</p>

  <p class="salto10">Los perros nocturnos: otro llamamiento.</p>

  <p class="salto20">¿Quién conoce mi humor hiriente? Desde mi libro aullante «alguien mata algo».</p>

  <p class="salto10">Nadie me enciende ninguna lámpara, nadie es del color del deseo más profundo.</p>

  <p class="salto10 derecha">12/VII/1970</p>
