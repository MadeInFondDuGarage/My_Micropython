  <h3 title="Pido el silencio">PIDO EL SILENCIO</h3>

  <div class="derecha">
    <p><i>…canta, lastimada mía</i></p>

    <p>C<small>ERVANTES</small></p>
  </div>

  <div class="salto25 poema">
    <p>aunque es tarde, es noche,</p>

    <p>y tú no puedes.</p>

    <p class="salto10">Canta como si no pasara nada.</p>

    <p class="salto10">Nada pasa.</p>
