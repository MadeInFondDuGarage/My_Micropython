<body>
  <h2 title="Origen">ORIGEN</h2>

  <div class="poema">
    <p>La luz es demasiado grande</p>

    <p>para mi infancia.</p>

    <p>Pero ¿quién me dará la respuesta jamás usada?</p>

    <p>Alguna palabra que me ampare del viento,</p>

    <p>alguna verdad pequeña en que sentarme</p>

    <p>y desde la cual vivirme,</p>

    <p>alguna frase solamente mía</p>

    <p>que yo abrace cada noche,</p>

    <p>en la que me reconozca,</p>

    <p>en la que me exista.</p>

    <p class="salto10">Pero no. Mi infancia</p>

    <p>sólo comprende al viento feroz</p>

    <p>que me aventó al frío</p>

    <p>cuando campanas muertas</p>

    <p>me anunciaron.</p>

    <p class="salto10">Sólo una melodía vieja,</p>

    <p>algo con niños de oro, con alas de piel verde,</p>

    <p>caliente, sabio como el mar,</p>

    <p>que tirita desde mi sangre,</p>

    <p>que renueva mi cansancio de otras edades.</p>

    <p class="salto10">Sólo la decisión de ser dios hasta el llanto.</p>
  </div>
</body>
