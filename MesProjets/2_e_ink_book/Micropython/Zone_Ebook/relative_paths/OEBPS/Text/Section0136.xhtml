<body>
  <h3 title="El olvido">EL OLVIDO</h3>

  <div class="poema">
    <p>en la otra orilla de la noche</p>

    <p>el amor es posible</p>

    <p class="salto10">—llévame—</p>

    <p class="salto10">llévame entre las dulces sustancias</p>

    <p>que mueren cada día en tu memoria</p>
  </div>
