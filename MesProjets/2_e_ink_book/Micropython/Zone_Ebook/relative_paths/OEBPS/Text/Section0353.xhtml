  <h3 title="Alguien mató algo">ALGUIEN MATÓ ALGO<a href="../Text/notas.xhtml#nt35" id="rf35"><sup>[35]</sup></a>&nbsp;</h3>

  <p>la hija de la voz la poseyó en su estar, por la tristeza.</p>

  <p class="salto10">Los pequeños pájaros ponzoñosos que se abrevan en un agua donde se refleja la flor de la maravilla, son sus animales, son sus emblemas, a un tiempo mismo busca calentar su voz suplicante.</p>

  <p class="salto10 derecha">1972</p>
