<body>
  <h2 title="La luz caída de la noche">LA LUZ CAÍDA DE LA NOCHE</h2>

  <div class="poema">
    <p>vierte esfinge</p>

    <p>tu llanto en mi delirio</p>

    <p>crece con flores en mi espera</p>

    <p>porque la salvación celebra</p>

    <p>el manar de la nada</p>

    <p class="salto10">vierte esfinge</p>

    <p>la paz de tus cabellos de piedra</p>

    <p>en mi sangre rabiosa</p>

    <p class="salto10">yo no entiendo la música</p>

    <p>del último abismo</p>

    <p>yo no sé del sermón</p>

    <p>del brazo de hiedra</p>

    <p>pero quiero ser del pájaro enamorado</p>

    <p>que arrastra a las muchachas</p>

    <p>ebrias de misterio</p>

    <p>quiero al pájaro sabio en amor</p>

    <p>el único libre</p>
  </div>
</body>
</html>
