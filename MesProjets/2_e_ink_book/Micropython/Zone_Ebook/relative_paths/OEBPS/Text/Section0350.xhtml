  <h3 title="Recuerdos de la pequeña casa del canto">RECUERDOS DE LA PEQUEÑA CASA DEL CANTO<a href="../Text/notas.xhtml#nt33" id="rf33"><sup>[33]</sup></a>&nbsp;</h3>

  <p>Era azul como su mano en el instante de la muerte. Era su mano crispada, era el último orgasmo. Era su pija parada como un pájaro que está por llover, parada para recibirla a ella, la muerte, la amante (o no)</p>

  <p>Ya no sé hablar. ¿Con quién?</p>

  <p>Nunca encontré un alma gemela. Nadie fue un sueño. Me dejaron con los sueños abiertos, con mi herida central abierta, con mi desgarradura. Me lamento; tengo derecho a hacerlo. Asimismo, desprecio a los que no se interesan por mí. Mi sólo deseo ha sido</p>

  <p>No lo diré. Hasta yo, o sobre todo yo, me traiciono. Como un niño de pecho he acallado mi alma. Ya no sé hablar. Ya no puedo hablar. He desbaratado lo que me dieron, que era todo lo que tenía. Y es otra vez la muerte. Se cierne sobre mí, es mi único horizonte. Nadie se parece a mi sueño. He sentido amor y lo maltrataron, sí, a mí que nunca había querido. El amor más profundo desaparecerá para siempre. ¿Qué podemos amar que no sea una sombra? Murieron ya los sueños sagrados de la infancia y la naturaleza también, la que amaba</p>

  <p class="salto10 derecha">abril, 1972</p>
