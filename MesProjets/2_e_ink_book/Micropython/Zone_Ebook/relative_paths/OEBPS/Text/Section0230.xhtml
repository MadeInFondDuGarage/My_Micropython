  <h3 title="A plena pérdida">A PLENA PÉRDIDA</h3>

  <p>Los sortilegios emanan del nuevo centro de un poema a nadie dirigido. Hablo con la voz que está detrás de la voz y emito los mágicos sonidos de la endechadora. Una mirada azul aureolaba mi poema. Vida, mi vida, ¿qué has hecho de mi vida?</p>
