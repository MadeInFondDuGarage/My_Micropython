  <h3 title="La canción para el yacente">LA CANCIÓN PARA EL YACENTE<a href="../Text/notas.xhtml#nt17" id="rf17"><sup>[17]</sup></a>&nbsp;</h3>

  <div class="poema">
    <p>Todo el día llora por mí el invisible de siete rostros.</p>

    <p>El inocente en su espacio de suplicios.</p>

    <p>El nacido de su irse.</p>

    <p>Toda la noche sueña en mí el yacente.</p>

    <p>Violentamente inmóvil sonríe el bienamado.</p>

    <p>Elegías a mi mal son sus fúnebres sueños.</p>
  </div>
