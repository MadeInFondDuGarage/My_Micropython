  <h3 title="En la noche">EN LA NOCHE<a href="../Text/notas.xhtml#nt11" id="rf11"><sup>[11]</sup></a>&nbsp;</h3>

  <div class="asangre">
    <p>Cae la noche, y las muñecas proyectan maravillosas imágenes en colores.</p>

    <p>Cada imagen está unida a otra imagen por una pequeña cuerda. Escucho, uno a uno, y muy distintamente, ruidos y sonidos.</p>
