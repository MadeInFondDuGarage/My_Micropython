<body>
  <h2 title="La danza inmóvil">LA DANZA INMÓVIL</h2>

  <div class="poema">
    <p>Mensajeros en la noche anunciaron lo que no oímos.</p>

    <p>Se buscó debajo del aullido de la luz.</p>

    <p>Se quiso detener el avance de las manos enguantadas</p>

    <p>que estrangulaban a la inocencia.</p>

    <p class="salto10">Y si se escondieron en la casa de mi sangre,</p>

    <p>¿cómo no me arrastro hasta el amado</p>

    <p>que muere detrás de mi ternura?</p>

    <p>¿Por qué no huyo</p>

    <p>y me persigo con cuchillos</p>

    <p>y me deliro?</p>

    <p class="salto10">De muerte se ha tejido cada instante.</p>

    <p>Yo devoro la furia como un ángel idiota</p>

    <p>invadido de malezas</p>

    <p>que le impiden recordar el color del cielo.</p>

    <p class="salto10">Pero ellos y yo sabemos</p>

    <p>que el cielo tiene el color de la infancia muerta.</p>
  </div>
</body>
