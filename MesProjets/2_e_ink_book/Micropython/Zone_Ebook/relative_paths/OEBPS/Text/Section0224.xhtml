  <h3 title="La palabra que sana">LA PALABRA QUE SANA</h3>

  <p>Esperando que un mundo sea desenterrado por el lenguaje, alguien canta el lugar en que se forma el silencio. Luego comprobará que no porque se muestre furioso existe el mar, ni tampoco el mundo. Por eso cada palabra dice lo que dice y además más y otra cosa.</p>
