  <h3 class="oculto" title="La canción desesperada…">o</h3>

  <p class="saltoinicio">La canción desesperada no se deja decirse. La materia verbal errante no cesa de emanar del centro que no es centro, del mareo de las flores auríferas imbuidas del oro de los buscadores de oro.<a href="../Text/notas.xhtml#nt31" id="rf31"><sup>[31]</sup></a></p>
